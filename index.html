<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="초성검색">
<title>해운실무 초성검색</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#111418; --text2:#474e59; --line:#dcdfe5;
  --accent:#0b5cad;
  --ok:#0b6435; --ok-bg:#e5f3ea; --ok-line:#b5dcc4;
  --warn:#6e4300; --warn-bg:#fff3d1; --warn-line:#ecd083;
  --mark:#ffe066; --mark-text:#111;
  --chip-on:#111418; --chip-on-text:#fff;
  --pad-bg:#e6e9ee; --key:#fff; --key-fn:#d0d5dd; --key-down:#b9c0ca; --key-shadow:rgba(0,0,0,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111317; --card:#1b1e24; --text:#f1f3f5; --text2:#b5bcc6; --line:#2e333c;
    --accent:#86baff;
    --ok:#86e3ad; --ok-bg:#14291d; --ok-line:#25523a;
    --warn:#ffd685; --warn-bg:#2c2312; --warn-line:#5d4a1f;
    --mark:#8f7300; --mark-text:#fff;
    --chip-on:#f1f3f5; --chip-on-text:#111317;
    --pad-bg:#0a0c0f; --key:#2c3038; --key-fn:#1d2026; --key-down:#474d58; --key-shadow:rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding-bottom:calc(var(--padh,200px) + 12px)}
body.padoff{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{padding-top:8px;padding-bottom:2px}
.search{position:relative}
.search input{width:100%;height:52px;font-size:24px;font-weight:700;letter-spacing:3px;padding:0 50px 0 14px;
  border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none;
  -webkit-appearance:none;appearance:none;caret-color:var(--accent)}
.search input::placeholder{font-size:16px;font-weight:400;letter-spacing:0;color:var(--text2)}
.search input:focus{border-color:var(--accent)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;
  background:transparent;color:var(--text2);font-size:26px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip .n{color:var(--text2);margin-left:4px;font-size:12px}
.chip.on{background:var(--chip-on);color:var(--chip-on-text);border-color:var(--chip-on)}
.chip.on .n{color:inherit;opacity:.75}
.chip.opt.on::before{content:"✓ "}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.status{font-size:14px;color:var(--text2);margin:10px 2px 0}
.hint{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:10px;font-size:14px;color:var(--text2)}
.sec-t{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.link{border:0;background:none;color:var(--accent);font-size:13px;padding:4px 2px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex + .sec-t{margin-top:12px}
.ex button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 11px;font-size:15px}
.ex b{color:var(--accent);margin-right:5px}
.ex b:only-child{margin-right:0}
.tip{margin-top:10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px 2px;margin:8px 0;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.tag{font-size:12px;color:var(--text2);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.q{margin:0 0 8px;font-size:16px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.ans{display:flex;gap:8px;width:100%;text-align:left;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);
  border-radius:10px;padding:8px 12px;font-weight:700;font-size:17px;word-break:keep-all;overflow-wrap:anywhere}
.ans .no{flex:none}
.ans.veil{justify-content:center;min-height:46px;align-items:center;background:var(--bg);color:var(--text2);border:1px dashed var(--line);font-weight:600}
.note{margin-top:8px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:10px;padding:7px 12px;font-size:14px}
.opts{list-style:none;margin:9px 0 0;padding:6px 0 0;border-top:1px dashed var(--line)}
.opts li{display:flex;gap:6px;padding:4px 0;font-size:15px;color:var(--text2);word-break:keep-all;overflow-wrap:anywhere}
.opts li span:first-child{flex:none}
.opts li.ok{color:var(--ok);font-weight:700}
.foot{text-align:right;color:var(--accent);font-size:14px;padding:7px 0}
.foot:empty{padding:4px 0}
mark{background:var(--mark);color:var(--mark-text);border-radius:3px}
.empty{text-align:center;color:var(--text2);padding:36px 0}
.more{display:block;width:100%;margin:12px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}

.pad{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--pad-bg);border-top:1px solid var(--line);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));transition:transform .18s ease;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad.off{transform:translateY(110%)}
.keys{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.k{height:54px;border:0;border-radius:10px;background:var(--key);font-size:24px;font-weight:600;padding:0;
  box-shadow:0 1px 0 var(--key-shadow)}
.k:active{background:var(--key-down)}
.k.fn{font-size:15px;font-weight:600;background:var(--key-fn)}
.k.space{grid-column:span 3}
.k.back{grid-column:span 2;font-size:22px}
.pad-show{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9;height:54px;padding:0 20px;
  border:0;border-radius:27px;background:var(--chip-on);color:var(--chip-on-text);font-size:18px;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.28)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="search">
      <input id="q" type="search" inputmode="none" placeholder="아래 초성을 눌러 찾기" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="초성 검색">
      <button class="clear" id="clear" aria-label="지우기" hidden>×</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap">
  <div class="status" id="status"></div>
  <div class="hint" id="hint"></div>
  <div id="list"></div>
  <button class="more" id="more" hidden>더 보기</button>
</main>
<div class="pad" id="pad">
  <div class="keys" id="keys"></div>
</div>
<button class="pad-show" id="padShow" hidden>ㄱㄴㄷ</button>
<script>
(function(){
"use strict";
const SHEETS=["정기선·부정기선","선하증권·복합운송","선박운용·터미널","해운경영·법규","헷갈리는거"];
const OPTS=[["expand","보기 펼치기"],["hide","정답 가리기"],["all","보기까지 검색"]];
const EXAMPLES=[["ㅊㅅㄹ","체선료"],["ㅈㅊㄹ","조출료"],["ㅂㅈㅇㅇ","부적운임"],["ㄴㅇㅅ","나용선"],["ㅈㅅㅅ","지시식"],["ㅎㅅㅎㅁㅇㅅㅈ","해상화물운송장"]];
const KEYS="ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ";
const DATA=[{"id":0,"t":[[0,"1"]],"q":"컨테이너 운송의 장점으로 적당하지 않은 것은?","c":["컨테이너를 이용함으로써 운송비, 포장비, 보험료 등을 절감할 수 있다.","컨테이너 운송은 신속하다.","컨테이너 운송은 안전하다.","컨테이너 운송은 하역시간과 정박시간이 길다."],"a":3},{"id":1,"t":[[0,"2"]],"q":"부정기선 경영의 특성으로 맞지 않는 것은?","c":["화물의 가치가 중량이나 용적에 비하여 상대적으로 적다.","화물이 대량이며, 수송단위가 크다.","화물을 한번 싣게 되면 거의 만선이 된다.","항로에 제한을 받으며, 운임이 유리한 화물을 선택할 수 있다."],"a":3},{"id":2,"t":[[0,"3"]],"q":"부정기선 선박운항의 특징으로 맞지 않는 것은?","c":["항로 배선시 다음 항해가 가급적 공선항해가 되도록 한다.","화물의 출하 시기, 해상 물동량의 증감 등에 관한 정보를 수집․판단한다.","육상 설비에 많은 투자를 할 필요가 없다.","부정기선 운임 시장은 선복의 수급에 따라 운임률이 급격하게 변동한다."],"a":0},{"id":3,"t":[[0,"4"]],"q":"해운은 실시해 온 대다수 국가에서 정기선 해운에 역점을 두는 의의로 맞지 않는 것은?","c":["자국의 정기선 항로를 개설하고 적정 선박량을 유지함으로써 자국 화주에게 안정적인 운임으로 정기적인 해운 서비스를 제공한다.","정기적인 배선에 의해 수출입 화물을 적기에 수송함으로써 교역상의 편의를 제공한다.","지속적으로 수송항로를 유지함으로써 당사국간의 교역 촉진과 경제 발전에 기여한다.","농산물, 광산물 등 break-bulk cargo를 전문적으로 운송하여 지역경제 발전에 기여한다."],"a":3},{"id":4,"t":[[0,"5"]],"q":"정기선 해운의 서비스에 대한 설명으로 적합하지 않는 것은?","c":["정기선 운항선박은 선박의 가격이 부정기선 운항선박에 비해 저렴하다.","정기선의 운송화물은 완제품 또는 반제품 등의 공산품이 주종이다.","정기선의 송장가격은 부정기선에 비해 비싸다.","정기선 화물의 운임은 부정기선 화물에 비해 높은 편이다."],"a":0},{"id":5,"t":[[0,"6"],[4,""]],"q":"정기선 해운이 취급하는 일반화물의 종류가 아닌 것은?","c":["정량화물","고가화물","단위화물","액체화물"],"a":1},{"id":6,"t":[[0,"7"]],"q":"정기선의 일반화물 중에서 조잡화물(rough cargo)의 종류가 아닌 것은?","c":["더러운 화물(dirty cargo)","먼지나는 화물(dusty cargo)","부식성 화물(corrosive cargo)","냄새나는 화물(smelled cargo)"],"a":2},{"id":7,"t":[[0,"8"]],"q":"화물 또는 포장된 화물을 적입하여 운반하는 용기를 일컬는 말은 다음 중 어느 것인가?","c":["팔레트(pallet)","컨테이너(container)","패키지(package)","박스(box)"],"a":1},{"id":8,"t":[[0,"9"],[4,""]],"q":"컨테이너의 성질을 설명한 것 중 적절하지 않은 것은?","c":["항구적인 성질","반복사용이 가능할 정도의 견고성","화물의 적입 및 적출이 용이하게 설계","1m³(35.3ft³) 이하의 내용 적을 구비"],"a":3},{"id":9,"t":[[0,"10"]],"q":"선사가 리스회사 소유의 컨테이너를 사용할 경우 그 이점을 기술한 것 중 적절하지 않은 것은?","c":["자금고정화의 확대","감가상각 불필요","노후화된 장비의 위험 방지","유지관리비 절감"],"a":0},{"id":10,"t":[[0,"11"]],"q":"컨테이너를 통상 3년에서 5년간의 사용을 목적으로 리스하는 것을 무엇이라고 하는가?","c":["단기 리스(shor-term lease)","편도 리스(one-way lease)","장기 리스(long-term lease)","왕복 리스(two-way lease)"],"a":2},{"id":11,"t":[[0,"12"]],"q":"컨테이너에 사용되는 재질이 아닌 것은?","c":["철재(steel)","알루미늄(aluminium)","플라스틱(plastics)","특수 플라스틱(fiberglass plastics)"],"a":2},{"id":12,"t":[[0,"13"]],"q":"알루미늄으로 제작한 컨테이너의 장점은?","c":["수리 용이","외부 충격에 강함","외양이 좋음","가격 저렴"],"a":2},{"id":13,"t":[[0,"14"]],"q":"컨테이너를 용도에 의한 분류에 타당하지 않은 것은?","c":["일반화물 컨테이너","온도조절 컨테이너","특수컨테이너","특수플라스틱 컨테이너"],"a":3},{"id":14,"t":[[0,"15"]],"q":"특수컨테이너 중 음료, 주류, 액체류, 화확제품을 운송하는데 사용되는 컨테이너는?","c":["탱크 컨테이너(Tank container)","벌크 컨테이너(Bulk container)","사이드 오픈 컨테이너(Side open container)","플랫폼 컨테이너(Plaftform container)"],"a":0},{"id":15,"t":[[0,"16"]],"q":"정기선 항로에 운항중인 선박으로 1960년대 부터 일반잡화, 액체화물, 냉동화물을 적재할 수 있도록 된 선박은?","c":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":1},{"id":16,"t":[[0,"17"]],"q":"정기선 항로에 운항중인 선박으로 주로 컨테이너, 자동차, 벌크화물 등을 운송하늠 선박은?","c":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":2},{"id":17,"t":[[0,"18"]],"q":"컨테이너 전용 터미널을 갖추지 않은 항로인 아프리카, 중남미, 동남아 할로 등에서 주로 운항되는 선박은?","c":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":0},{"id":18,"t":[[0,"19"]],"q":"신형다목적선(Sophisticated mutipurpose cargo liner)의 특징을 서술한 것 중 잘못 기술한 것은?","c":["40,000~50,000 WT 급 선박","주로 컨테이너, 자동차, 벌크화물 등을 운송","선박 건조가격이 매우 저렴","지브 크레인(jib crane), 갠트리 크레인(gantry crane) 등의 하역장비 장착"],"a":2},{"id":19,"t":[[0,"20"]],"q":"선박 내에 4~5개의 선창을 갖추고 각 선창은 중갑판으로 구조된 선박으로 1970년대 초부터 많이 건조된 선박은?","c":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":0},{"id":20,"t":[[0,"21"]],"q":"선창 내에 컨테이너만을 적재하기 위해 받침대(cell guides "부정기선의 개념을 정의한 것으로 거리가 먼 것은?","c":["유조선, 광탄전용선, 살화물선 등과 같이 배 전체에 한 종류의 화물을 선적한다.","항해 용선계약(Voyage Charter)하에 만선 운항하는 선박으로 대량화물운송에 전문화되어 있다.","화주가 선적 가능한 화물, 운항 가능한 항로, 그리고 적절한 운임만 제시한다면 선주는 선적항, 양하항의 위치와 관계없이 운송계약과 함께 운항하는 선박을 말한다.","부정기선은 one ship, one cargo의 운송형태로 선박이 운항된다."],"a":3},{"id":53,"t":[[0,"54"]],"q":"다음 중 부정기 선의 유형으로 타당하지 않은 것은?","c":["살물선(Bulk Carrier)","유조선(Tanker)","자동차 운반선(Car Carrier)","컨테이너 전용선(Full container ships)"],"a":3},{"id":54,"t":[[0,"55"]],"q":"부정기선시장에 대한 특성을 기술한 것으로 적절하지 못한 것은?","c":["다수의 선주가 수 많은 화주의 화물을 운송하기 위해 경쟁하는 완전경쟁시장임","소규모의 선주들이 많고 운임만 만족스럽다면 항로나 화물의 성질은 중요치 않음","수요와 공급의 원칙에 반해 수요의 증감에 따라 운임 등락의 변동성이 약함","운임은 화물, 화물량, 항로, 기항 항, 계절 등 여러 요소들을 고려하여 결정됨"],"a":2},{"id":55,"t":[[0,"56"]],"q":"부정기선시장에서 용선중개인이 계약관계를 face-to-face로 거래를 하는 시장은 어디 인가?","c":["영국 런던(Baltic Exchange)","노르웨이 오슬로","일본 동경","미국 뉴욕(New York Maritime Exchange)"],"a":0},{"id":56,"t":[[0,"57"]],"q":"부정기선 해운산업은 높은 리스크가 있으므로 많은 정보가 필요로 하는데 이에 해당사항이 먼 것은?","c":["선박의 이용가능성(availability of ships)","운임률","용선시장의 연속적인 변동(consequent fluctuations)","운항자의 개인 신용도"],"a":3},{"id":57,"t":[[0,"58"]],"q":"부정기선시장에서 다양한 이해 관계를 지닌 관계자중 시장에서 주도적인 역할을 수행하는 당사자가 아닌 것은?","c":["화주(Trader)","운항자(oprator)","용선중개인(Broker)","보험대리인"],"a":3},{"id":58,"t":[[0,"59"],[4,""]],"q":"다음 중 부정기선 시장에서 화주의 역할로 적당한 것은?","c":["선박을 직접 소유하지는 않으나 1년 내지 2년 장기로 용선하여 화물을 확보 및 운송을 하는 자","화물을 직접 소유 혹은 구매하거나 중간 매매에 관계된 자","항해운송계약을 비롯한 각종 용선계약체결을 주도하는 자","선박의 건조와 해체를 포함하여 매각 및 매입을 하는 자"],"a":1},{"id":59,"t":[[0,"60"]],"q":"용선중개인(Broker)의 기능을 설명한 것 중 거리가 먼 것은?","c":["용선을 중개한다.","선박의 투입과 거래 그리고 기타 해운관련 직업에 관계하는 등 다양한 기능을 수행한다.","용선계약체결 시 중간자로서 선주와 선주, 선주와 화주를 연계시키는 역할을 한다.","선사가 화물을 확보한 후, 시황의 변동 혹은 가용 선박의 미확보등을 사유로 계약을 다른 선사에게 되파는 (Cargo-Relet)의 역할을 한다."],"a":3},{"id":60,"t":[[0,"61"]],"q":"용선중개인(Broker)의 기능 중에서 용선관련 재무관련 업무 수행을 행 하는데 이와 관계가 먼 것은?","c":["용선계약서의 작성","계약 후속조치와 변경사항 정리","화물을 직접 구매","운임/용선료 송금 및 수취"],"a":2},{"id":61,"t":[[0,"62"]],"q":"다음 중 부정기선 해운시장의 특성을 간략하게 서술한 것 중 적절하지 못한 것은?","c":["해운산업의 주체인 선주와 화주가 다양하다.","운임 조정 및 통제력이 높다.","다른 산업에 비해 시장 진입 및 퇴출 장벽이 낮다.","제도적 장치를 이용하는 경우가 있다."],"a":1},{"id":62,"t":[[0,"63"]],"q":"부정기선 해운산업의 운임시장에서 운임 조정 및 통제력이 적다라고 하는데 그 이유로 적당하지 않은 것은?","c":["해운시작에서 지분이 매우 미비","영세한 기업구조","상호간의 통합능력 부족","Pool제도 도입으로 하나의 관리체제"],"a":3},{"id":63,"t":[[0,"64"]],"q":"해운산업에서 부정기선 시장 진입 장벽이 낮다고 보는 이유로 적당하지 않은 것은?","c":["신조 선박이나 중고 선박을 구입할 자금을 소유하거나 용선 할 수 만 있다면 부정기선을 운영할 수 있다.","해운선사를 운영할 수 있는 전문지식이나 자본기반도 없어도 진입할 수 있다.","발달된 조직구조나 제도가 필요없다.","시장졍쟁원리의 지배를 받기 때문에 자율적으로 제한하는 장치가 없다."],"a":3},{"id":64,"t":[[0,"65"]],"q":"다음 중 부정기선 시황의 변동요인으로 거리가 먼 것은?","c":["전세계 해상물동량","용선계약료","부정기선 선복수급","세계의 급작스러운 사건"],"a":1},{"id":65,"t":[[0,"66"]],"q":"최근들어 부정기선의 선복을 탄력적으로 공급하고 있는 이류로 관계가 적절하지 못한 것은?","c":["부정기선의 중소형화","고가의 선박건조비","효율적인 운항 및 관리","선주들간의 경쟁력 제고"],"a":0},{"id":66,"t":[[0,"67"]],"q":"부정기선 해운 시장의 수요에 영향을 끼치는 요소가 아닌 것은?","c":["세계 경제동향(World Economy)","해상물동량(Seaborne Commodity Trades)","평균 운항거리(Average Haul)","운항환경(Operating Environment)"],"a":3},{"id":67,"t":[[0,"68"]],"q":"해상운송 수요에 대한 개별 상품무역의 중장기적 영향에 관한 설명중 적절하지 못한 것은?","c":["특별한 물품에 대한 수요의 변화","물품 공급원의 변화","운송수요의 계절적 변화","생산기술의 변화"],"a":2},{"id":68,"t":[[0,"69"]],"q":"부정기선 시장의 공급에 영향을 끼치는 요소로 적당하지 않은 것은?","c":["가용 선대량(Merchant fleet)","운송비용(Transport Cost)","해체율과 해손율(Scrapping and Losses)","선대 생산성(Fleet Performance and Productivity)"],"a":1},{"id":69,"t":[[0,"70"]],"q":"해운시장에서 미래의 수요를 예측하기 위해 선박 건조 시점은 언제가 유리하는 가?","c":["해운시황의 불황기가 끝날 무렵","해운시황의 불황기가 시작할 무렵","해운시황의 침체기가 시작될 무렵","해운시황의 호황기가 끝날 무렵"],"a":0},{"id":70,"t":[[0,"71"]],"q":"해운 운임의 주기적인 변동은 무엇에 의해 발생하는 가?","c":["신건조 인도와 선박의 노후화","선박 해체율과 해손율","선복의 수요와 공급의 균형 및 불균형","현재의 수익률"],"a":2},{"id":71,"t":[[0,"72"]],"q":"다음은 해운 운임의 변동에 관한 설명으로 적절하지 않은 것은?","c":["단기적인 운임변동은 주로 국지적인 화물과 선박의 수급 불균형에 의해 발생","계절적인 운임변동은 1년 중 특정 기간에 운임의 변동이 예상되는 경우로 주로 곡물 수확기를 중심으로 발생","주기적인 변동은 세계 경제 또는 경제 권역별 경제 성장 또는 생산율, 고용상태 등의 일반적인 환경에 의해 발생","주기적인 변동은 주로 그 변화 주기가 잛은 것이 특징으로 등락이 깊음"],"a":3},{"id":72,"t":[[0,"73"]],"q":"부정기선 운임결정에 영향을 주는 요인으로 관계가 먼 것은?","c":["경제성장과 교역량","일시 rence)과 폐쇄식동맹(Closed Conference)이 있다.","해운동맹은 계약운임제도(Contract Rate System), 운임환불제도(Freight Rebate System) 등의 수단으로 화주를 구속하기도 한다.","해운동맹의 주요기능으로는 운임협정, 항해협정, 운임공동계산협정 등이 있다."],"a":0},{"id":84,"t":[[0,"85"]],"q":"다음 중 항해용선계약의 주요 계약내용이라고 볼 수 없는 것은?","c":["선박의 속도","하역조건","정박기간","운임"],"a":0},{"id":85,"t":[[0,"86"]],"q":"다음 중 화물운송계약에 관한 설명중 옳은 것은?","c":["용선운송계약이란 운송인이 다수의 송화인으로부터 개개의 화물을 운송할 것을 인수하는계약을 말한다.","나용선계약이란 화물 운송을 위하여 선주로부터 선복의 일부를 용선하는 계약을 말한다.","기간용선계약은 하루 단위로 선복을 빌리는 일대용선계약을 말한다.","항해용선계약이란 특정의 항구로부터 항구까지 화물을 운송하기 위하여 용선하는 계약을 말한다."],"a":3},{"id":86,"t":[[0,"87"]],"q":"다음 중 부정기선의 특징과 관련이 있는 것은?","c":["주로 광석, 곡류, 목재등 살화물의 대량운송에 이용되고 있다.","항로가 일정하고 정기적으로 운항된다.","일반적으로 해운동맹에 가입한다.","운임은 운임율표에 따른다."],"a":0},{"id":87,"t":[[0,"88"]],"q":"다음 중 20 feet Container에 관한 설명으로 옳은 것은?","c":["화물의 중량을 20톤까지 적재할 수 있는 컨테이너","높이와 폭의 합계가 20피트인 컨테이너","길이가 20피트인 컨테이너","높이는 8피트, 폭은 20피트인 컨테이너"],"a":2},{"id":88,"t":[[0,"89"]],"q":"다음 중 용선 계약시 하역기간을 하역작업이 가능한 일자중 공휴일은 그 산정에서 제외하는 방법은?","c":["Running Laydays","Customary Quick Despatch","WWD SHEX","Weather Working Days"],"a":2},{"id":89,"t":[[0,"90"],[4,""],[4,""]],"q":"정기선에 대한 일반적인 설명으로 옳지 않는 것은?","c":["부정기선보다 운임의 변동폭이 크다.","소량이고 다종 다양한 화물로 구성된다.","운항형태가 규칙적이고 반복적이다.","부정기선보다 운임이 저렴하다."],"a":0},{"id":90,"t":[[0,"91"]],"q":"송화인이 컨테이너를 이용하기 위하여 반출이나 반입할 때 작성하는 서류는?","c":["Dock Receipt","Container Receipt","Booking Note","Equipment Receipt"],"a":3},{"id":91,"t":[[0,"92"],[4,""]],"q":"다음 중 정기선 운임시장의 특성으로 옳은 것은?","c":["운임율이 시장기능에 따라 변한다.","카르텔이 형성되어 있어 시장에의 진입이 상대적으로 어렵다.","선주의 시장통제능력이 크지 않다.","경쟁을 제한하는 제도적 장치가 전무하다."],"a":1},{"id":92,"t":[[0,"93"]],"q":"다음 중 해운동맹의 주요 협정 내용이 아닌 것은?","c":["해상보험협정","운임협정","배선협정","공동계산협정"],"a":0},{"id":93,"t":[[0,"94"]],"q":"컨테이너를 직접 적재하기 위하여 정열해 놓은 곳을 무엇이라 하는가?","c":["Storage Yard","Marshalling Yard","apron","Container Freight Station"],"a":1},{"id":94,"t":[[0,"95"]],"q":"선박의 정박기간을 당해 항구에서의 관습적 조속하역으로 설정한 조건은?","c":["CQD","Running laydays","SHEX","WWD"],"a":0},{"id":95,"t":[[0,"96"]],"q":"수출입 통계 및 항만 물동량 통계의 기준이 되는 컨테이너 규격은?","c":["8 feet","20 feet","35 feet","40 feet"],"a":1},{"id":96,"t":[[0,"97"]],"q":"다음 컨테이너중 식품이나 수산물의 운송에 적합한 것은?","c":["Dry Container","Reefer Container","Open Top Container","General Ship"],"a":1},{"id":97,"t":[[0,"98"],[4,""]],"q":"선박의 현측을 통하여 크레인 등으로 화물을 하역하는 방식을 무엇이라 하는가?","c":["RO/RO","FO/FO","LO/LO","Lash"],"a":2},{"id":98,"t":[[0,"99"]],"q":"다음 중 컨테이너운송의 장점을 최대한도로 이용한 운송 방법은?","c":["CFS/CFS","CFS/CY","CY/CFS","CY/CY"],"a":3},{"id":99,"t":[[0,"100"]],"q":"RORO운송과 같이 본선에 난간(Ship's Rail)을 이용할 수 없는 무역거래에서 FOB조건을 채택할 수 없는 경우에 이용할 수 있는 적합한 정형거래조건은?","c":["FCA","CIP","DDP","FAS"],"a":0},{"id":100,"t":[[0,"101"]],"q":"다음 중 컨테이너에 관련된 국제협약이 아닌 것은?","c":["컨테이너 통관협약","TIR 협약","컨테이너 안전협약","TCM 조약"],"a":3},{"id":101,"t":[[0,"102"]],"q":"다음에서 하역비부담에 의한 분류에서 FIO(Free In and Out)조건으로 알맞은 것은?","c":["적하와 양하에 들어가는 하역비를 선주가 부담","적하와 양하에 들어가는 하역비를 하주가 부담","적하에 들어가는 하역비를 화주가 부담하고 양하에 들어가는 하역비를 선주가 부담","적하에 들어가는 하역비를 선주가 부담하고 양하에 들어가는 하역비를 하주가 부담"],"a":1},{"id":102,"t":[[0,"103"]],"q":"해상운송의 하역비 부담조건 중에서 적하작업에 들어가는 하역비를 하주가 부담하고 양하작업에 들어가는 하역비는 선주가 부담하는 조건은 무엇인가?","c":["Berth Term","FO(Free Out)","FI(Free In)","FIO(Free In and Out)"],"a":2},{"id":103,"t":[[0,"104"],[4,""]],"q":"다음의 부정기선 운항형태 중 선박만을 용선하여 인적 및 물적요소 전체를 용선자가 부담하는 방식은 무엇인가?","c":["항해용선(Voyage Charter)","일대용선(Daily Charter)","선복용선(Lump-sum Charter)","나용선(Bare-boat Charter)"],"a":3},{"id":104,"t":[[0,"105"]],"q":"컨테이너 터미널의 마샬링야드(Marshalling Yard)에 대한 설명으로 옳은 것은?","c":["항만에 있어서 본선 안벽의 바로 배후에 있는 부분으로 컨테이너 하역장비가 설치된 곳이다.","선적해야 할 컨테이너를 하역 순서대로 정열해두거나 양하된 컨테이너를 배치해 놓은 장소를 말한다.","컨테이너 1 개를 채울 수 없는 소량화물을 보관하거나 컨테이너에 적입하는 장소를 말한다.","컨테이너 터미널 내에 있는 여러 종류의 하역기기를 수리, 점검하는 장소를 말한다."],"a":1},{"id":105,"t":[[0,"106"]],"q":"해상운송에 있어서 정기선운송(Liner)과 부정기선운송(Tramper)의 비교에 대한 설명 중 맞지 않는 것은?","c":["정기선 운송은 이종화물을 취급하고, 부정기선 운송은 동종화물을 취급한다.","정기선 운송은 화주의 요구에 따라 서비스가 조정되고, 부정기선 운송은 선주와 용선자간의 협의에 의해 서비스가 결정된다.","운송계약은 정기선 운송은 선하증권(B/L)으로 체결하고, 부정기선 운송은 용선계약서(Charter Party)로 체결한다.","정기선 운송은 중개인이 화물집화를 담당하는 반면에 부정기선 운송은 영업부 직원이 화물집화를 담당한다."],"a":3},{"id":106,"t":[[0,"107"]],"q":"다음에서 내륙 컨테이너 기지(Inland Container Depot ; ICD)의 설명과 거리가 먼 것은?","c":["ICD는 원래 내륙통관기지를 뜻하는 Inland Clearance Depot의 의미로 쓰였다.","본선작업과 마샬링(Marshalling) 기능을 수행하는 기능을 갖고 있다.","운송의 거점으로서 대량운송의 실현, 공차율의 감소, 운송회전율의 증가등을 통한 운송의 합리화를 실현하고 있다.","세관 통관하에 수출입 및 연계운송을 위하여 일시적인 장치, 창고보관, 재수출, 일시상륙 등의 기능을 담당하는 장소이다."],"a":1},{"id":107,"t":[[0,"108"]],"q":"다음중 편의치적(Flags of Convenience)을 선호하는 이유가 아닌 것은?","c":["운항 및 안전기준의 철저한 이행","자국선원을 승선시키는 것에 비해 인건비 절감","국제금융시장의 이용 용이","운항에 따른 세금의 면제"],"a":0},{"id":108,"t":[[0,"109"]],"q":"다음은 내륙컨테이너기지(ICD: Inland Container Depot)의 특성을 나타낸 것이다. 특성에 해당되지 않는 것은?","c":["ICD에서는 많은 기능들이 수행되고 있으나 그 중에서도 화물의 혼재, 컨테이너의 배치, 적재 및 해체 등은 필수적인 임무로 간주되고 있다.","ICD는 전통적으로 항만에서 수행되는 기능 및 서비스의 대부분을 담당하고 있는 까닭에 내륙항(Inland Port)이라고도 불리우며, 그 결과 항만에서의 보관시설 부족문제를 해소한다.","ICD의 기능적 구조범위는 매우 넓어 세관, 선사, 철도회사, 트럭회사, 포워더, 은행, 보험회사, 컨테이너 수리소, 포장회사, 관련 정부기관 등이 위치하게 된다.","ICD는 화물의 출발지와 최종목적지가 다른 소량의 컨테이너화물을 만재컨테이너화함으로써 소량화주에게 운송비의 절감을 가져다 줄 수 있으나 대량화주에게는 경제적 의미가 없다."],"a":3},{"id":109,"t":[[0,"110"]],"q":"컨테이너선의 변형으로 컨테이너 대신에 규격화된 전용 선박을 운송단위로 사용하며, 부선에 화물을 적재한 상태로 본선에 적입 및 운송하는 선박은 무엇인가?","c":["유송선","래쉬선(LASH)","특수선","카페리(Car Ferry)"],"a":1},{"id":110,"t":[[0,"111"]],"q":"다음 중 화물의 종류나 화주에 관계없이 운송 단위(예를 들면 컨테이너 당)를 기준으로 일률적으로 부과하는 운임은?","c":["FAK Rate","Commodity Rate","Through Rate","Special Rate"],"a":0},{"id":111,"t":[[0,"112"]],"q":"해상운송은 운송계약에 따라서 개품운송과 용선운송으로 나눌 수 있다. 다음 중 잘못 설명된 것은 무엇인가?","c":["개품운송의 선박은 주로 정기선을 이용하여 화물을 운송한다.","용선운송의 하역조건은 FIO 조건으로 적양하 비용을 하주가 부담하는 조건이다.","개품운송에서 적용하는 운임은 Tariff Rate운임을 적용한다.","용선운송은 주로 컨테이너화물 및 Unit화물을 운송한다."],"a":3},{"id":112,"t":[[0,"113"]],"q":"컨테이너 하역방식 중 Barge에 컨테이너 또는 일반화물을 적재하고 barge에 설치되어 있는 crane 또는 elevator에 의하여 하역되는 방식은 어떤 것인가?","c":["Lift on/ Lift off","Sea-Bee Ship","Roll on/ Roll off","Float on/ Float off"],"a":3},{"id":113,"t":[[0,"114"]],"q":"외국의 한 수입업자가 국내의 다수 수출업자들로부터 소량의 상품들을 구매하여 동일 시기에 동일지역으로 컨테이너 단위로 운송할 경우 주로 이용될 수 있는 운송형태는?","c":["CFS/CFS","CFS/CY","CY/CY","ICD/CFS"],"a":1},{"id":114,"t":[[0,"115"],[4,""]],"q":"다음 중 이동식 컨테이너 취급장비로서 컨테이너를 차곡차곡 쌓거나 컨테이너를 내리는 일 또는 섀시나 트레일러에 싣고 내리는 일을 하는 것은?","c":["스트래들 캐리어(Straddle Carrier)","갠트리 크레인(Gantry Crane, Shore Crane, Quay Crane)","트랜스테이너(Transtainer, Transfer Crane)","위치 크레인(Winch Crane)"],"a":2},{"id":115,"t":[[0,"116"]],"q":"다음 해상운임의 부대비용 중 Detention Charge에 대한 설명은?","c":["북미수출의 경우 도착항에서의 하역 및 터미널 작업비용을 해상운임과는 별도로 징수하는 것으로서 현재 20TEU 컨테이너당으로 부과하고 있다.","적하 또는 양하 일수가 약정된 정박기간을 초과하는 경우 초과일수에 대하여 용선자가 선주에게 지불하는 것으로 1일 또는 1톤당으로 지불하는 금액이다.","화주에게 허용된 시간(Free Time)을 초과하여 컨테이너를 방치하였을 경우 송화인이나 수화인이 선박회사에게 지불해야 할 비용이다.","항해용선계약서에 규정된 시간내에 선적이나 양하를 완료하지 못할 경우 선주에게 지불하는 비용이다."],"a":2},{"id":116,"t":[[0,"117"]],"q":"해상운송은 항해일정의 공시 여부, 운임요율 등에 따라서 정기선 운송과 부정기선운송으로 나뉘어진다. 다음 중 해상운송에 대한 설명으로 올바르지 못한 것은?","c":["정기선은 정기항로에 취항하고 있는 선박을 말하며 주로 완제품이나 반제품 등의 일반화물의 수송에 이용된다.","부정기선은 일정한 항로나 화주를 한정하지 않고 화물이 있을 때마다, 선복의 수요가 있을 때마다 화주가 요구하는 시기와 항로에 따라서 화물을 운송한다.","정기선은 화주에게 양질의 서비스를 제공하기 위해 참단장비를 갖춘 선박을 이용하여, 통상 포장화물의 운송에 이용된다.","부정기선은 해운시황에 따라서 선복의 공급이 불균형적이므로 카르텔을 형성하여 선복수급을 조정할 필요성이 정기선에 비해서 크다."],"a":3},{"id":117,"t":[[0,"118"]],"q":"정기선 운임의 산정 기준으로 적합하지 않은 것은?","c":["운임의 안정(price stability)","시장의 수요와 공급의 균형(balance between supply and demand in a market)","공동운항(Joint service)","화물 간 교차보조(Cross-subsidization between commodities)"],"a":1},{"id":118,"t":[[0,"119"]],"q":"정기선과 부정기선 운영에서 해상운임은 어떻게 결정되어 지는가?","c":["수요 측의 운임 부담 능력을 상한과 공급 측의 운송원가를 하한으로 하는 범위내에서 균형에 따라 결정","공급 측인 선사에 의해 일방적으로 결정","운송원가와의 관계는 매우 불확실한 상태에서 결정","가격경쟁의 배제를 주요 협정사항으로 결정"],"a":0},{"id":119,"t":[[0,"120"]],"q":"정기선 운임 산정기준에서 화물의 송장가격이 높은 고가품목은 비싼 운임을 적요하고 낮은 품목은 비교적 싼 운임을 적용하는 기준은?","c":["운임의 안정(price stability)","시장의 수요와 공급의 균형(balance between supply and demand in a market)","공동운항(Joint service)","화물 간 교차보조(Cross-subsidization between commodities)"],"a":3},{"id":120,"t":[[0,"121"]],"q":"정기선 컨테이너 표준 운임표 규정의 구분 중 해당 되지 않는 것은?","c":["해상운송 규정","항만 및 관련규정 서비스 요율 규정","회원정보규정","내륙운송 규정"],"a":2},{"id":121,"t":[[0,"122"]],"q":"정기선 표준 운임표 규정 중 해상운송 규정에 수록된 내용으로 적합하지 않은 것은?","c":["운임산정 기준","컨테이너화물의 혼재","운송주선 수수료","터미널 내 화물 취급료"],"a":3},{"id":122,"t":[[0,"123"]],"q":"정기선 표준 운이표 규정 중 항만 및 관련 서비스 요율 규종에 수록된 내용으로 적합하지 않은 것은?","c":["터미널 내 화물 취급료","운송관련 서류","소량 컨테이너화물(LCL)","체화료(demurrage), 장비 지체료(detention charge)"],"a":1},{"id":123,"t":[[0,"124"],[4,""],[4,""]],"q":"다음 중 선박의 운항비에 포함되지 않는 것은?","c":["도선료","연료비","검량비","일반관리비"],"a":3},{"id":124,"t":[[0,"125"]],"q":"정기선 운임에서 화물의 선적자, 즉 수출업자가 선적지에서 운임을 지불하는 것을 무엇이라고 하는가?","c":["선불운임","이중운임","후불운임","최저운임"],"a":0},{"id":125,"t":[[0,"126"]],"q":"정기선 운임에서 무역조건이 FOB인 경우 화물이 도착 후 수하인(consignee)또는 그 대리인이 운임을 지불하는 것은?","c":["선불운임(Freight prepaid)","후불운임(Freight collect)","특별 운임(Special rates)","최저운임(Minimum charges)"],"a":1},{"id":126,"t":[[0,"127"]],"q":"다음 중 하역비 부담에 의한 운임의 구분이 아닌 것은?","c":["Berth term(Liner term)","FI(Free in)","OCP(overland common point)","FIO(Free in & out)"],"a":2},{"id":127,"t":[[0,"128"]],"q":"화물을 본선으로 양하하는 비용과 위험 부담은 화주의 책임이며, 받대로 선사는 적하 비용을 부담하는 것은?","c":["Berth term(Liner term)","FO(Free out)","BAF(Bunker adjustment factor)","FI(Free In)"],"a":1},{"id":128,"t":[[0,"129"]],"q":"선주가 적하 및 양하의 비용을 모두 부담하혀 제반지용과 위험부담을 지는 것은 다음 중 어느 것인가?","c":["Berth term(Liner term)","FO(Free out)","FIO(Free in & out)","FI(Free In)"],"a":0},{"id":129,"t":[[0,"130"]],"q":"다음 중 화물의 가체에 의한 운임 분류중 적당하지 않은 것은?","c":["품목별 운임(Commodity rates)","보통 운임(Common rates)","등급별 운임(Class rates)","전통 운임(Through rates)"],"a":3},{"id":130,"t":[[0,"131"]],"q":"다음 중 운임동맹이 공통 운임표(common tariff)에 수록하여 동일 품목을 가진 모든 화주에게 동일한 수준으로 부과하는 운임을 말하는 것은?","c":["품목별 운임(Commodity rates)","보통 운임(Common rates)","등급별 운임(Class rates)","종가 운임(Ad-valoren rates)"],"a":1},{"id":131,"t":[[0,"132"]],"q":"다음 중 운송 구간에 의한 운임 분류의 종류가 아닌 것은?","c":["전통 운임(Through rate)","공동 운임(Joint rate)","구간 운임(Local rates)","이중 운임(Dual rate)"],"a":3},{"id":132,"t":[[0,"133"]],"q":"다음 중 물량에 의한 운임 분류로서 적합하지 않은 것은?","c":["우대운송계약운임(Service contract rates)","대량화물우대운임(Time/Volume rates)","독자운임결정권운임(Independent action rates)","특별견적운임(Special quotation rates)"],"a":2},{"id":133,"t":[[0,"134"]],"q":"이중운임(Dual rate)에 관한 설명으로 적합한 것은?","c":["1톤 미만의 소량화물에 적용하는 운임","운임동맹이 저 운임의 비 동맹선사와의 경쟁을 위해 운임동맹과 계약을 체결한 화주에게 약 9.5% 낮은 운임을 적용","화주와의 유대관계를 고려하여 대형화주에게 일반운임보다 낮은 운임을 적용","선사가 일정기간 화주가 제공한 물량의 과다에 따라 차등제로 적용하는 운임"],"a":1},{"id":134,"t":[[0,"135"]],"q":"다음 중 비동맹 선사와의 경쟁을 위한 운임이 아닌 것은?","c":["자유운임(Open rates)","특별운임(Special rates)","특별견적운임(Special quotation rates)","독자운임결정권운임(Independent action rates)"],"a":2},{"id":135,"t":[[0,"136"]],"q":"운임동맹이 비동맹 선사와의 집화경쟁을 위해 특정품목에 대해 공통 운임(Common rate)보다 낮게 책정한 운임은?","c":["자유운임(Open rates)","특별운임(Special rates)","특별견적운임(Special quotation rates)","독자운임결정권운임(Independent action rates)"],"a":1},{"id":136,"t":[[0,"137"]],"q":"다음 중 정기선에서 컨테이너 이용의 장점과 거리가 먼 것은?","c":["경제성","안정성","신속성","고가성"],"a":3},{"id":137,"t":[[0,"138"]],"q":"갑작스러운 유가(油價)인상분에 의한 추가적인 비용을 보전하기 위해 부과하는 할증료는?","c":["유류할증료(Bunker adjustment factor)","통화할증료(Currency adjstmen factor)","수에즈 운하 할증료(Suez Canal surcharge)","과중 할증료(Heavy lift charge)"],"a":0},{"id":138,"t":[[0,"139"]],"q":"화물의 특수한 요구에 귀속하는 추가 비용을 보전하기 위해 부과하는 운임의 종류가 아닌 것은?","c":["차별항 운임(Outport arbitrary)","선택 항료(Optional charge)","전쟁위험 할증료(War risk premium)","최저운임(Minimum charges)"],"a":3},{"id":139,"t":[[0,"140"]],"q":"선박이 최종 목적 항에 직접 기항하지 않아 화물의 환적으로 인해 추가로 발생하는 비용을 보전하기 위해 부과하는 요금은?","c":["선택항료(Optional charge)","터미널 접수료(Terminal receiving charge)","환적료(Transshipment charge)","도착지 인도료(Destination delivery charge)"],"a":2},{"id":140,"t":[[0,"141"]],"q":"화주가 선적 당시에 최종 목적 항을 두개 이상 정하여 최초 항 도착 전에 양하 항을 지정하는 경우 적부상의 문제점을 감안하여 부과하는 요금은?","c":["차별항 운임(Outport arbitrary)","선택 항료(Optional charge)","항구 변경료(Diversion charge)","특별 운항료(Special operaing service charge)"],"a":1},{"id":141,"t":[[0,"142"]],"q":"정기선 운항 수입의 중 약 80% 이상을 차지하고 있는 수입원은 다음 중 어느 것인가?","c":["운임 수입","대선 수입","부대 수입","스페이스 사용료"],"a":0},{"id":142,"t":[[0,"143"]],"q":"자사 선박의 스페이스 중 일부를 타 선사에게 빌려 주는 대가로 합의된 스페이스 사용료(charterage)를 무엇이라고 하는가?","c":["운임 수입","대선 수입","부대 수입","간접 수입"],"a":1},{"id":143,"t":[[ 에이프런(apron)"],"a":1},{"id":182,"t":[[0,"183"],[4,""]],"q":"본선이 입항하면 CY 운영자는 집화된 컨테이너를 무엇을 사용하여 선적하는가?","c":["갠트리 크레인(gantry crane)","데릭 포스트(derrick post)","하역용 윈치(winch)","지브 크레인 (jib crane)"],"a":0},{"id":183,"t":[[0,"184"]],"q":"FCL 화물의 경우에는 화물인도지시서를 누구에게 제시하고 화물을 인수해야 하는가?","c":["CFS 운영자","포워더","통관사","CY 운영자"],"a":3},{"id":184,"t":[[0,"185"]],"q":"FCL 화물의 경우 빈 컨테이너는 선박회사가 정하는 CY에 반환해야 하는데 만약, 이때 지체되면 무엇을 지급해야 하는가?","c":["선하증권","선박보험","지체료","할증료"],"a":2},{"id":185,"t":[[0,"186"]],"q":"부정기선 운항시 관심을 두어야 할 점은 적절한 배선인데 이때 고려해야할 점으로 적합하지 않은 것은?","c":["다음 항해가 공선항해가 되지 않도록 계획한다.","많은 수의 선박수를 가지려고 노력해야 한다.","세계 각지에 있어서의 선박의 분포등에 관한 정보를 수집하여야 한다.","물동량의 증감 변화 및 운임의 추세에 대한 정보가 있어야 한다."],"a":1},{"id":186,"t":[[0,"187"]],"q":"부정기선의 선적에서 계약이 성립하면 누가 계약에 따라 선박을 적화지에 입항시켜야 하는가?","c":["선장","선주","화주","대리인"],"a":1},{"id":187,"t":[[0,"188"],[4,""]],"q":"부정기선의 일종인 벌크선의 선내 적화는 주로 무엇으로 하는가?","c":["갠트리 크레인(Gantry crane)","테릭 포스트(Derrick post)","윈치(Winch)","벨트 컨베이어(Belt conveyor)"],"a":3},{"id":188,"t":[[0,"189"]],"q":"부정기선에서 광석이나 소금은 안벽에 설치된 무엇으로 선창에 적재되는가?","c":["벨트 컨베이어(Belt conveyor)","로더(Loader)","윈치(Winch)","프리플로우 컨베이어(Free-flow conveyor)"],"a":1},{"id":189,"t":[[0,"190"]],"q":"부정기선의 하역에서 곡물은 철광석이나 석탄과 같이 무엇으로 퍼서 양화하는가?","c":["언로더(Unloader)","로더(Loader)","그래브(Grab)","사일로(Silo)"],"a":2},{"id":190,"t":[[0,"191"]],"q":"부정기선이 도착하여 선장이 화주에게 무엇을 통지하면 그 즉시 적화작업을 시작해야 하는가?","c":["화물인도지시서","소요량증명서","하역준비완료의 통지","원산지 증명서"],"a":2},{"id":191,"t":[[0,"192"],[4,""]],"q":"다음에서 1등 항해사가 적화계획을 세울 때에는 최대의 경제성이 발생할 수 있게 하기 위해 중점을 두어야 하는 것과 거리가 먼 것은?","c":["적화의 양을 결정한다.","중심의 위치를 적당하게 한다.","트림(배의 전후의 경사)을 최적으로 한다.","선창의 용적을 결정한다."],"a":3},{"id":192,"t":[[0,"193"]],"q":"다음 중 화물의 적재, 항해 중의 품질관리 및 양화등 화물에 관한 책임을 지는 자는?","c":["도선사","통신사","1등 항해사","해기사"],"a":2},{"id":193,"t":[[0,"194"]],"q":"부정기선의 화물인 광석, 강재 등 무거운 화물은 어디까지 적재가 가능한가?","c":["만재 흘수선","흘수표","건현","갑판장 창고"],"a":0},{"id":194,"t":[[0,"195"]],"q":"만재흘수선을 세계적으로 적용하기 위해 전세계의 항로를 4가지 구역으로 구분하였는데 그 구역이 아닌 곳은?","c":["계절동기대","열대","계절열대","아열대"],"a":3},{"id":195,"t":[[0,"196"]],"q":"부정기선에서 화물을 적재 시 만재흘수선을 나타내기 위해 만재 흘수선표를 선박의 어디에 그려 넣어야 하는가?","c":["건현","선체 중앙부의 양현","늑골","용골"],"a":1},{"id":196,"t":[[0,"197"]],"q":"선박에 화물을 적재할 때 중심의 높이와 관련된 설명으로 바람직하지 못한 것은?","c":["재래 정기선이나 컨테이너선은 화물을 적재할 대 중심의 높이를 조정할 수 있다.","갑판상에 많은 화물을 적재한 컨테이너선을 중심이 높아져 배의 안정성이 나빠진다.","목재 운반선의 경우 화물을 갑판에 많이 적재할 경우 중심이 높아져 배의 안정성이 나빠진다.","광석 전용선과 원유 탱커 등은 적재 방법에 의해 중심의 높이를 조정할 수 있다."],"a":3},{"id":197,"t":[[0,"198"]],"q":"수심이 앝은 곳에 입출항 시 가능한 한 선수미의 흘수가 똑같게 되도록 무엇을 조절해야 하는가?","c":["트림","적화량","중심","선원 수"],"a":1},{"id":198,"t":[[0,"199"]],"q":"종래의 정기 화물선의 가장 큰 문제점으로 지적되었던 것으로 해당되는 것은?","c":["하역시간이 단축할 수 있다.","하역비용이 절감될 수 있다.","각종화물을 규격용기에 적재할 수 있다.","잡다한 화물을 개별적으로 운송한다."],"a":3},{"id":199,"t":[[0,"200"]],"q":"다음 중 유조선에 대한 설명으로 적절하지 않은 것은?","c":["중동 등의 원유 생산지로 부터 정유 시설 항구까지 원유를 수송한다.","정유공장에서 소비지로 정재유를 수송하기도 한다.","화물유의 요동을 방지하기 위해 종횡의 유밀 격벽으로 구획되어 있다.","양화지에서 선적지로 되돌아 갈때는 만재상태로 수송한다."],"a":3},{"id":200,"t":[[0,"201"]],"q":"다음은 탱커를 크기로 분류한 것 중 20만 톤 이상 30만 톤 미만의 탱커는 어는 것인가?","c":["VLCC","ULCC","AFRAMAX","SUEZMAX"],"a":0},{"id":201,"t":[[0,"202"]],"q":"다음 중 해상운송에 있어서 기술 혁신 사례 중 대형화에 관한 설명 중 적합한 것은?","c":["컨테이너선은 운항 효율면에서 대형선보다는 소형선이 더 효율적이다.","대형화하면 신조선가도 똑같이 올라가기 때문에, 대형화의 수익이 낮아 진다.","제4세대 컨테이너선은 4~5000 TEU, 길이 262~290m로 이른바 포스트 파나막스선이다.","양화지에서 선적지로 되돌아 갈때는 만재상태로 수송한다."],"a":2},{"id":202,"t":[[0,"203"]],"q":"다음 중 카페리에 관한 설명으로 적합한 것은?","c":["자동차만 싣고 운항하는 배이다.","단거리 카페리는 주로 트럭 수송에 이용된다.","수송되는 화물은 컨테이너 수송화물보다 그 가격이 저가이다.","차량 갑판에 자동차를 싣고 가서 램프를 통해 배를 육지로 내린다."],"a":3},{"id":203,"t":[[0,"204"]],"q":"다음 중 정기선이 컨테이너화 되면서 생기는 단점으로 적합한 것은?","c":["화물운송에 있어서 경제성을 충족시킨다.","화물을 출발하여 수화인에게 전달하는 신속성을 유지시킨다.","화물운송시 화물을 필폐된 용기에 의해 운반되므로 안전성을 확보한다.","운송체제를 구축하는데 막대한 자금이 소요된다."],"a":3},{"id":204,"t":[[0,"205"],[4,""]],"q":"다음에서 컨테이너선을 운영하면 절감되는 항목으로 해당되지 않는 것은?","c":["인건비","창고료","보험료","할증료"],"a":3},{"id":205,"t":[[0,"206"]],"q":"다음 재래 정기선이 컨테이너선으로 변화됨으로써 발생되는 이점을 설명한 것으로 해당되지 않는 것은?","c":["컨테이너라는 밀폐된 용기에 넣어 운송하므로 화물을 저렴하게 운송할 수 있다.","별개의 독립된 창고의 역할을 하는 컨테이너이므로, 포장비, 창고료 및 보험료를 절감할 수 있다.","부두에서 화물을 적하 및 양하하는데 많은 인부를 동원해야 하므로 더 많은 일자리를 창출할 수 있다.","규격화된 컨테이너의 사용으로 하역 시간과 선박의 정박기간이 단축된다."],"a":2},{"id":206,"t":[[0,"207"],[4,""]],"q":"다음 중 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","c":["풀 컨테이너선(Full container ship)","컨버터블 컨테이너선(Convertible container ship)","세미 컨테이너선(Semi-container ship)","기어레스 컨테이너선(Gearless container ship)"],"a":1},{"id":207,"t":[[0,"208"],[4,""]],"q":"다음에서 컨테이너와 컨테이너를 넣지 않은 화물(break bulk) 두 가지를 적재하는 장비를 설치한 선박은?","c":["풀 컨테이너선(Full container ship)","컨버터블 컨테이너선(Convertible container ship)","세미 컨테이너선(Semi-container ship)","기어레스 컨테이너선(Gearless container ship)"],"a":2},{"id":208,"t":[[0,"209"],[4,""],[4,""]],"q":"다음에서 LOLO(Lift On Lift On)선의 특성을 설명한 것으로 적합하지 않은 것은?","c":["컨테이너를 육상의 갠트리 크레인으로 싣고 내리는 선박이다.","화물창 내에서는 상하 방향으로 설치된 셀 가이드에 따라서 컨테이너를 중복되게 격납한다.","컨테이너를 트레일러에 의하여 적재하는 방식으로 프크리프트를 사용하여 쌓는다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":2},{"id":209,"t":[[0,"210"]],"q":"다음은 재래 정기선과 컨테이너선을 비교 설명한 것으로 적절한 것은?","c":["컨테이너선은 재래 정기선과 비교하여 항구에 오래 정박해 있어도 경제성을 절감할 수 있다.","재래 정기선은 선박이 컨테이너선에 비해 소형이므로 하역을 하는 시간을 단축할 수 있다.","재래 정기선은 1등 항해사가 하역계획을 입안하였지만, 컨테이너선은 육상에서 작성되고 하역과 지휘도 육상에서 주도한다.","잡화는 종류가 많으므로 이를 하역하는 데 시간과 비용이 많이 소요되기 때문에 좀 더 소형인 재래 정기선이 능률적이다."],"a":2},{"id":210,"t":[[0,"211"]],"q":"다음 중 벌크 캐리어로 운송되는 메이저 벌크(major bulk)품목에서 다소 거리가 먼 것은?","c":["철광석","곡물","석탄","설탕"],"a":3},{"id":211,"t":[[0,"212"]],"q":"벌크선이 하역하는 장소는 무엇에 의해 달라지는 가?","c":["운임","화물","부두","용량"],"a":1},{"id":212,"t":[[0,"213"]],"q":"다음 중 파나막스(Panamax)선의 사이즈와 무게는 어느 정도인가?","c":["선폭 32.2m 이하 2만 중량톤 전후","선폭 32.5m 이상 8만 중량톤 전후","선폭 32.2m 이하 6만 중량톤 전후","선폭 35.0m 이상 2만 중량톤 전후"],"a":2},{"id":213,"t":[[0,"214"],[4,""]],"q":"벌크선 중 핸디사이즈(Handy size)의 선박은 무게는 어느 정도인가?","c":["1만 5,000 ~ 3만 중량톤","1만 5,000 ~ 4만 5,000중량톤","2만 ~ 4만 중량톤","2만 5,000 ~ 4만 5,000중량톤"],"a":1},{"id":214,"t":[[0,"215"],[4,""],[4,""]],"q":"다음에서 RORO(Roll On Roll off)선의 특징을 서술한 것으로 해당되지 않는 것은?","c":["선미 또는 현측에 설치한 램프웨이를 통해 컨테이너를 트레일러에 의해 적재하는 방식이다.","화물창 내에서는 포크리프트를 사용하여 중복으로 쌓아 격납한다.","적재 가능한 컨테이너가 적어 육상의 크레인 설비가 필요하지 않다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":3},{"id":215,"t":[[0,"216"],[4,""]],"q":"다음의 부정기선 영업에 관한 내용을 서술한 것으로 적합하지 않은 것은?","c":["여러 척의 선박을 필요로 하지 않는다.","육상설비에 많은 투자를 할 필요가 없다.","자본 집약적 산업이고 공증운송인으로서의 역할을 한다.","비교적 간단하게 사업을 개시 또는 중지 할 수 있다."],"a":2},{"id":216,"t":[[0,"217"]],"q":"다음에서 FOFO(flot on flot off)에 대한 설명으로 올바르지 않는 것은?","c":["다수의 부선에 컨테이너를 비롯 팰릿화된 화물을 수납가능한 방식이다.","선수나 선미에 달린 램프를 통해 트레일러나 지게차 등의 하역기계를 활용한 방식이다.","라쉬선(LASH), 시비선(Sea Bee Carrier) 등이 이 방식을 채용하고 있다.","선상에 장비된 크레인으로 부선채 선적하여 그대로 목적지까지 운반하는 하역방식이다."],"a":1},{"id":217,"t":[[0,"218"]],"q":"다음의 장기운송계약의 장점으로 적합하지 않은 것은?","c":["안정된 경영으로 해운 산업의 발전에 기여한다.","장기계약을 담보로 자금 조달이 쉬워진다.","선주와 화주 모두에게 시황변동에 따른 위험을 감소시킬 수 있다.","시황변동이나 물가 수준을 적절하게 반영할 수 있다."],"a":3},{"id":218,"t":[[0,"219"]],"q":"다음에서 전용선에 대한 설명으로 올바르지 않은 것은?","c":["장기운송계약에 투입되는 선박으로 주로 이용된다.","운항 원가를 최소화 하는 이상적인 선종이다.","장기운송계약을 통해 운송이 실시 되므로 정기선 영업에 준거한다.","특정화물의 수요가 없을 경우에도 상관없이 최대의 경제성을 발휘한다."],"a":3},{"id":219,"t":[[0,"220"]],"q":"장기운송계약의 단점을 보완하기 위해 고려해야 하는 사항으로 해당되지 않는 것은?","c":["환율","연료비","계약년도","물가 상승률"],"a":2},{"id":220,"t":[[0,"221"],[4,""]],"q":"다음의 부정기선의 용선방법의 종류에 해당되지 않는 것은?","c":["정기용선","항해용선","나용선","개품운송"],"a":3},{"id":221,"t":[[0,"222"]],"q":"다음에서 정기또는 기간용선계약에 대한 개념으로 적당한 것은?","c":["선주와 용선자가 단일항해 운송을 약정하는 것을 말한다.","일정기간 동안 선복의 전부 또는 일부를 용선하는 계약을 말한다.","송하인이 선박회사에 화물의 운송을 신천하면 운송인은 이것을 승낙함으로써 계약이 성립하는 것을 말한다.","선박자체만을 임차하고 인적 및 물적요소를 용선자가 부담하는 선박의 임대차 계약을 말한다."],"a":1},{"id":222,"t":[[0,"223"]],"q":"다음에서 정기운송계약 이용의 예에 대한 설명으로 부적절한 것은?","c":["정기선사: 급격하게 증가한 수요를 충족시키고자 할 때","용선자: 다시 제 3자에게 정기용선 또는 항해 용선을 주어 운임의 차액을 얻으려는 상업목적","화주: 일정기간 연속해서 대량의 화물운송이 필요할 때","선주: 선박자체만을 임차하고 용선자가 인적 및 물적요소를 부담할 때"],"a":3},{"id":223,"t":[[0,"224"],[4,""]],"q":"다음 중 정기운송계약의 주요내용과 관계가 먼 것은?","c":["선박명세","용선료 지급","부적운임유치권","감항능력담보"],"a":2},{"id":224,"t":[[0,"225"]],"q":"다음 중 화주가 선적, 양하비용을 전적으로 부담하는 것은?","c":["F.I.O","F.O","F.I","CP"],"a":0},{"id":225,"t":[[0,"226"]],"q":"다음중 부정기선 운임의 특징에 대한 설명으로 부적당한 것은?","c":["운임의 결정요인은 장기적으로 경제성장과 교역량을 고려해야 한다.","해운시황에 따라 변동폭이 안정되어 운임의 등락 폭이 적다.","경제적, 정치적인 변수를 중기적인 차원에서 고려해야 한다.","일시적인 수요증감에 따른 선복 과부족역시 운임의 결정요인이 된다."],"a":1},{"id":226,"t":[[0,"227"],[4,""]],"q":"최근 해상운송이 컨테이너화 되어 가고 있다. 그 이유로 옳은 것은?","c":["자본이 적게 소요된다.","선박의 정박기간이 늘어난다.","하역인부를 많이 고용할 수 있다.","화물을 안전하게 운송할 수 있다."],"a":3},{"id":227,"t":[[0,"228"]],"q":"다음에서 주로 재래의 일반 화물선을 개조하였고 일반화물과 컨테이너 화물을 함께 실을 수 있는 구조의 선박은?","c":["LOLO선","RORO선","LASH선","Semi-container선"],"a":3},{"id":228,"t":[[0,"229"]],"q":"다음에서 광석 운송선에 대한 설명으로 바람직하지 않은 것은?","c":["광산물을 산적 상태로 선창에 적재하여 운송하는 선박을 말한다.","광석운송선으로 가장 많이 운송되는 화물은 제철 원료인 철광석이다.","선체는 수밀구조를 비롯아여 이중저 및 이중선각등의 특수한 구조를 구비해야 한다.","선창은 배의 중심선을 따라서 구획 설치 되어 있다."],"a":2},{"id":229,"t":[[0,"230"]],"q":"다음 중 광석 운송선의 구조에 관한 설명으로 바람직하지 못한 것은?","c":["선창 내에 임시로 시프팅 보드를 설치하여야 한다.","단면 형상과 강도 면에서도 특수한 구조로 되어 있다.","화물의 무게를 고려 이중저를 보통의 선박보다 높게 배치하여야 한다.","선형은 탱커와 비슷한 선미 기관실형으로 한다."],"a":0},{"id":230,"t":[[0,"231"]],"q":"다음에서 새깅(Sagging) 현상을 설명한 것으로 적절한 것은?","c":["정지각이 비교적 작은 화물의 적재 시에 양쪽 선측으로 삼각형 형태의 공간이 생긴 현상","선적된 화물이 선박의 동요에 의해 침하와 이동이 일어나는 현상","광석 운송선에서 철광석을 만재 하였을 시 중안 선창의 무게 집중으로 인해 생긴 현상","화물이 온도의 변화에 따라 부피가 변화한 현상"],"a":2},{"id":231,"t":[[0,"232"]],"q":"정지각이 비교적 작은 곡물의 적재 하는 경우 양쪽 선측으로 삼각형 형태의 빈공간이 생겨서 위험할 수 있는데 이를 방지하기 위한 장치는?","c":["이중선각(Double Hull)","셀프 트리밍(Self Trimming)","포크리프트(Forklift)","밸러스트(Ballast)"],"a":1},{"id":232,"t":[[0,"233"]],"q":"자동차 전용 운송선은 RORO선으로 분류되기도 하는 이유로 타당한 것은?","c":["보통 편도 화물을 운송하고 탱커를 겸하고 있기 때문에","선창내에 시프팅 보드(shifting board)를 설치하였기 때문에","일반적을 본선에는 하역장비가 설치되어 있지 않기 때문에","선수나 선미에 설치된 램프(Ramp)를 이용하거나 선측의 개구부(side port)를 이용하기 때문에"],"a":3},{"id":233,"t":[[0,"234"],[4,""]],"q":"다음에서 자동차 전용 운송선의 특징을 설명한 것으로 적합하지 않은 것은?","c":["선창 내에 갑판 (Deck)의 수가 많다.","선창 및 갑판 사이에는 승강 장치와 램프로 연결되어 있다.","선수부에서 선미부에 이르는 좌, 우, 중앙의 3개 종격벽과 많은 횡격벽이 있다.","수선 하부의 면적이 넓어서 풍압력의 영향을 많이 받는다."],"a":2},{"id":234,"t":[[0,"235"]],"q":"흔히, 천연가스를 훨씬 낮은 극저온의 상태에서 액화시켜 수송하고 있는 운송선은?","c":["LPG선","PCTC선","OAO선","LNG선"],"a":3},{"id":235,"t":[[0,"236"],[4,""]],"q":"선박에서 인간의 몸을 포함한 모든 동물들의 척추와 같은 역할을 하는 구조부재는?","c":["선저 만곡부","용골","늑골","플레어"],"a":1},{"id":236,"t":[[0,"237"],[4,""]],"q":"선박의 선저와 선측을 연결하는 곡선 부분으로 대개의 경우에 원형으로 구성되어 있는 것을 말하는 것은?","c":["선저 만곡부(Bilge)","용골(Keel)","늑판(Floor)","외판 (Shell plating)"],"a":0},{"id":237,"t":[[0,"238"],[4,""]],"q":"다음 중 외판 철판의 투께를 포함한 선폭으로 주로 입거 시나 운하 통과 시에 이용되는 선폭은?","c":["형폭(Moulded breadth)","전폭(Extreme breadth)","형깊이((Moulded depth)","용골 깊이(Keel depth)"],"a":1},{"id":238,"t":[[0,"239"],[4,""]],"q":"우리나라의 선급에서는 배의 깊이를 용골의 상면에서 측정하는데 선박에서 가장 내측의 선을 무엇이라고 하는가?","c":["형깊이((Moulded depth)","용골 깊이(Keel depth)","형선 (Molding line)","흘수(Draft)"],"a":2},{"id":239,"t":[[0,"240"]],"q":"선박의 티핑센터가 배 길이의 중앙에 있는데 이는 평균흘수와 중앙 부흘수는 일치하나 약간의 차이를 보이고 있는데 그 이유로 적당하지 않은 것은?","c":["선적화물 과 중령물 선적의 불균형의 요인","밸러스트의 불균형 요인","선제 철판의 휨 현상의 요인","사용되는 미터식 표시법과 피트식 표시법의 차이현상"],"a":3},{"id":240,"t":[[0,"241"],[4,""]],"q":"선박의 조정이나 선적량의 산출에서 사용하는 거리로 선박법상 그 표시를 규정하고 있는 것은?","c":["형흘수 ((Moulded draft)","용골 흘수 (Keel draft)","전부흘수(Fore draft)","중앙부 흘수(Midship draft)"],"a":1},{"id":241,"t":[[0,"242"],[4,""]],"q":"선박의 안전을 확보하기 위해 선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비부력을 확보해야 하는 데 이를 무엇이라 하는가?","c":["건현(Freeboard)","만재 흘수선(Full load line)","횡경사(Heel)","전장(Length over al)"],"a":0},{"id":242,"t":[[0,"243"],[4,""],[4,""]],"q":"다음은 만재 흘수선에 대한 설명으로 적절한 것은?","c":["선박항해의 안전을 확보할 수 있는 상태에서 허락된 최대의 흘수를 말한다.","선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비 부력을 확보하는 것을 말한다.","선체의 수면에 잠겨 있는 깊이를 용골에서 수면까지의 높이를 말한다.","안벽계류, 운하통과 및 입거 등 선박 조정에 필요한 선체의 최대 높이를 말한다."],"a":0},{"id":243,"t":[[0,"244"],[4,""]],"q":"다음에서 원양 및 근해 구역의 산박의 만재 흘수선에 대한 설명으로 옳지 않은 것은?","c":["만재 흘수선 규정에 의해 원양 및 근해 구역을 항행 구역으로 하는 선막은 갑판선이다.","길이 100m를 넘는 선박은 동기북대서양 만재 흘수선을 표시하지 아니한다.","갑판상에 목재를 운송하는 선박은 목재 만재 흘수선의 규정을 따로 받는다.","목재 만제 흘수선은 화물 자체가 부력을 갖기 때문에 일반 만재 흘수선보다 더 얕은 흘수를 허용하고 있다."],"a":3},{"id":244,"t":[[0,"245"]],"q":"다음에서 만재 흘수선의 표시에 대한 설명으로 타당하지 않은 것은?","c":["어두운 색의 선측에는 백색 또는 황색으로 선명하게 표시한다.","폭 35mm의 선으로 영 현측에 표시한다.","갑판선, 원표 및 각 대역별 만재 흘수선을 표시하는 열쇠 모양의 표시 등의 세부분으로 구성되어 있다.","백색의 선측에는 흑색으로 선명하게 표시한다."],"a":1},{"id":245,"t":[[0,"246"]],"q":"다음 중 일반 화물선에서의 횡경사는 무엇을 조정하므로써 바로 잡을 수 있는가?","c":["중앙 흘수","화물의 트리밍","윙 탱크의 밸러스트","플레어"],"a":2},{"id":246,"t":[[0,"247"]],"q":"벌크화물의 만선 선적 시에 만재 흘수의 제한을 받으므로 횡경사가 잃어나지 않기 위해선 무엇을 해야하나?","c":["횡경사는 윙 탱크의 밸러스트 조정하면 된다.","횡경사의 각도를 높게 유지한다.","예비 부력을 확보하도록 한다.","선창 적재 화물의 트리밍을 잘한다."],"a":3},{"id":247,"t":[[0,"248"]],"q":"대형 화물선이나 유조선 같이 액체화물을 적재하는 선박에 적합한 선박 구조 양식은?","c":["종식 구조","횡식 구조","혼합식 구조","늑골식 구조"],"a":0},{"id":248,"t":[[0,"249"]],"q":"선박의 구조의 종식구조(Longitudinal system)의 장점으로 관계가 먼 것은?","c":["종강도가 크다.","구겅부제의 무게가 가벼워 선체의 중얄이 감소한다.","선창 내 구조가 복잡하여 건조작업이 쉽다.","선체의 중량이 감소하여 재화적재 중량이 늘어날 수 있다."],"a":2},{"id":249,"t":[[0,"250"]],"q":"대부분의 중소형 화물선의 구조양식으로 채택하고 있는 것은?","c":["종식 구조","횡식 구조","혼합식 구조","늑골식 구조"],"a":1},{"id":250,"t":[[0,"251"]],"q":"다음 중 산적 화물선의 선체 구조를 설명한 것으로 올바르지 않은 것은?","c":["화물을 포장하지 않은 상태에서 적재하기 때문에 다른 선종에 비해 특별한 화물창 구조를 가지게 된다.","화물의 선체 동요에 따라 이동하거나 무너지는 것을 방지하기 위해 밸러스트 탱크로 이용하고 있다.","화물을 양하 할 때 불도저와 같은 장비를 선창에 투입할 수 있도록 바닥에 돌기를 제공한다.","내저판의 양현 모서리에 약 45。각 도의 경사판을 붙여 이중저의 강도를 높일 수 있다."],"a":2},{"id":251,"t":[[0,"252"]],"q":"산적 화물선은 건화물을 주로 운송하므로 산화물이 격벽 보장재에 쌓이지 않도록 무엇을 채용하고 있나?","c":["하부 스톨","선저 외판","상부스톨","파형격벽"],"a":3},{"id":252,"t":[[0,"253"]],"q":"산적 화물선에서 산화물의 잔여물이 남지 않고 잘 흘러내리게 하기 위한 구조물은?","c":["하부 스톨","경사판","상부스톨","파형격벽"],"a":1},{"id":253,"t":[[0,"254"]],"q":"대형 컨테이너선의 설계에 있어서 갑판 하 거덜(Deckgirder)를 설치하지 않는 경우가 많은데 그 이유로 적당한 것은?","c":["대형 창구의 설치에 따른 비틀밍 강도의 약화을 방지하기 위하여","화물을 싣기 위하여 우선적으로 최대한의 넓은 공간을 확보하기 위하여","화물의 적재 및 하역 등의 효율성을 높이기 위하여","둥금새와 보강판을 이용하여 응력 집중에 의한 균열발생을 방지하기 위하여"],"a":2},{"id":254,"t":[[0,"255"]],"q":"대부분의 컨테이너 전용선의 상갑판은 두께가 두껍고 폭이 좁은 이유로 타당한 것은?","c":["선체에서 가장 큰 응력이 발생하기 때문에","상갑판 상에 하역장치가 없고 컨테이너를 높이 적재하기 때문에","화물의 충돌 및 기타 사고가 자주 발생하기 때문에","일반적으로 화물을 포장하지 않은 상태로 적재하기 때문에"],"a":1},{"id":255,"t":[[0,"256"]],"q":"컨테이너선의 화물창의 격벽에 대한 설명으로 올바르지 않은 것은?","c":["컨테이너 적재에 편리하도록 비수밀 격벽으로 나누어져 있다.","사람이 오르 내릴 수 있는 플랫폼이 설치되어 있다.","수밀격벽은 선창의 구분뿐만 아니라 비틀림 강도 및 횡강도에 있어서 중요한 역할을 한다.","신체 중앙선에 대하여 하나 또는 대칭으로 2~3개가 설치된다."],"a":3},{"id":256,"t":[[0,"257"]],"q":"컨테이너 전용선에 사용하는 창구덮개형식은 어떤형식을 채용하고 있는가?","c":["폰툰(Ponton)형식","구동(Rolling)형식","접이(Folding)형식","싱글풀(Single pull)형식"],"a":0},{"id":257,"t":[[0,"258"]],"q":"일반적으로 다목적 화물선이나 컨테이너선에는 창구덮개를 Ponton형식을 사용하는 이유로 적당한 것은?","c":["나뉜 부분이 없이 한 몸체로 구성이 되어 튼튼하기 때문에","길이가 폭에 비하여 길기 때문에","화물을 수평으로 격납하는 방식으로 요구되었기 때문에","보냉과 기밀을 필요로 하는 중간 갑판의 창구 덮개가 필요하기 때문에"],"a":0},{"id":258,"t":[[0,"259"]],"q":"컨테이너의 적양하의 편리와 이동방지를 위하여 수직으로 설치하는 것으로 컨테이너 전용선의 가장 큰 특징은?","c":["셀 가이드 장치","창구 덮개","창구 코밍","패드아이"],"a":0},{"id":259,"t":[[0,"260"]],"q":"다음 중에 VLCC가 주로 운송하는 화물은?","c":["Gas oil","Crude oil","Chemical oil","Diesel oil"],"a":1},{"id":260,"t":[[0,"261"]],"q":"다음 선박 중에서 가장 높은 안전 기준의 구조 및 설비를 필요로 하는 선박은?","c":["유조선","산물선","자동차 운반선","화객선"],"a":3},{"id":261,"t":[[0,"262"]],"q":"다음 중에 컨테이너 화물을 운송하는 동일한 크기의 선박 중에서 가장 많은 화물을 적재할 수 있는 선박은?","c":["LOLO선","RORO선","LASH선","Barge선"],"a":0},{"id":262,"t":[[0,"263"]],"q":"다음에서 선박의 길이를 나타내는 용어 중에 그 길이가 가장 긴 것은?","c":["전장(LOA)","등록장(RL)","수선간장(LBP)","수선장(LWL)"],"a":0},{"id":263,"t":[[0,"264"]],"q":"다음에서 만재 흘수선에 대한 설명 중에 옳지 않은 것은?","c":["갑판선의 상면은 건현 갑판의 상면과 일치시킨다.","원표의 중심을 지나는 수평선은 하기 만재 흘수선과 일치한다.","만재 흘수선 원표에 표시하는 한국정부의 표시기호는 \"KR\"이다.","원표를 통과하는 수평선의 상면의 중앙점은 원표의 중심과 일치한다."],"a":2},{"id":264,"t":[[0,"265"]],"q":"일반 산물선에서 양 현측에 설치하는 현측 탱크에 대한 설명 중 옳지 않은 것은?","c":["현측탱크내부에는 종강력을 위하여 선측 종늑골을 설치한다.","현측 탱크 상부의 갑판은 종강도를 확보하기 위하여 종늑골 형식의 구조이다.","일반적으로 산적 화물의 정지각을 30도로 기준하여 현측 경사판을 배치한다.","현측 탱크는 횡경사보다는 종경사 조정을 위하여 밸러스트 탱크로 이용한다."],"a":3},{"id":265,"t":[[0,"266"]],"q":"다음에서 일반 선박의 입거 검사 항목에 대하여 기술한 것으로 적절치 못한 것은?","c":["Bow thruster 검사","Stern tube 베어링 검사","키의 커플링 볼트 고정 상태 검사","선측 중앙부의 만재흘수선표 검사"],"a":3},{"id":266,"t":[[0,"267"]],"q":"유조선의 정기 검사 주기로서 옳은 것은?","c":["5년","4년","3년","2년"],"a":0},{"id":267,"t":[[0,"268"]],"q":"다음에서 선박의 감항성을 판정하는 요소가 아닌 것은?","c":["선체능력","항해능력","적재능력","보험능력"],"a":3},{"id":268,"t":[[0,"269"]],"q":"다음에서 일등항해사가 적하계획을 세울때 고려해야할 사항으로 적합하지 않은 것은?","c":["선박의 감항성 확보","최대량의 화물 키지화(Package)","컨테이너화(Containerization)"],"a":2},{"id":281,"t":[[0,"282"]],"q":"다음에서 팰릿화의 설명으로 올바르지 않은 것은?","c":["하역의 능률을 높이기 위하여 사용한다.","팰릿(Pallet) 위에 화물을 정해진 치수로 쌓은 후 팰릿과 화물을 함께 묶어서 규격화하는 방법","독립적으로 사용되기도 하지만 팰릿화한 상태로 컨테이너에 적입할 수 있다.","화물을 실은 부선(lighter)을 본선(ship)에 적재하여 컨테이너 하역 시설이 없는 항만에서 하역하는 방식이다."],"a":3},{"id":282,"t":[[0,"283"],[4,""]],"q":"다음 운송 중에는 일정시간마다 온도를 측정하여 적정온도를 유지해야하는 화물에 해당하는 것은?","c":["냉장화물","고가화물","생동식물 화물","중량화물"],"a":0},{"id":283,"t":[[0,"284"],[4,""]],"q":"적화계획 작성 시 화물의 적재 상태를 표시하기 위한 중요한 자료로 주로 선박의 각 구획을 세분화 한 도면을 무엇이라고 하는가?","c":["화물 적재도","로딩마스터","적화 용적도","하역순서도"],"a":2},{"id":284,"t":[[0,"285"]],"q":"화물의 운송 중 화물 손상이 발생되지 않도록 적절하게 배치해야 하는데 적절한 화물배치에 위배되는 것은?","c":["용적·중량의 두 가지 측면을 고려하여 화물을 구분하여 복원성, 트림에 미치는 영향을 염 두에 두고 배치한다.","귀중품 및 고가품은 별도의 장소에 보관하여 도난, 파손을 방지한다.","양화항의 순서를 고려하여 목적 항까지 가급적 화물을 옮겨 싣는 상황이 발생하지 않도록 적재 장소를 선정한다.","하역 능률의 향상을 위하여 양화항 및 종류가 같은 대량의 화물은 가급적 하나의 선창에 집중시킨다."],"a":3},{"id":285,"t":[[0,"286"],[4,""]],"q":"다음은 고가화물에 대한 설명으로서 올바르지 않은 것은?","c":["금괴, 보석, 귀금속, 화폐, 미술품, 정밀 기계 등 무게나 용적에 비하여 값이 비싼 화물을 말한다","고가 화물 선적시에는 담당 사관이 직접 입회하여 포장과 봉인 상태를 검사하고, 선적 서류와 대조하여 확인해야 한다.","일반적으로 고가화물에 대한 운임은 화물의 중량이난 용적에 의한다.","고가화물의 경우 시장 가격에 일정 비율로 부과한 종가운임(Ad valorem freight)제를 취한다."],"a":2},{"id":286,"t":[[0,"287"]],"q":"다음에서 컨테이너화의 장점으로 적절한 것은?","c":["화물을 양화한 후 빈 컨테이너를 반송하는데 비용과 시간이 소요된다.","컨테이너는 자체가 별개의 독립된 창고 역할을 하므로 포장비, 창고비 등의 부대 비용이 절 감된다.","컨테이너를 조작할 수 있는 하역 장비를 갖추지 못한 항만에서는 컨테이너 운송이 불가능 하다.","컨테이너화에 의한 운송을 하기 위해서는 대규모의 투자가 필요하다."],"a":1},{"id":287,"t":[[0,"288"]],"q":"다음에서 컨테이너화의 이점으로 적절하지 못한 것은?","c":["규격화된 컨테이너 사용과 하역의 기계화로 하역 시간이 단축됨에 따라 선박의 재항 시간 이 줄어들어 선박의 회전율이 높아진다.","운송 시간이 단축됨에 따라 재고 비용을 절감할 수 있다.","개개 화물의 조작은 컨테이너 적입시와 반출시 두 번만 이뤄지므로 화물 조작 횟수가 현저 히 감소한다.","대형 장척 화물은 컨테이너를 이용하여 운송할 수 없다."],"a":3},{"id":288,"t":[[0,"289"]],"q":"다음 사항 중 항해중인 대형 선박의 복원력에 가장 큰 영향을 미치는 요소는?","c":["바람","청수사용량 변화","화물의 이동","연료유 사용량의 변화"],"a":3},{"id":289,"t":[[0,"290"]],"q":"내구성이 좋고 제작비용이 비교적 싸서 세계적으로 유통되는 컨테이너는?","c":["강재 컨테이너","알루미늄 컨테이너","FRP 컨테이너","스테인리스 강 컨테이너"],"a":0},{"id":290,"t":[[0,"291"]],"q":"다음 중 수송비 절감을 위해 현재 가장 일반적으로 사용되고 있는 컨테이너의 규격은?","c":["20ft","25ft","40ft","30ft"],"a":2},{"id":291,"t":[[0,"292"]],"q":"다음에서 입자나 가루된 화물을 운송하기 위한 컨테이너는?","c":["드라이 컨테이너","탱크 컨테이너","냉동 컨테이너","벌크 컨테이너"],"a":3},{"id":292,"t":[[0,"293"]],"q":"다음에서 적화 계획을 위한 컴퓨터 프로그램인 로딩 마스터(loading master)로 구할 수 있는 일반적인 데이터로 관계가 없는 것은?","c":["GM, 흘수 및 트림","호깅 또는 새깅","화물의 운임단가","전단력 곡선 및 휨 모멘트 곡선 등 선체 세로 강도 곡선"],"a":2},{"id":293,"t":[[0,"294"]],"q":"다음 중 윗면이 개방되어 크레인으로 위에서 또는 문을 통해 화물을 적입할 수 있는 컨테이너는?","c":["하드 탑 컨테이너(Hard top container)","플랫 래크 컨테이너(Flat rack container)","오픈 톱 컨테이너(Open top container)","드라이 컨테이너(Dry container)"],"a":2},{"id":294,"t":[[0,"295"],[4,""]],"q":"20ft 컨테이너를 기준으로 2,000개(2,000TEU) 내외 컨테이너를 운송할 수 있는 선박은?","c":["파나맥스(Panamax)","초대형 컨테이너선","포스트 파나맥스(Post Panamax)","핸디 사이즈(Handy size)"],"a":3},{"id":295,"t":[[0,"296"],[4,""]],"q":"컨테이너 선의 적부 계획을 수립하는데 가장 중요한 요소는?","c":["선박 운항의 안전성을 확보","선박 운항의 항로성을 확보","선박 운항의 경제성을 확보","선박 운항의 편리성을 확보"],"a":0},{"id":296,"t":[[0,"297"]],"q":"컨테이너선의 적부계획 수립 시 주안점으로 타당하지 않은 것은?","c":["컨테이너선은 통상 갑판적을 하기 때문에 선체 중심이 높고 풍압 면적이 커서 충분한 GM을 확보할 필요가 있다.","냉동 컨테이너의 적부는 전원 공급 장치가 설치된 위치에 배치하여야 한다.","기항지의 순서, 양하지 서비스 및 하역 방법에 적합한 적부 계획을 수립한다.","하부에 실린 컨테이너에 상부에 실린 컨테이너의 중량이 과도하게 가해져야 선체의 횡동요를 막을 수 있다."],"a":3},{"id":297,"t":[[0,"298"]],"q":"컨테이너 적부도 중 베이 플랜(Bay plan)에 기재되어야 할 정보로 필요 치 않은 것은?","c":["각 컨테이너의 적부 위치","선적항 및 양하항","컨테이너 화물의 적부 상태","특수화물의 보험 가입여부"],"a":3},{"id":298,"t":[[0,"299"]],"q":"다음 중 생동식물화물 운송에 대한 설명으로 적합하지 않은 것은?","c":["생동식물 화물(Livestock cargo)은 살아 있는 동물과 식물로 가축류, 어류, 조류, 각종 동물이다.","가축과 같이 살아가는 동물의 운송에는가축 전용컨테이너(Livestock Container)를 이용한다.","생동식물 화물은 잘 관리 해야 하므로, 선원 거주 구역에서 가까운 곳에 적부한다.","생동식물은 일반적으로 상갑판의 통풍이 잘 되는 곳에 적재한다."],"a":2},{"id":299,"t":[[0,"300"]],"q":"베이플랜에서 컨테이너 위치를 6자리의 숫자로 이루어진 셀넘버(cell number)로 구성되는 이때 맨 앞 두자리 숫자를 무엇이라고 하는가?","c":["로우 넘버(Row no.)","슬롯 넘버(Slot no.)","베이 넘버(Bay no.)","티어 넘버(Tier no.)"],"a":2},{"id":300,"t":[[0,"301"]],"q":"다음에서 컨테이너에서 횡방향의 위치를 지정하는 번호를 말하는 것은?","c":["로우 넘버(Row no.)","슬롯 넘버(Slot no.)","베이 넘버(Bay no.)","티어 넘버(Tier no.)"],"a":1},{"id":301,"t":[[0,"302"]],"q":"다음에서 선적항과 양화항을 편의상 베이플랜 약호로 사용하는데 잘못 기재 된 것은?","c":["PUSAN - PUS","OSAKA - OSK","SIGAPORE - SIN","TOKYO - JAN"],"a":3},{"id":302,"t":[[0,"303"]],"q":"다음에서 일반적인 하역의 작업의 순서로 적절한 것은?","c":["입항 및 하역 작업 준비 - 하역작업 - 하역 후 정리 작업 - 화물관리","입항 및 하역 작업 준비 - 화물관리 - 하역작업 - 하역 후 정리작업","화물관리 - 입항 및 하역 작업 준비 - 하역작업 - 하역 후 정리 작업","입항 및 하역 작업 준비 - 하역작업 - 화물관리 - 하역 후 정리 작업"],"a":0},{"id":303,"t":[[0,"304"]],"q":"다음 중 컨테이너 하역 시 주의사항으로 부 적절한 것은?","c":["컨테이너 적부도를 참조하여 전체적인 하역 순서와 위험성 여부를 파악하여 두는 것이 좋다.","전반적인 작업의 진행 상황을 파악하여 컨테이너 적부도에 표시하여야 한다.","선체 횡경사가 심하면 하역이 불가능하므로, 횡경사(Heeling)가 5˚ 이상 생기지 않도록 밸러스트로 조절해 주어야 한다.","선적 후 컨테이너의 래싱 작업은 중요하므로 현장에서 직접 확인하여야 한다."],"a":2},{"id":304,"t":[[0,"305"]],"q":"다음 중 래싱(Lashing)에 대한 설명으로 올바른 것은?","c":["화물을 다른 화물로부터 보호하기 위한 보호재를 말한다.","화물을 싣고 난 후 선체가 동요할 때 움직이지 않도록 화물을 묶는 것을 말한다.","화물을 동일한 장소에서 적재하지 않고 분리시키는 것을 말한다.","화물이 오손, 눌림, 마찰, 이동으로 인한 손상을 방지하기 위해 통풍을 용이하게 하는 것을 말한다."],"a":1},{"id":305,"t":[[0,"306"]],"q":"다음은 컨테이너의 적부위치를 나타낸 6자리 숫자이다.\n예) 06 02 06\n(가) (나) (다)\n(가)~(다)의 내용에 적합한 내용을 <보기>에서 골라 바르게 짝지은 것은?\n보기: ㄱ. 선저로 부터의 높이 ㄴ. 선체의 종방향 표시 ㄷ. 선체의 횡방향 표시\n(보기 순서: (가) / (나) / (다))","c":["ㄱ ㄴ ㄷ","ㄱ ㄷ ㄴ","ㄴ ㄱ ㄷ","ㄴ ㄷ ㄱ"],"a":3},{"id":306,"t":[[0,"307"]],"q":"다음 중 위험 화물의 하역 시 주의해야할 사항으로 적당하지 않은 것은?","c":["하역시 위험 화물에 충격을 주지 않게 하고, 와이어 슬링(Wire sling)이나 훅(Hook)의 사 용을 피한다.","화물의 용기나 포장이 파손된 것과 누설되고 있는 것 등은 선적하지 않는다.","하역이 일시 중단되거나 하역이 끝나면 창구를 폐쇄하여 출입을 통제한다.","위험 화물은 야간이나 승객이 승·하선하는 시간 및 수리 작업을 하는 시간에는 하역한다."],"a":3},{"id":307,"t":[[0,"308"],[4,""]],"q":"컨테이너 터미널 시설에서 본선 입항 전에 계획된 선적 순서에 따라 슬롯에 컨테이너를 쌓아두는 곳은?","c":["에이프런","컨테이너 야드","마샬링 야드","컨테이너 프레이트 스테이션"],"a":2},{"id":308,"t":[[0,"309"]],"q":"다음에서 컨테이너의 구조에 대한 설명으로 올바르지 않은 것은?","c":["항구적인 성질을 가지며 반복사용에 적합할 정도로 견고한 것.","수송 중 이적하지 않고 1개 또는 그 이상의 수송방식에 의한 화물의 수송을 용이하게 하고자 특별히 설계한 것","화물의 적입 및 적출이 용이하게 설계되어 있는 것.","3m³ 이상의 내부용적을 가지고 있는 것 등이다."],"a":3},{"id":309,"t":[[0,"310"]],"q":"ISO에서 규정한 컨테이너 구비 조건으로 적절하지 않은 것은?","c":["일정기간에 재사용이 가능한 충분한 내구력을 가지고 있을 것.","수송경로를 변경할 때 조작이 용이할 것.","화물의 적양과는 무관하게 설계되어 있을 것.","운송도중 수송경로(수단)가 바뀌는 경우 화물의 적양 없이 일관수송을 할 수 있도록 설계되어 있을 것."],"a":2},{"id":310,"t":[[0,"311"]],"q":"우리나라에서는 언제부터 door to door의 컨테이너 운송수단이 시작되어 는가?","c":["1950년대","1970년대","1990년대","2000년대"],"a":1},{"id":311,"t":[[0,"312"]],"q":"다음은 일반적인 하역 작업의 순서에서 적화계획에 따라 1등 항해사와 당신 사관이 감독 지시하는 작업 순서는?","c":["입항 및 하역작업 준비","하역작업","하역 후 작업 정리","화물관리"],"a":1},{"id":312,"t":[[0,"313"]],"q":"컨테이너가 가장 효율적르로 운송할 수 있는 최적 상품(Prime Containerizable Cargoes)로 해당되지 않는 것은?","c":["전자제품","의약품","의류제품","한계상품"],"a":3},{"id":313,"t":[[0,"314"]],"q":"다음에서 컨테이너 화물의 종류를 설명한 것으로 적절한 것은?","c":["물리적으로 적재할 수 있으나 가격과 운임이 싸고 도난의 위험이 없는 상품을 적합상품이라고 한다.","최적의 상품보다는 값과 운임이 싼 상품인 철제류, 피혁제품, 철판 등은 한계상품이라고 한다.","화물을 물맂거으로 컨테이너화 할 수 없는 것은 극히 드물겠으나 화물의 성질, 용적, 중량 등에 의한 부적합 상품이 있다.","화물의 개별 가격이 싸고 해상운임이 싼 공산품이 컨테이너 화물로서 최적상품이다."],"a":2},{"id":314,"t":[[0,"315"]],"q":"다음 중 위험물 운송에 대한 각 나라의 관계법규에서 거리가 먼 것은?","c":["미국의 Yellow Book","영국의 Blue Book","호주의 Red Books","일본의 MOT Rules"],"a":0},{"id":315,"t":[[0,"316"]],"q":"다음의 부정기선 중 특수전용선에서 중유 및 원유를 주로 수송하는 선박은?","c":["refrigerate ship","lumber carrier","clean tanker","car carrier"],"a":2},{"id":316,"t":[[0,"317"]],"q":"다음의 부정기선 시장과 중개인에 대한 설명으로 적합하지 않은 것은?","c":["부정기선의 영업에는 화물운송계약이 있거나 화주로부터 화물을 offer 받아서 선박을 수배하는 경우가 있다.","수많은 선박과 선적지·양륙지를 달리하는 많은 종류의 화물간에 조회(inquiry)가 교환되는 용선해운시장이 형성된다.","세계적 해운시장의 중심은 런던, 뉴욕 및 동경이다.","정기선의 해운동맹과 같은 국제적 cartel 조직은 있고, 시장참여가 자유스런 경쟁시장이다"],"a":3},{"id":317,"t":[[0,"318"]],"q":"역사적으로 가장 오래되고 전세계의 해운정보가 집중되어 있는 공개된 해운거래소는?","c":["노르웨이 아마렉스","부산 국제해운거래소","런던 발틱해운거래소","뉴욕 증권거래소"],"a":2},{"id":318,"t":[[0,"319"]],"q":"부정기선의 중개인이 하는 역할로서 관계가 적은 것은?","c":["선박소유자의 대표로서 업무를 수행하고 있다.","세계 각지의 적하품을 찾고 있는 선박 및 적선을 매치(match)시키는 역할을 한다.","선박이용자의 대표로서 업무를 수행하고 있다.","정기용선이나 선박의 매매에 관한 업무는 수행할 수 없다."],"a":3},{"id":319,"t":[[0,"320"],[4,"98"],[4,""]],"q":"다음에서 선복의 전부를 빌리기는 하지만 어느 특정 항해를 위해 용선되는 계약을 무엇이라고 하는가?","c":["전부용선계약(whole c ]],"q":"항해용선의 운임은 화물의 수량을 기초로 지불되나, 정기용선의 용선료는 무엇에준거하여 지불되는가?","c":["인도기일","항행구역","계약기간","하역시간"],"a":2},{"id":343,"t":[[0,"344"]],"q":"다음에서 정기선 운임의 의의로 부적절한 것은?","c":["취항항로 및 발착일시 등에 제약이 있다.","해운동맹(shipping conference)가 결성됭 있다.","정기선 시장에 있어서 경쟁은 뚜렷하고 제약되어 반 독점적이다.","자유운임이 원칙이고 수요공급의 변화에 대한 감수성이 상당히 강하다."],"a":3},{"id":344,"t":[[0,"345"]],"q":"다음에서 국적선 불취항 증명서의 발급 사항의 경우로 해당되지 않은 것은?","c":["성질상 국적선 적재가 불가능한 화물의 경우","컨테이너의 구조를 갖은 선박이 일반잡화를 수송할 경우","선적예정일 5일 전 부터 선적예정일 까지 국적선이 없는 경우","해난 및 기타 불가피안 사유로 국적선 운송이 곤란한 경우"],"a":1},{"id":345,"t":[[0,"346"]],"q":"다음 중 정기선 운임의 구성으로 해당되지 않는 것은?","c":["기본운임","할증료","추가요금","보험료"],"a":3},{"id":346,"t":[[0,"347"],[4,""]],"q":"정기선 운송에서 다른 화물을 오손시킬 우려가 있는 화물을 무엇이라고 하는가?","c":["정량화물(Fine or Clean Cargo)","조잡화물(Rough Cargo)","산적화물(Break Bulk Cargo)","단위화물(Unit Cargo, Container Cargo)"],"a":1},{"id":347,"t":[[0,"348"]],"q":"다음 정기선 운임의 일종으로 항로별로 기본운임의 %로 정하거나 컨테이너당 또는 톤당 일정액을 정하여 공시하는 형식의 운임은?","c":["기본운임","할증료","추가요금","무차별 운임"],"a":1},{"id":348,"t":[[0,"349"]],"q":"다음 중 국적선 불취항 증명서의 면제 사유가 되지 않는 경우는?","c":["해운협정 등 국제조약 및 협약체결국가","우리나라 선사의 적취량을 일정수준 설정한 운임동맹에 가입한 외국선사가 운송하는 화물","복합운송에 의한 MLB서비스가 가능하거나 선복용선방식으로 항로를 취항하는 선복","우리나라 선사가 외국선사와 제휴, 상호 선복을 공동사용하는 경우 국적선사가 사용하는 선복부분에 상당하는 외국선박의 선복"],"a":2},{"id":349,"t":[[0,"350"]],"q":"화물의 기본운임은 원래 그 화물의 나름대로의 특성이외의 요인 등에 따라 품목별로 차등 부과되는데 이에 해당되지 않는 것은?","c":["운송코스트","운임부담력","화물의 종류","선복의 연식"],"a":3},{"id":350,"t":[[0,"351"]],"q":"다음 중 귀금속 등의 고가품에 적용되는 운임으로 송장가격에 일정률을 곱하여 산출하는 정기선운임은?","c":["종가운임(Ad Valorem Rate)","중량할증운임(heavy cargo surcharge)","인플레 할증료(Inflation Adjustment Factor)","체선할증료(port congestion surcharge)"],"a":0},{"id":351,"t":[[0,"352"]],"q":"용선운송계약에서 계약 본인인 용선자는 청구된 수수료에 대해 제소의 의무를 지니게 되는 이유로 타당한 것은?","c":["용선자가 운임 또는 용선료의 지불을 확보하기 때문이다.","용선자가 상실시간에 대한 보상으로 체선료를 지불해야 하기 때문이다.","적하 및 양하 비용이 용선자 측에서 부담하기 때문이다.","법률상의 난점을 극복하기 위해 중개인이 실제의 본인의 이름을 차용하는 것이다."],"a":3},{"id":352,"t":[[0,"353"],[4,""]],"q":"다음은 양륙항 선택화물(Optional Cargo) 할증과 관계된 설명으로 잘못 된 것은?","c":["화물 선적시에 양륙항이 지정되지 않고 출항 후에 화주가 가장 편리한 양륙지를 선적하여 그 항구에서 양륙하여 화물을 인도하는 경우임.","B/L의 양륙항 난에는 예컨대 'London/Hamburg option' 혹은 'Pusan/Inchon option'과 같이 두 개 이상의 항구가 명시됨.","송화인 또는 수화인은 본선의 선적지 출항 후 최초의 선택항 도착 전 일정일(보통 24시간 또는 48시간 전)까지 양륙항을 결정하여 그 항구에 있는 선박회사 대리점에 통고함.","중개인이 선택 지정하여 양륙·하도하는 화물을 Optional Cargo라고 함."],"a":3},{"id":353,"t":[[0,"354"]],"q":"다음 중 해운동맹이 대향화물에 대해 요금을 별도로 정하지 않고 동맹가입선사가 임의로 적용하여 경쟁력을 높이기 위해 적용되는 운임은?","c":["특별운임(special rate)","경쟁운임(open rate)","접속운임(OCP Rate)","최저운임(minimum rate)"],"a":1},{"id":354,"t":[[0,"355"]],"q":"정기선의 운임이 liner terms로서 선적 및 양륙의 하역비를 선주가 부담해야 하는 이유로 타당한 것은?","c":["화물이 많든 적든 적하품이 있든 없든 반드시 취항하기 때문이다.","운송화물의 대상이 주로 소량의 일반화물이기 때문이다.","부정기선처럼 자유거래에 의하여 결정할 수 있기 때문이다.","다수의 화주로부터 소량화물을 인수하여 운송하고 운임도 공시된 운임표에 따르기 때문이다."],"a":3},{"id":355,"t":[[0,"356"]],"q":"다음 통운임에 대한 설명으로 바람직하지 못한 것은?","c":["운송구간의 기본운임에 접속지에서 도착지에 이르는 구간의 arbitrary를 가산한 것이다.","Arbitrary를 구성하는 내용은 일부 운송구간의 운임(local freight) 및 접속비용과의 합계이다.","접속비용은 접속을 위한 선적, 양륙비, 접속선 대기를 위한 창고료 등이 있다.","예정 기항지 이외에 적하 혹은 양하를 위해서 기항을 하는 화물에 대해서는 특별한 운임부가율이 설정된 경우이다."],"a":3},{"id":356,"t":[[0,"357"]],"q":"다음 중 북미수출의 경우 도착항에서의 하역 및 터미널 작업비용을 해상운임과는 별도로 징수하는 부대비용은?","c":["부두사용료","터미널화물처리비","도착지화물인도비용","컨테이너세"],"a":2},{"id":357,"t":[[0,"358"]],"q":"용선계약시에는 선하증권 국제통일조약을 적용하지 않기 때문에 공공의 질서를 해치지 않는 한 그 범위는 제한이 없으나, 제외조항이 있는데 이에 해당되지 않는 경우는?","c":["선원의 선행(good deeds)","나포·포획(capture and seizure)","관청의 강제관리(restraint of princes)","국적(king's enemies)"],"a":0},{"id":358,"t":[[0,"359"]],"q":"미국항로에 취항하는 선사들에게 Tariff에 신고된 운임률이나 기타 조건에 관계없이 독자적인 운임률을 설정할 수 있도록 허용한 운임제도는?","c":["우대운송계약(Service Contract)","독자운임결정권(Independent Action)","기간별 물량별 운임(Time Volume Rate)","지역운임(local freight)"],"a":1},{"id":359,"t":[[0,"360"]],"q":"다음에서 우대운송계약(Service Contract)에 포함되어 있지 않은 내용은?","c":["계약기간","최저물량","계약운임","중개수수료"],"a":3},{"id":360,"t":[[0,"361"]],"q":"다음 중 해상운임의 표시통화에 대한 설명으로 적절하지 않은 것은?","c":["운임률을 표시하는 통화의 종류를 운임의 표시 통화(지급통화)라 한다.","우리 나라를 중심으로 하는 정기선(liner)항로에 있어서는 운임을 거의 미국 통화(U.S. Dollar)와 영국 통화(Sterling Pound)로 표시되어 있다.","운임률(tariff)는 해운동맹에 의해 결정하기 때문에 표시통화는 US Dollar만으로 사용한다.","정기선의 경우 반드시 B/L면에 운임표시통화를 명시하고 있다."],"a":2},{"id":361,"t":[[0,"362"]],"q":"정기선에 의한 개품운송에 있어서는 선불이 원칙이지만 어떤 경우에 후불이 가능한가?","c":["CIF나 CFR계약의 경우","선박회사의 승인이 있는 경우","화주가 고의로 화물의 내용, 가격 또는 중량에 관하여 허위신고를 한 경우.","선적할 때 지정 검량인(sworn measurer)에게 검량을 시키는 경우"],"a":1},{"id":362,"t":[[0,"363"]],"q":"용선계약상의 선박을 다시 제3자에게 용선하는 경우의 허가 및 조건을 나타내는 조항은?","c":["중재조항","공동해손조항","이로","재용선"],"a":3},{"id":363,"t":[[0,"364"],[4,""]],"q":"다음 중 가장 오래된 역사를 지닌 CALCUTTA 해운동맹의 항로는??","c":["영국·인도항로","구주/호주 항로","극동/미태평양 항로","극동/미대서양 항로"],"a":0},{"id":364,"t":[[0,"365"]],"q":"다음에서 정기선 운송의 의의에 대해서 잘못 서술하고 있는 것은?","c":["정기선항로에 취항하고 있는 선박을 말한다.","컨테이너 화물 전용의 컨테이너선과 재래선으로 분류한다.","정해진 기항항 사이를 정해진 운항일정에 따라 항해하고 있다.","산화물을 운송하는 의미로 통상 사용되고 있다."],"a":3},{"id":365,"t":[[0,"366"]],"q":"다음에서 폐쇄식 동맹(Closed conference)를 잘못 설명하고 있는 것은?","c":["신규가입을 극단으로 제한하는 형태로서 영국식 동맹이라고 부른다.","동맹이 승인할 만한 일정자격과 실적을 갖고 있지 않는 선박회사는 가입시키지 않는 방식이다.","그 항로에 배선하는 의지 및 능력이 있는 선주면 언제라도 자유로이 가입시키는 형태로 미국식 해운동맹이라고 한다.","구주항로나 호주항로 등에 결성되어 있다."],"a":2},{"id":366,"t":[[0,"367"]],"q":"다음 중 해운동맹의 내부규제에 해당되는 사항으로 거리가 먼 것은?","c":["운임협정(rate agreement)","독자운임결정권(Independent Action)","배선협정(sailing agreement)","공동계산협정(pooling agreement)"],"a":1},{"id":367,"t":[[0,"368"],[4,""]],"q":"다음 해운동맹의 내부규제인 배선협정에 대한 설명으로 관계가 없는 것은?","c":["특정의 항로에 있어서 배선선복량을 조절·제한하고 선복과잉에 의한 과당경쟁을 방지하려는 것이다.","일정한 항로에 있어서 항해수, 기항지, 운항 schedule 등을 규제한다.","생산업자간의 수량 카르텔에 해당된다.","각 항로 사정에 따라 이 중 하나 또는 둘 이상을 개별적으로 분리시켜 실시하고 있다"],"a":3},{"id":368,"t":[[0,"369"]],"q":"용선운송계약의 공동해손 조항은 1974년 무슨 규칙에 의해 처리하는 취지의 조항인가?","c":["The New York Produce Exchange Charter양식","Australian Grain Charter 서식","York-Antwerp규칙","Baltic and International Maritime council uniform Time-Charter양식"],"a":2},{"id":369,"t":[[0,"370"]],"q":"다음에서 계약운임제(contract rate system)에 대한 설명으로 올바른 것은?","c":["운임연환불제와는 달리 유보기간은 없이 일정기간 경과 후에 그 환불금을 전액 한 번에 지급한다.","환불에 있어서 그 기간에 이어 계속해서 일정기간 동맹선에만 선적할 것을 조건으로 하여 그 계속되는 일정기간이 경과된 후 환불되는 제도이다.","동맹의 표정운임률에 계약운임률(contract rate)과 비계약운임률(non-contract rate)을 설정하여 화주가 동맹선에만 선적할 것을 계약하면 운임률을 낮게 적용하고 그렇지 않으면 고율의 운임을 적용하는 방식이다.","각 동맹선사들이 일정기간 벌어들인 운임을 사전에 정한 배분율에 따라 배분하는 방법이다."],"a":2},{"id":370,"t":[[0,"371"]],"q":"다음은 국적선 이용제도의 의의에 대한 설명으로 타당하지 않은 것은?","c":["해운산업육성법 제16조에 의거하여 선박을 이용하여 대통령령이 정하는 주요 화물(지정화물)을 운송하고자 하는 자는 국적선을 이용하여야 하는 제도를 말한다.","우리 나라의 정기선 취항지역에 화물을 운송하고자 하는 자는 국적선을 이용하여야 하는 제도를 말한다.","장기적이고 안정적인 운송체제의 확립 및 외화유출방지를 위해 국적선을 이용하여야 한다는 취지를 담고 있다.","정기선화물은 국적선 불취항증명서(waiver), 지정화물은 국적선 운송면제확인을 받지 않아도 외국선박을 이용할 수 있다"],"a":3},{"id":371,"t":[[0,"372"]],"q":"다음에서 해운동맹의 단점으로 적합한 것은?","c":["안정적 자본투자로 서비스의 개선을 촉진한다.","합리적 배선으로 경쟁에 의한 낭비를 방지하고 원가를 절감한다.","운임률이 원가보다 동맹의 정책에 좌우되어 불합리하게 책정된다.","동맹의 가입을 통해 영세선사도 생존 가능하다."],"a":2},{"id":372,"t":[[0,"373"]],"q":"다음 중 용선료의 의미로 적당하지 않은 것은?","c":["운송행위의 보수 선적량 또는 총액운임","운송행위 능력에 관한 보수기간 운임","운송수단인 선박의 임차료","선주와 용선자간의 경비"],"a":3},{"id":373,"t":[[0,"374"]],"q":"다음에서 해운동맹에 가입되었을 경우 이점을 적절하게 설명한 것은?","c":["독점성으로 인해 과대이윤, 서비스의 저하, 클레임의 회피, 보복적 차별우대 등이 있을 수 있다.","발착일이 정확, 자주, 규칙적이며 운송기간이 확정되어 있어 무역거래에 편리하다.","기항수를 가급적 줄이려는 경향이 강해 화주들에게 불편을 준다.","운임환불제, 계약운임제 등이 모두 선사의 일방적 통제하에 이루어진다."],"a":1},{"id":374,"t":[[0,"375"]],"q":"다음 중 선박회사 또는 해운동맹이 일정기간 동안 일정하게 정해진 품목을 선적한다는 조건부로 화주에게 할인혜택을 주는 운임은?","c":["우대운송계약(Service Contract)","독자운임결정권(Independent Action)","기간별 물량별 운임(Time Volume Rate)","지역운임(local freight)"],"a":2},{"id":375,"t":[[0,"376"]],"q":"화주가 선사에 제출하는 운송의뢰서(application for shipment)로서, 화물의 명세가 기재되는 정기선 운송에 있어서 주요한 서류는?","c":["Shipping Request(S/R ; 선복요청서)","Booking Note(선적예약서)","Booking List(예약일람표)","Equipment Receipt(E/R ; 기기수도증)"],"a":0},{"id":376,"t":[[0,"377"]],"q":"다음 중 항해용선계약에서의 용선자의 책임제한 조항의 의미는?","c":["용선자가 화물을 적재하고 비용을 지불하면 그 책임을 면한다는 뜻이다.","용선계약 불이행의 경우에 지불하여야 할 손해배상예정액을 의마한다.","용선자는 청구된 수수료에 대해 제소의 의무에 대한 뜻이다.","인명과 재산의 구조 또는 salvage를 위하여 이로할 것을 허용하거나 거부한다는 의미이다."],"a":0},{"id":377,"t":[[0,"378"]],"q":"다음 컨테이너 내적치도(Container load plan)은 컨테이너 적입된 화물의 명세로 작성할 수 있는 자가 아닌 사람은?","c":["화주 또는 포워드","선주","검수인","CFS Operator"],"a":1},{"id":378,"t":[[0,"379"]],"q":"세관에 대한 반출입신고서, CFS/CY간 화물인수도의 증거, 본선내 법정보존서류, 양륙지에서 보세운송신고서 및 적출작업(devanning) 자료로 사용되는 정기선의 주요 서류는?","c":["Shipping Order(S/O ; 선적지시서)","Dock Receipt(D/R ; 부두수취증)","Container Load Plan(CLP ; 컨테이너 내적치도)","Mate's Receipt(M/R ; 본선수취증)"],"a":2},{"id":379,"t":[[0,"380"]],"q":"다음 중 본선수취증에 대한 설명으로 해당되지 않은 내용은?","c":["본선이 M/R에 기재된 상태로 화물을 수취하였음을 인정하는 영수증이다.","선적요청을 받은 선사(또는 대리점)가 송화인에게 교부하는 선적승낙서이다.","M/R은 본선과 송화인간에 화물의 수도가 이루어진 사실을 증명하는 것이다.","선적완료 후 검수집계표(outturn report)에 근거하여 일등항해사(chief mate)가 선적화물과 선적지시서(S/O)를 대조, 송화인(shipper)에게 교부한다."],"a":1},{"id":380,"t":[[0,"381"]],"q":"다음 중 해운산업육성법에 근거한 주요 정책화물로 해당되지 않는 것은?","c":["원유","제철원료","액화가스류","의료제품류"],"a":3},{"id":381,"t":[[0,"382"]],"q":"하역중인 화물의 개수, 화인, 포장상태, 화물사고 등을 기재하는 검수화물목록은 누가 작성하는 가?","c":["화주","선주","검수인","포워더"],"a":2},{"id":382,"t":[[0,"383"]],"q":"다음 중 양륙지의 세관 등에 제출하는 중요한 서류이므로 각국의 규정·관습 등을 충분히 숙지할 필요한 주요 서류는?","c":["Delivery Order(D/O ; 인도지시서)","Manifest(M/F ; 적하목록)","Mate's Receipt(M/R ; 본선수취증)","Shipping Order(S/O ; 선적지시서)"],"a":1},{"id":383,"t":[[0,"384"]],"q":"다음 정기용선계약의 특별조항애서 보통 break down clause라 불리워지는 것으로 선박의 사고로 인해 운항불능이 되었을 경우 용선료를 조정한다고 하는 취지의 규정은?","c":["연료 및 항비의 부담에 관한 조항","선박상실에 의한 과불금 및 용선료의 반환","off hire조항","배선명령에 대한 용선자의 책임"],"a":2},{"id":384,"t":[[0,"385"]],"q":"다음 중 용선자가 선주를 대신해서 선원의 교체를 요구하는 규정은?","c":["배선명령에 대한 용선자의 책임","선박상실에 의한 과불금 및 용선료의 반환","선장 및 기관장에 대한 용선자의 해임청구권","배선명령에 대한 용선자의 책임"],"a":2},{"id":385,"t":[[0,"386"]],"q":"다음에서 선박의 인도 및 반환시에 남아있는 기름은 각각 상대방에게 시가로 인계 인수하여야 한다는 규정은?","c":["잔유","입거","off hire조항","선하증권"],"a":0},{"id":386,"t":[[0,"387"]],"q":"다음의 선박 중 일반화물선으로 컨테이너를 운송할 수 있는 구조를 갖지 않은 선박은?","c":["재래화물선(conventional ship)","세미컨테이너선(semi-container ship)","RO/RO선(Roll on/Roll off Vessel)","다목적선(multi-purpose ship)"],"a":0},{"id":387,"t":[[0,"388"]],"q":"다음에서 계약당사자의 명칭으로 잘못 짝지어진 것은?","c":["용선자 - Charterer","선주 - Owner","화주 - Forwarder","선박경영자 - Operator"],"a":2},{"id":388,"t":[[0,"389"],[4,""]],"q":"다음에서 부정기선 운임에 대한 종류로서 해당되지 않는 것은?","c":["용적을 단위로 하는 화물운임","화물이 고가인 경우에는 종가운임제","중량을 단위로 하는 화물운임","화물이 저가인 경우에는 최저운임제"],"a":3},{"id":389,"t":[[0,"390"]],"q":"다음 운임 지불방법 중 선불인 경우에 해당되는 경우는?","c":["착불(payable on arrival destination)","양하완료시불(payable on completion of discharging)","B/L 발행시불(payable on signing of B/L)","비례운임(pro rate freight)"],"a":2},{"id":390,"t":[[0,"391"]],"q":"다음에서 당해 항구의 관습적 하역방법 및 하역능력에 따라 할 수 있는 한 빨리 적양 하역을 하는 조건을 말하는 것은?","c":["관습적 조속하역조건","연속작업일조건","호천작업일조건","공휴일작업조건"],"a":0},{"id":391,"t":[[0,"392"]],"q":"다음은 호천작업일조건(Weather Working Days)에 관한 설명으로 관계가 먼 것은?","c":["기상조건이 하역 가능한 상태의 날만 정박기일에 산입하는 것으로 현재 가장 많이 택하고 있는 조건이다.","공휴일은 원래 근로일이 아니므로 하역을 하더라도 보통 정박일수에 산입하지 않는다. 이것을 \"Sunday and holidays excepted\"의 첫글자를 따라 SHEX라고 한다.","우천, 파업 및 기타 불가항력 등 어떠한 원인에도 관계없이 하역개시 이후 종료시까지의 일수는 모두 정박기간에 계산하는 방법이다.","어떠한 기상이 하역 가능한 상태인가 하는 것은 화물의 종류에 따라 많은 차이가 있으므로 이러한 문제를 해결하는 방법으로 선장과 화주가 그 때마다 합의 결정하는 것이 현명한 방법이다"],"a":2},{"id":392,"t":[[0,"393"],[4,""],[4,""]],"q":"다음은 해약기일에 대한 설명으로 적합하지 않은 내용은?","c":["해약기일(cancelling date)을 약정하여 해약기일이 넘으면 화주는 해약권을 발동할 수 있다.","해약기일은 C/P면에 기재되며","해약기일이 도래하더라도 선박의 운항이 일기나 고장수리 등으로 방해를 받는 수가 많기 때문에 Gencon Form에서는 입항하기 48시간 전에 화주에게 통고해야 한다.","해약기일은 본선 사정상 예정일로부터 대개 30일 정도 여유를 두는 것이 보통이다."],"a":3},{"id":393,"t":[[0,"394"]],"q":"다음의 Gencon Form의 해약조항에 대한 설명으로 관계가 없는 것은?","c":["본선이 지정된 월일에 선적준비를 정돈하지 못하면 용선자에게 본 계약을 해제할 수 있는 선택권을 주고 있다.","본선이 해손으로 지연되는 경우는 가급적 신속히 용선자에게 통고하되 적재준비정돈예정일을 10일 이상 초과할 때는 용선자는 계약의 해제선택권을 갖게 된다.","선택권은 요청이 있을 때 본선 선적예정일의 최소 1일 이전에 통고해야 한다.","용선자의 계약의 해제선택권의 적용은 해약기일을 약정할 때에 한한다."],"a":2},{"id":394,"t":[[0,"395"]],"q":"다음에서 초과정박일에 대한 용선자 또는 화주가 선주에게 지급하는 보수는?","c":["손해금","체선료","조출료","중개료"],"a":1},{"id":395,"t":[[0,"396"]],"q":"다음은 체선료에 대한 설명으로 올바르지 않은 것은?","c":["실무상으로 초과체박기간에 대해 지연손해금을 물게하는 운송계약은 드물고 통상 초과체박기간에 대해 약정된 체선료를 물고 있다.","초과정박일에 대한 용선자 또는 화주가 선주에게 지급하는 보수이다.","체선료는 1일 24시간을 기준하여 계산한다.","체선료는 불확정손해(unliquidated damage)로서 만약 당사자 사이에 분쟁이 생겨 중재에 회부되거나 소송이 제기되면 각각 중재인 및 법원이 그 손해액을 결정한다."],"a":3},{"id":396,"t":[[0,"397"]],"q":"다음의 조출료(dispatch money)에 대한 설명으로 적절한 것은?","c":["용선계약상 허용된 정박기간 종료전에 하역이 완료되었을 때 그 절약된 기간에 대하여 선주가 용선자에게 지급하는 일종의 상여금이다.","선주가 운임, 부적운임, 체선료 및 체박손해금 등에 대하여 화물의 유치권을 대한 보상액이다.","불가항력 이외의 사유로 용선계약을 위반했을 때 위약 당사자가 그 상대방에게 지불하는 비용을 말한다.","초과정박일에 대한 용선자 또는 화주가 선주에게 지급하는 보수이다."],"a":0},{"id":397,"t":[[0,"398"]],"q":"다음에서 용선할때 일정량의 운송화물을 계약하였는데 화주가 그 계약수령을 선적하지 못했을 때 선적하지 않은 화물량에 대해 지급하는 운임은?","c":["선복운임","비례운임","부적운임","연속항해운임"],"a":2},{"id":398,"t":[[0,"399"],[4,""]],"q":"다음운 우리나라 해운업법과 그 시행령에 규정된 해운관련 업종 중 순수 해운업으로 분류되는 것은?","c":["해운중개업","선박대여업","해상화물운송사업","해상화물운송주선업"],"a":0},{"id":399,"t":[[0,"400"],[4,""]],"q":"다음에서 포장을 하지 않은 상태로 운송하는 화물로서 주로 부정기선 화물의 대부분이 속하는 것은?","c":["건화물(dry cargo)","액상화물(liquid cargo)","산화물(bulk cargo)","기피화물(dirty cargo)"],"a":2},{"id":400,"t":[[1,"1"]],"q":"다음에서 선하증권(Bill of Lading ; B/L)에 대한 설명으로 맞지 않는 것은?","c":["증권에 명시된 화물수취증이다.","운송의 법적 계약서이다.","운임계산서이다.","기명식 선하증권(Straight B/L)의 경우에는 선하증권의 소유자가 화물에 대한 권리를 갖는다."],"a":2},{"id":401,"t":[[1,"2"]],"q":"다음에서 선하증권에 종류에 관해 설명한 것으로 적절하지 못한 것은?","c":["무하자선하증권은 화물이 양호한 상태로 적재되어 증권면에 아무런 사고적요(remarks)가 없는 선하증권이다.","수취선하증권은 수하인란에 수하인의 이름이 기재된 선하증권이다.","기명식선하증권은 수하인란에 수하인의 이름이 기재된 선하증권이다.","지시식선하증권은 수하인란에 특정 수하인명이 기재되지 않고 단순히\"to order\", \"to the order of xxBank\" 등으로 기재된 선하증권이다."],"a":1},{"id":402,"t":[[1,"3"]],"q":"다음에서 선하증권의 효력의 발생요건으로 거리가 먼 것은?","c":["선하증권의 소지인이 선의로 취득하였을 것","선하증권의 소지인가 해상운송인과의 운송관계일 것","선하증권의 기재사항은 선하증권의 소지인을 위한 것일 것","선하증권은 운송인과 계약당사자간의 채권적인 법률관계 일 것"],"a":3},{"id":403,"t":[[1,"4"]],"q":"다음 중 선하증권의 채권적 효력의 한계를 설명한 것으로 타당하지 않은 것은?","c":["운송채권의 소멸시효인 1년이 지남으로서 그 효력을 상실한다.","선하증권은 유통성보호를 위한 그 채권적인 효력은 인정되지 않는다.","운송물의 멸실, 훼손 또는 연착이 법정면책사유를 그 원인으로 할 경우 효력을 상실한다.","선하증권의 작성행위 자체가 사기 또는 강박 등의 숨은 흠이 있는 경우에는 무효이다."],"a":1},{"id":404,"t":[[1,"5"]],"q":"다음 중 운송인이 운송물을 수령하고 선하증권을 정당하게 소지할 사람에게 인도하였을 때 발생되는 효력은?","c":["채권적 효력","상환적 효력","물권적 효력","환수적 효력"],"a":2},{"id":405,"t":[[1,"6"]],"q":"다음 중 선하증권의 기능을 올바르게 설명하고 있는 것은?","c":["운송물에 관한 손해, 멸실, 훼손 또는 연착 손해의 경비를 대시 지불하는 것","어음상의 권리의 담보로서 할인은행에 신탁적 양도 또는 질권의 목적으로 처분되는 것","송하인에  가능한 B/L"],"a":3},{"id":462,"t":[[1,"63"]],"q":"신용장상에 「Shipment to be effected by JG Shipping Co.」라고 명시되어 있는 경우 다음 설명중 옳은 것은?","c":["수입자로부터 별도의 허가를 받아 수출자가 JG해운의 선박을 수배하여 물품을 선적한다.","수출자는 매입은행에 매입의뢰시 JG해운이 발생한 선하증권을 제시하여야 한다.","수입자가 JG해운으로부터 선하증권을 발급받아 수출자에게 교부한다.","JG해운은 수입자의 운송대리인이나, 운임은 수출자가 부담한다."],"a":1},{"id":463,"t":[[1,"64"]],"q":"다음 중 운송구간(선적항 및 양륙항)이 동일 국가인 경우의 B/L은?","c":["내국선하증권 (Local B/L )","적색 선하증권(Red B/L)","선적선하증권(Shipped B/L)","통선하증권 (Through B/L)"],"a":0},{"id":464,"t":[[1,"65"]],"q":"B/L상 송하인으로 기재되는 것은 신용장상의 수익자가 일반적이지만 수익자 이외의 제3자를 송하인으로 허용하는 이유는?","c":["수입자가 수익자로 부터 물품을 조달 받기위한 경우","신용장에 구체적인 명시를 확실하게 하기 위한 경우","신용장발행 의뢰인이 물품의 실매도인을 수입자에게 알리고 싶지 않을 경우","수하인에게 신속하게 화물의 인도가 이루어 질 수 있도록 제도화 한 경우"],"a":2},{"id":465,"t":[[1,"66"]],"q":"다음에서 FIATA 복합운송 선하증권 표준약관 (1992)의 내용과 다른 것은?","c":["포워더의 물품에 대한 책임기간은 포워더가 물품을 인수한때부터 물품을 인도할 때까지이다.","복합운송 선하증권이라 할지라도 이 약관은 단일 운송수단만이 사용된 경우에도 똑같이 적용된다.","화주는 위험품의 경우 포워더가 물품을 인수하기 전에 화물의 정확한 성질을 서면으로 통지해야 한다.","물품이 인도되어야 할 날 또는 인도되지 않아 멸실된 것으로 간주권한을 갖는 날로부터 1년 이내에 소송이 제기되지 않으면 포워더는 모든 책임으로 면제된다."],"a":3},{"id":466,"t":[[1,"67"]],"q":"다음에서 B/L 화물 전량이 On Dock 터미널에서 인수 또는 반입된 시점을 말하는 것은?","c":["LCL","FCL","CFS","OBL"],"a":1},{"id":467,"t":[[1,"68"]],"q":"우리나라 관행 상 화물의 수취와 선박이 접안 후 발해하는 B/L은 다음 중 어느 것인가?","c":["수령선하증권","용선계약부선하증권","선적선하증권","통선하증권"],"a":2},{"id":468,"t":[[1,"69"]],"q":"다음 중 B/L 상 운임 및 요금 적용 시 중요 준수사항과 관계가 없는 것은?","c":["미국발착 화물의 경우는 FMC에 신고 ․ 발효 중인 S/C 또는 공표한 Tariff 운임을 적용하여야 한다.","선하증권에 기재된 화물전량이 운송인에 의해 수취된 날에 유효한 S/C 또는 Tariff 운임을 적용하여야 한다.","Minimum B/L Charge가 있는 경우, 실재 화물량(CBM 또는 Kilo ton)에 대해 산정한 운임이 Minimum Charge보다 작은 경우는 Minimum B/L Charge를 적용한다.","송하인이 화물의 가액을 신고하여 이를 B/L에 기재하는 경우는 종가요금(ad valorem charge)을 적용하지 말아야 한다."],"a":3},{"id":469,"t":[[1,"70"]],"q":"다음 중 미국을 발착(發着)하는 화물에 대한 운임적용관려 주요사항으로 적합하지 않은 것은?","c":["미연방해사위원회(FMC)에 신고한 S/C 운임의 적용하여야 한다.","일반에 공표한 TARIFF 운임의 적용하여야 한다.","만약 어떤 품목에 대한 S/C운임이 표정Tariff의 운임보다 높을 경우는 Tariff운임을 적용할 수 없다고 S/C로 약정한다.","S/C에 의거 화물운송이 이루어지면 B/L에는 S/C로 약정한 운임 123"]],"q":"해공복합운송에 대한 설명 중 적합하지 않은 것은?","c":["해상운송이 가지는 저운임과 항공운송이 갖는 신속성을 효과적으로 결합","일반적인 항로는 일본과 북미서해안간의 태평양해상에서는 해상운송을 이용하고, 미국내륙 및 미국과 유럽간에는 항공운송을 이용","대륙과 해상을 잇는 교량역할을 하는 land bridge 방식으로 이용","운송일수가 대폭 단축되며, 항공운송만 이용하는 경우에 비해 소요운임이 적게드는 이점"],"a":2},{"id":523,"t":[[1,"124"]],"q":"복합운송에서 일관운임(Through rate)의 설정에 대한 설명으로 타당하지 않은 것은?","c":["복합운송의 서비스 대가로 각 운송구간마다 분할된 운임을 설정해야 한다.","운송구간에 대한 책임이 복합운송인에게 집중되어 있으므로 이에 대한 반대 급부도 하나로 통합되어야 한다.","복합운송의 서비스 대가로 전 운송구간의 단일화된 운임을 설정하여야 한다.","일관운임의 산출은 단순 합산이 아닌 Scale merit(규모의 경제)가 반영되어 산출하여 합리적인 요율을 제시할 수 있다."],"a":0},{"id":524,"t":[[1,"125"]],"q":"화주에 대해 운송계약의 체결자인 복합운송인이 전 운송구간에 대한 책임을 지지만, 그 책임은 운송구간 고유의 원칙에 의하는 체계는 다음 중 어느 것인가?","c":["단일책임체계(Uniform Liability System)","이종책임체계(Network Liabilty System)","변형단일책임체계(Modified Liability System)","단일운송인책임체계(Single Carrier's Liability System)"],"a":1},{"id":525,"t":[[1,"126"]],"q":"Land Bridge의 목적으로 적당하지 않은 것은?","c":["운송비용의 절감","전체 소요시간의 감소","주요 내륙운송망에 탁월한 접근성을 가진 소수의 항만에 화물량을 집중","해상-육상-해상으로 이어지는 운송구간으로 해상운송구간을 집중하기 위한 운송 증감"],"a":3},{"id":526,"t":[[1,"127"]],"q":"Land Bridge의 특징을 서술한 것으로 적합하지 않은 것은?","c":["단일운송수단의 통제와 책임","단일 선하증권","Sea-Land-Sea 방식을 통한 복합운송의 형태","해공복합운송의 한 형태"],"a":3},{"id":527,"t":[[1,"128"]],"q":"시베리아를 육상가교로 하여 한국, 일본, 극동, 동남아, 호주 등과 유럽대륙, 스칸디나비아반도를 연결하는 복합운송형태는?","c":["ALB(American Land Bridge)","CTB(Canadian Land Bridge)","SLB(Siberian Land Bridge)","MLB(Mini Land Bridge)"],"a":2},{"id":528,"t":[[1,"129"]],"q":"SLB(Siberian Land Bridge)의 특성을 설명한 것 중 거리가 먼 것은?","c":["SLB의 운영주체는 TSR(Trans Siberian Railway)이다.","1971년 부터 본격 개시되어 한국, 대만, 홍콩, 필리핀, 호주, 뉴질랜드까지 집하지역이 확대되었다.","부산~보스토치니(Vostochny)간을 컨테이너선으로 해상운송한 후 시베리아 철도의 컨테이너전용열자(block train)으로 러시아의 유럽국경까지 운송한 후 유럽의 철도, 트럭, 선박을 이용하는 복합일관운송한다.","1979년 일본의 포워더에 의해서 개발된 운송루트이다."],"a":3},{"id":529,"t":[[1,"130"]],"q":"부산에서 로테르담간 루트별 B26수송거리를 비교한 것 중 사실과 관계가 먼 것은?","c":["시베리아(Siberia) 철도 경유 ~ 13,000㎞","수에즈(Swez)운하 경유 - 20,000㎞","케이프타운(Cape Town) 경유 ~ 27,000㎞","피나마(Panama) 경유 ~ 23,000㎞"],"a":1},{"id":530,"t":[[1,"131" (CMR)","1992년 UNCTAD/ICC 복합운송증권규칙","1980년 UN국제복합 운송조약"],"a":1},{"id":540,"t":[[1,"141"],[4,""]],"q":"복합운송에 대한 각 조약(규칙)뼐 책임한도액으로 적합하지 않은 것은?","c":["Hague-Visby Ruels(1968) - 30 포앙카레프랑 (약 US $2.00)","Hamburg Rules(1978) - 2.5 SDR (약 US $3.50)","CMR(1956) - 50제미날 프랑 (약 US $ 16.00)","UNCTAD/ICC(1992) - 2 SDR (약 US $2.80)"],"a":2},{"id":541,"t":[[1,"142"],[4,""]],"q":"1980년 UN 국제복합운송조약상의 운송인의 책임내용으로 적합하지 않은 것은?","c":["복합운송인의 책임은 과실책임주의에 의한다.","복합운송인의 책임한도액은 손해 발생국간이 판명된 때는 국제법, 국제조약 또는 UN 조약상의 책임한도액이 가장 높은 금액으로 한다.","복합운송인의 책임한도는 이종책임제계에 의하지 않고 변형단일책임체계에 의한다.","복압운송인에 의한 물품의 수취지 또는 인도지의 어느 한 국각가 체약국이면 UN 조약이 강제적을 적용될 수 없다."],"a":3},{"id":542,"t":[[1,"143"],[4,""],[4,""]],"q":"복합운송인의 책임제한에 관한 설명으로 바람직하지 않은 것은?","c":["멸실/훼손된 물품의 포장 당 666.67 SDR 또는 1㎏당 2 SDR 중 큰 금액으로 제한","해상운송이나 내수로운송이 포함된 경우는 물품의 1㎏당 8.33 SDR로 제한","특정구간에서 책임이 발생되었을 때는 그 구간에 적용되는 국제조약 또는 해당국의 강행법이 정한 책임한도액에 따름","지연손해의 책임한도는 복합운송계약에 의한 운임을 초과하지 않는 금액으로 제한"],"a":1},{"id":543,"t":[[1,"144"],[4,""],[4,""]],"q":"인도지연의 경우 복합운송인의 책임한도액에 대하여 서술한 것으로 적합하지 않은 것은?","c":["복합운송계약상의 운임총액을 상한으로 한다.","지연된 운송물에 대하여 지급되는 운임의 2.5배에 상당하는 금액으로 제한한다.","1978년 Hamburg Rule을 따른다.","지연과 일부 멸실, 훼손이 같이 발생할 경우는 해당 운송물의 전손(total loss)의 경우에 인정되는 한도액을 10% 초과한다."],"a":3},{"id":544,"t":[[1,"145"],[4,""]],"q":"1975년 ICC의 국제복합운송증권에 관한 통일규칙에서 복합운송인의 주요 면책사항을 규정한 내용과 거리가 먼 것은?","c":["화주의 작위 또는 부작위로 기인한 손해 및 포장이나 기호의 오류 또는 불충분 등에 기인한 손해","불가항력 및 동맹파업 등에 기인한 손해","운송물의 고유의 하자 등에 의한 손해","특정구간에서 멸실 또는 훼손에 의한 손해"],"a":3},{"id":545,"t":[[1,"146"]],"q":"다음 중 1992년 UNCTAD/ICC복합운송증권규칙에 대한 설명으로서 적합하지 않은 것은?","c":["이 규칙을 복합운송계약에 삽입시키는 경우 이 규칙이 적용되며, 이경우 단일운송 또는 복합운송계약이냐에 관계없이 적용됨","책임원칙은 변형단일책임체계을 원칙으로 함","인도지연에 따른 간접손해에 대해서는 운임의 2.5배 범위내에서 계상함","전손에 대한 책임한도액을 규정함"],"a":2},{"id":546,"t":[[1,"147"]],"q":"Freight Forwarder가 화주의 화물을 요구하는 목적지까지 안전하고 신속하게 운송하는데 이때 제공되는 서비스가 아닌 것은?","c":["통관 및 입출고","선적 및 운송","보험 및 운임료결정","집화 및 환적"],"a":2},{"id":547,"t":[[1,"148"]],"q":"영국에서 선사를 위해 선복판매를 하며 그들의 일부는 지금도 선적중개인으로 활동하는 이는?","c":["Forwarding Agent","Shipping Agent","I dation","Port Consolidation","Multi Consolidation"],"a":2},{"id":567,"t":[[1,"168"]],"q":"Forwrder가 업무형태에서 혼재(Consolidation)의 특성에 관해 적합하지 않은 것은?","c":["소량화물(Less than Contanier Load; LCL)의 선적 용이","과다한 도착지 국내운송료 부담","Forwarder의 소량화물의 혼재이익을 취득","물량의 단위화로 하역 및 운송 취급상 용이"],"a":1},{"id":568,"t":[[1,"169"]],"q":"다음 중 주로 Buyer's Consolidation에 이용되는 운송구분은 다음 중 어느 것인가?","c":["CY/CY (FCL/FCL, Door/Door)","CFS/CY(LCL/FCL, Pier/Door)","CFS/CFS(LCL/LCL, Pier/Pier)","CY/CFS(FCL/LCL, Door/Pier)"],"a":1},{"id":569,"t":[[1,"170"]],"q":"다음 중 주로 Forwarder's Consolidation에이용되는 운송방법은 다음 중 어느 것인가?","c":["CY/CY (FCL/FCL, Door/Door)","CFS/CY(LCL/FCL, Pier/Door)","CFS/CFS(LCL/LCL, Pier/Pier)","CY/CFS(FCL/LCL, Door/Pier)"],"a":2},{"id":570,"t":[[1,"171"]],"q":"FCL(Full Container Load)의 경우 화주가 자신의 책임과 비용을 공장 또는 창고에서 화물을 컨테이너에 적입하게 되는데 이러한 vanning 형태를 말하는 것은?","c":["Shipper's Pack","Buyer's Pack","Carrier's Pack","Importer's Pack"],"a":0},{"id":571,"t":[[1,"172"],[4,""],[4,""]],"q":"다음 혼재업자(condolidator)의 임무를 설명한 것 중 적합하지 않은 것은?","c":["화물의 생산일정 파악","선적준비 완료된 화물의 혼재계획 수립","선적서류 작성 및 제출","국내운송료 및 선박운임료 결정"],"a":3},{"id":572,"t":[[1,"173"],[4,""]],"q":"혼재화물(Consolidated Cargoes)의 경우 혼재된 화물의 내용, 순위 및 위치를 컨테이너별로 기재한 서류를 말하는 것은?","c":["Master(Ocea Carrier) B/L","Commercial Invoice","Packing List","Container Load Plan"],"a":3},{"id":573,"t":[[1,"174"],[4,""]],"q":"대규모의 생산설비 및 건설기자재가 특정한 공사계획에 따라 일시 또는 지속적으로 운송될 경우 발생되는 화물의 취급업무를 지칭하는 것은?","c":["Co-Loading Service","Project Cargo Handling Service","Consolidation Service","Hanging Garment Handling Service"],"a":1},{"id":574,"t":[[1,"175"]],"q":"다음 중 ATA Carnet의 특성을 설명한 것 중 적합하지 않은 것은?","c":["일시 수입이나 보세 운송에 있어 수입세 면제와 통관절차 간소화를 목적으로 발급되는 국제적 통관수첩이다.","ATA Carnet을 소지한 자가 협약 가입국에 일시반입이나 일시 수입을 위한 물품 통관시에는 세금을 지불하므로 일정기간내에 재반출할 필요가 없다.","ATA Carnet 발급물품으로 2개국 이상 순회하고자 하는 경우 수출입신고서를 필요한 만큼 더 발급받으면 가능하다.","ATA Carnet의 유효기간이 발급일로 부터 1년일 때 수출통관증서를 사용하며 수출신고시에는 동 증서를 수출신고서로 갈음한다."],"a":1},{"id":575,"t":[[1,"176"],[4,""]],"q":"가죽 및 모피의류 등과 같은 고가의 의류수송 서비스 형태로 Ca
