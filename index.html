장은 통과화물에 대한 재혼재작업 신고가 있는 경우 세관공무원으로 하여금 당해 물품에 대한 작업상태를 확인하게 한다.","보세구역설영인은 재혼재하고자 하는 통과화물에 대한 관리대장을 비치하고 물품반출입사항 등을 기록관리한다."],"a":1},{"id":584,"t":[[1,"185"]],"q":"다음 중 House Forwarding Service의 목적으로 타당하지 않은 것은?","c":["수출입업자에게 불필요한 부대경비 절감","수출입업자에게 불필요한 인력절감","전문 Freight Forwarder에 의한 신속 정확한 화물 운송","전문 Freight Forwarding 업체를 통한 생산 및 판매시장개척"],"a":3},{"id":585,"t":[[1,"186"],[4,""]],"q":"거래상대국의 정부로부터 허가받은 보세창고(Bonded Warehouse)에 상품을 무상으로 반출하여 현지에서 매매계약을 체결하고 판매하는 거래방식은?","c":["특수화물 운송서비스 및 각종대행서비스","보세창고도거래서비스","환적화물취급서비스","프로젝트화물 취급 서비스"],"a":1},{"id":586,"t":[[1,"187"]],"q":"다음은 BWT(Bonded Warehouse Transaction) 물품 취급에 관한 사항을 서술한 것으로 적합하지 않은 것은?","c":["BWT 물품은 반드시 보세창고에 장치하여야 한다.","보세창고에 반입될 수 잇는 BWT 물품, Stable B/L 물품 등의 여부를 심사하기 위해서는 반입신고제가 시행되고 있다.","보세창고에 장치된 외국물품의 장치기간은 1년이내이며, 1년의 범위내에서 연장할 수 있다.","BWT 물품이 분할될 때마다 적하목록 정정업무를 하여야 하고 별도의 보세화물양수도신고서에 의해 적하목록정정 일괄처리해야 한다."],"a":2},{"id":587,"t":[[1,"188"],[4,""]],"q":"FIATA(International Federation of Freight Forwarders Associaltion) 관련서류 작성을 위해서 고객(화주)으로 부터 접수받는 서류 중 해당되지 않는 것은?","c":["FFI (FIATA Forwarding Instructions)","FIATA SDT(Shippers Declaration for the Transport of Dangerous Goods)","FIATA SIC(Shippers Intermodal Weight Certification)","FIATA FCT(Forwarders Certificate of Transport)"],"a":3},{"id":588,"t":[[1,"189"],[4,""]],"q":"FIATA관련 서류 작성중 Forwarder의 창고작업을 위해 사용하는 입고확인서로 고객에게 발행하는 서류는 다음 중 어느 것인가?","c":["FCR(Forwarders Certificate of Receipt)","FIATA FCT(Forwarders Certificate of Trnasport)","FBL(FIATA Multimodal Transport Bill of Lading)","FWR(FIATA Warehouse Receipt)"],"a":3},{"id":589,"t":[[1,"190"]],"q":"복합운송에서 1인의 운송인이 전 구간의 운송을 인수하고 그 운송의 일부 또는 전부를 다른 운송인에게 하청을 준 경우의 형태는?","c":["부분운송","하청운송","공동운송","연대운송"],"a":1},{"id":590,"t":[[1,"191"]],"q":"다음 중 복합운송에 관한 일반적인 사실을 설명한 것으로 바르지 않은 것을 고르시오?","c":["동일한 운송수단에서 적재와 하역을 반복하는 것은 복합운송에 포함되지 않는다.","항공운송의 가장 큰 장점은 빠른 속도이다.","복합운송 시 각각의 운송수단별로 별도의 운송서류가 발행되는 것이 일반적이다.","American Land Bridge는 태평양을 횡단하여 미국서안 항구에서 하역하여 미대륙을 트럭이나 철도로 횡단한 수 다시 서안항구에서 선박에 적재하여 유럽으로 운송하는 형태의 복합운송을 말한다."],"a":2},{"id":591,"t":[[1,"192"]],"q":"다음 중 국제항공운송협회의 약어로 적절한 것은?","c":["OPEC","ICC","IATA","OECD"],"a":2},{"id":592,"t":[[1,"193"]],"q":"다음 중 복합운송 관련 기구로 한국복합운송주선업협회의 약어로 적절한 것은?","c":["KIFFA","FIATA","IATA","ICAO"],"a":0},{"id":593,"t":[[1,"194"]],"q":"다음 중 복합수송 확장의 애로사항이 아닌 것은?","c":["모드별 용량의 균등성","국내 및 국제 수송에 있어서의 표준화의 비일관성","안전성의 문제","민간부문의 재정 한계"],"a":0},{"id":594,"t":[[1,"195"]],"q":"우리나라의 Forwarder의 문제점이 아닌 것은?","c":["영세성","전문성 부족","일관서비스 불능","통관업 진출"],"a":3},{"id":595,"t":[[1,"196"],[4,""]],"q":"다음 중 AEO(Authorized Economic Operator)제도를 서술한 것으로 적합하지 않은 것은?","c":["선박의 안전확보, 항만시설의 보안유지와 관련한 제도이다.","수출입 정보를 사전에 세관에 제공하는 제도이다.","국가별 세관이 AEO 상호협정 체결 시 통관절차를 완하하는 제도이다.","우리나라는 2008년부터 도입하여 운영 중이다."],"a":0},{"id":596,"t":[[1,"197"]],"q":"복합운송주선인의 역할에 대한 설명으로 적절한 내용으로 묶인것은?\n㉮화주에게 운송수단선택, 운송경로 등에 대한 전문적 조언\n㉯선적서류의 작성\n㉰통관업무 직접수행\n㉱포장, LCL화물의 혼재와 분류\n㉲보험의 수배","c":["㉮+㉯+㉰+㉱","㉮+㉯+㉱+㉲","㉯+㉰+㉱+㉲","㉮+㉰+㉱+㉲"],"a":1},{"id":597,"t":[[1,"198"]],"q":"다음 중 Freight Forwarder가 수행하는 역할로 적당하지 않은 것은?","c":["수출화주로 부터 수출통관과 국내운송을 위탁받아 이를 수행한다.","수입통관 시에는 화주를 대신하여 수입신고를 자신의 명의로 직접 수행할 수 있다.","혼재화물에 대해 입항하는 관할세관장에게 제출할 혼재 화물 적하목록을 작성한다.","수출화주의 소량화물(LCL)를 위탁받아 이를 혼재작업을 통해 FCL로 만든다."],"a":1},{"id":598,"t":[[1,"199"]],"q":"다음 국제복합운송의 형태 중 화물의 납기를 고려할 때, 중국을 출발하여 한국을 경유, 미주지역 또는 중남미까지 운송할 경우 가장 효율적인 복합운송방식은 어느 것인가?","c":["Sea & Air","Train & Ship","Piggy & Back","Fishy & Back"],"a":0},{"id":599,"t":[[1,"200"]],"q":"다음 중 볼레로(Bolero)에 관한 특성을 기술한 것으로 거리가 먼 것은?","c":["선적서류의 처리 자동화, 대금결제 자동화를 도모","종래의 신용장 거래방식을 기본적으로 유지","시간을 단축하고 비용절감을 도모","SWIFT가 단독출자하여 설립"],"a":3},{"id":600,"t":[[1,"201"]],"q":"우리나라 ICD에 대한 설명 중 적합한 사실이 아닌 것은?","c":["ICD는 LCL화물의 ghswo, 분류 등을 수행하는 CFS가 갖춰져 있다.","ICD는 토지이용, 운송효율성, 교통혼잡완화 등 경제적 효과가 크다.","ICD는 항만기능 중 검역기능을 수행하지 않는다.","ICD는 항만과 떨어진 산업단지 등 인근에 주로 위치한다."],"a":2},{"id":601,"t":[[1,"202"]],"q":"복합운송조건인 FCA에서 송하인과 수화인의 위험부담의 분기점은 언제 인가?","c":["수화인이 물품을 운송인으로부터 인수하는 시점","송화인이 물품을 내륙운송인에게 인도하는 시점","운송인이 물품을 수화인에게 인도하는 시점","운송인이 도착 시 항구에서 물품을 양륙하는 시점"],"a":1},{"id":602,"t":[[1,"203"]],"q":"Sea & Air 복합운송에 관한 설명 중 적당하지 않은 사실은?","c":["해상운송이 지니는 운임의 저렴성과 항공운송이 갖는 신속성을 효과적으로 결합시킨 국제복합일관운송방식이다.","화물의 출발지에서 목적지까지의 운송구간 중 일정구간은 선박으로 운송하고 나머지 구간을 항공기로 운송하는 방식이다.","선사나 해운업자보다는 항공회사, 항공화물업자 및 Sea & Air 전문 Broker등이 주체자가 되어 업무를 주관한다.","아시아 출발 유럽행, 중남미행, 미국행 등 운송거리가 긴 경로에서 유효하다."],"a":2},{"id":603,"t":[[1,"204"]],"q":"다음 중 국제복합운송증권(FIATA B/L)의 주요 내용으로 거리가 먼 것은?","c":["화물을 인도 받기위해서는 적정히 배서된 1통의 증권원본과 상환되어야 한다.","증권에 별도로 표시한 것이 없는 한 증권에 기재된 화물은 운송과 인도를 위해 수령지에서 양호한 상태로 수령하였음을 의미한다.","2가지 이상의 운송수단을 이용할 경우에 적용되며, 단일운송수단을 이용하는 경우에는 적용되지 않는다.","유통불가라는 표시가 없는 한 유통가능한 양식으로 발행하며 증권소지인은 배서 및 양도함으로써 그 권리를 양도할 수 있다."],"a":2},{"id":604,"t":[[1,"205"]],"q":"다음 중 국제복합운송증권(FIATA B/L)의 약관에 대한 설명으로 타당하지 못한 것은?","c":["Lien clause는 운송인, 혹은 그 대리인이 운임을 포함하여 운송관련 비용이 회수되지 않으면 해당화물을 유치할 권리를 갖는다.","선박이 적법한 이유없이 보험증권에 정해진 항해로부터 이탈하였을 때는 보험자는 그 이로(Deviation)에서 책임이 해제된다고 규정하고 있다.","B/L상에 표시되어 있는 'said to contain', 또는 'shipper's stowed, load & count'조항은 부지약관을 의미한다.","On-deck clause는 송화인이 동의하에 화물을 갑판위에 적재하는데, 해상적하보험의 경우 ICC(A)의 경우에는 담보가 안된다."],"a":3},{"id":605,"t":[[1,"206"]],"q":"컨테이너화물의 수입통관과 화물인도 및 수령의 절차를 설명한 것으로 적절하지 않은 것은?","c":["적하목록을 선박이 입항하기 24시간 전까지 입항예쩡지 세관장에게 전자문서로 제출하되 중국, 일본 등 근거리지역으로 부터 입항하는 경우에는 선박입항 시 까지 제출한다.","양륙된 회국화물의 수입신고서, 송품장, 가격신고서, 선하증권 부본, 포장명세서 등을 제출하여 관할 세관에 수입신고를 한다.","어떠한 경우에도 선하증권 원본의 소지인만 화물을 인도가능하다.","선박회사는 운임 및 부대비용을 징수한 후, 화물인도지시서(Delivery Order)를 발행한다."],"a":2},{"id":606,"t":[[1,"207"]],"q":"복합운송주선인의 역할로 인한 수출업자의 이점으로 해당되지 않는 것은?","c":["소량화물의 송화인이 선박회사의 선적 거절이나 혼재(consolidation)상의 어려움의 해결된다.","복합운송증권이나 House B/L을 선적 전에 운송주선인으로부터 발급받아 금융의 원활을 기할 수 있다.","국제운송의 가장 유리한 운송경로와 운송방법을 복합운송주선인으로부터 전문적인 조언을 받을 수 있다.","수많은 개별소량화물의 직접취급으로 인한 인원과 공간을 줄일 수 있으므로 경비를 절감할 수 있다."],"a":3},{"id":607,"t":[[1,"208"],[4,""]],"q":"철도복합운송방식에 대한 특성을 설명한 것 중 가장 적절한 것은?","c":["우리나라에서도 현재 부산항과 광양항 구간에서 2단적 컨테이너 열차를 운행하고 있다.","TOFC방식의 피기백 시스템은 총중량이 크나 철도터미널에서 다단적이 가능하고, 공간의 소요가 적어 철도터미널에서 선호하는 방식이다.","철도/도로 겸용 운송시스템은 장거리 간선수송에서 2단 적재열차보다 더 많은 컨테이너를 운송할 수 있어 유리하다.","철도/도로 겸용 운송시스템인 Roadriler는 TOFC방식에 비하여 터미널 비용 및 트레일러 견인료를 절감할 수 있어 경제적이다."],"a":3},{"id":608,"t":[[1,"209"],[4,""],[4,""]],"q":"Forwarder가 발행하는 FIATA B/L 약관에 기재된 Forwarder의 책임한도액에 대한 설명 중 거리가 먼 것은?","c":["송화인이 화물의 성질, 화물가액을 포워더에 고지하고 종가운임을 지급하며, FIATA B/L상에 기재 시 신고가액이 한도액이 된다.","포워더의 인도지연으로 인한 손해발생 시 FIATA B/L에 의거한 복합운송계약상 운임의 2배상당액을 초과하지 않는다.","화물의 멸실, 손상에 대해 포장당 또는 단위당 SDR 666.67상당액 또는 총중량 kg당 SDR2 상당액 중 더 많은 금액을 초과하지 않는다.","포워더의 총책임은 화물의 전손에 대한 책임한도를 초과하지 않는다."],"a":2},{"id":609,"t":[[1,"210"]],"q":"다음 중 BOLERO의 기능으로 적합하지 않은 것은?","c":["각 볼레로 이용자의 주소, 보증 정보 등의 공통항목 저장한다.","무역금융 및 보험, 대금 결제, 물류 등 무역에서 발생되는 모든 업무를 전용네트워크를 통해 처리한다.","볼레로 선하증권과 해상화물운송장 거래에 포함된 정보 등록과 유지관리를 한다.","볼레로 서류의 작성, 전자서명, 확인, 송신, 수신을 위한 도구로서의 역할을 한다."],"a":1},{"id":610,"t":[[1,"211"]],"q":"다음 중 복합운송에 사용되는 정형거래 조건이 아닌 것은?","c":["EXW (공장인도조건)","FOB (본선인도조건)","CPT (운송비지급인도조건)","DDP (관세지급인도조건)"],"a":1},{"id":611,"t":[[1,"212"]],"q":"보세구역에 장치되어 있는 외국물품이 장치기간경과전임에도 불구하고 공고후 매각할 수 있는 물품이 있는데 대상물품이 아닌 것은?","c":["살아있는 동식물","부패하거나 부패할 우려가 있는 물품","다른 외국물품을 해할 우려가 있는 물품","보세창고료가 현저하게 늘어날 우려가 있는 물품"],"a":3},{"id":612,"t":[[1,"213"]],"q":"복합운송에서 Freight Forwarder가 취급할 수 있는 사업영역에 해당되지 않는 것은?","c":["국제운송물류에 대한 전반적인 컨설팅","화물의 집화, 분배, 혼재 서비스","보험의 수배 및 담보조건 등에 관한 제안","운송사고 하자물품에 대한 검정보고서의 발급"],"a":3},{"id":613,"t":[[1,"214"]],"q":"다음 중 파나마운하에 대한 설명으로 옳지 않은 것은?","c":["아시아에서 미국 동부지역으로의 All water service를 이용할 경우 통과하는 곳이다.","태평양지역의 발보아와 대서양지역의 크리스토발을 연결하는 인공의 운하이다.","Panamax Ship이란 파나마운하를 지나갈 수 있는 최대 크기의 선박을 말한다.","아시아에서 미국 동부지역으로의 컨테이너화물 운송시 파나마운하를 거쳐 운송하는 것이 MLB(Mini Land Bridge) Service보다 운임수준이 높은 편이다."],"a":3},{"id":614,"t":[[1,"215"]],"q":"소량화물(LCL)인 경우 화인에 반드시 표시되어야 하는 사항은?","c":["원산지와 최종도착지","화번과 최종도착지","주화인과 화번","주화인과 최종도착지"],"a":1},{"id":615,"t":[[1,"216"]],"q":"항공화물 혼재업자(consoliator)의 역할에 관한 설명 중 틀린 것은?","c":["항공사의 운송수단을 이용하여 항공사와 같은 입장에서 송화인과 화물운송교섭을 한다.","자체 화물운송요율과 운송약관을 적용하여 자체항공화물운송장(House Air waybill)을 발행한다.","항공회사와 대리점계약을 체결하고 항공사를 대리하여 화물집하활동을 하고 항공사를 대신하여 운송장을 발행한다.","대리점으로서 송화인을 위한 화물의 예약․혼재, 트럭운송, 포장, 통관 관련서류를 작성한다."],"a":2},{"id":616,"t":[[1,"217"]],"q":"다음 중 운송주선인의 일반적인 기능이라고 볼 수 없는 것은?","c":["소량화물의 혼재운송","운송수단의 수배","수출승인의 대행","복합운송의 주선"],"a":2},{"id":617,"t":[[1,"218"]],"q":"선박을 보유하지 않는 자가 운송계약을 체결하는 운송인을 무엇이라 하는가?","c":["Forwarder","Contract Carrier","NVOCC","Common carrier"],"a":2},{"id":618,"t":[[1,"219"]],"q":"다음 중 Dead Freight(공적운임)에 관한 설명으로 옳은 것은?","c":["지불하지 않아도 되는 운임","손상된 화물의 운임","화물을 싣지 않고도 지불해야 하는 운임","선박이 파선하여 선주가 손해를 입은 운임"],"a":2},{"id":619,"t":[[1,"220"]],"q":"다음 중 불특정 화주를 상대로 운송서비스를 제공하는 운송인은?","c":["Forwarder","Common Carrier","Industrial Carrier","Consolidator"],"a":1},{"id":620,"t":[[1,"221"]],"q":"다음에서 복합운송인의 책임체계 중 단일책임으로서 전운송구간 동일형은?","c":["Network Liability System","Uniform Liability System","Combined Liability System","Modified Uniform Liability System"],"a":1},{"id":621,"t":[[1,"222"]],"q":"다음에서 LCL화물을 모아 선사가 컨테이너에 적입하는 곳을 이르는 말은?","c":["Container Yard","Container Freight Station","Bonded Warehouse","ODCY"],"a":1},{"id":622,"t":[[1,"223"]],"q":"다음 중 항공운송이나 복합운송 시 이용할 수 없는 정형거래조건은?","c":["FOB","FCA","CPT","CIP"],"a":0},{"id":623,"t":[[1,"224"]],"q":"정형거래조건에 대한 다음의 설명 중 타당하지 않은 것은?","c":["FOB 조건에서 물품에 대한 위험부담의 분기점은 본선의 선측난간(Ship's Rail)이다.","FCA 조건에서 물품에 대한 위험부담의 분기점은 선적지에서 운송인에게 인도하는 시점이다.","CIF 조건에서 운송위험에 따라 손해가 발생하면 보험금은 매도인이 청구한다.","CIF 조건에서 매도인은 목적지까지의 운임 및 보험료를 부담하여야 한다."],"a":2},{"id":624,"t":[[1,"225"]],"q":"최초의 운송인이 전운송구간에 걸친 운송을 인수하고 그 전부 또는 일부를 다른 운송인에게 운송시키는 형태의 계약을 무엇이라 하는가?","c":["통운송계약","일괄운송계약","후속운송계약","혼합운송계약"],"a":0},{"id":625,"t":[[1,"226"]],"q":"다음에서 물품의 선적과 양륙에 소요되는 하역비를 화주가 모두 부담하는 조건은?","c":["F.I.","F.I.O.","Liner","F.O."],"a":1},{"id":626,"t":[[1,"227"]],"q":"다음 중 화주가 화물을 선적하는데 드는 비용만 부담하고 양륙비용은 선박회사에서 부담하는 하역조건은?","c":["F.I","F.O","liner terms","F.I.O"],"a":0},{"id":627,"t":[[1,"228"]],"q":"다음 중 선적에 대한 다음 설명중 옳은 것은?","c":["Immediate shipment\"의 경우 수출승인후 30일 이내 선적해야 한다.","환적에 대한 언급이 없는 경우 환적은 금지된다.","선적일이 누락된 신용장은 무효이므로 신용장을 변경하여야 한다.","최종선적일이 공휴일이라도 반드시 최종선적일까지 선적하여야 한다."],"a 에 양하항을 확정하지 않고 출항 후 일정기간 뒤에 양하항이 지정되는 양하선택권부 화물에 부과하는 운임을 말한다.","송화인이 운송계약체결 후 화물의 관리를 태만하게 하였거나 또는 여약한 선적을 이행하지 못한 경우 선주에게 지불해야 할 운임을 말한다.","해운동맹이 비동맹선사와의 경재, 특정화물의 유치, 대량화물에 대한 우대 등을 위해 일정조전을 갖춘 굥우 요율을 인하하여 적용하는 운임을 말한다."],"a":2},{"id":662,"t":[[1,"263"],[3,"41"]],"q":"다음은 해상운임의 지급 시기에 대하여 서술한 내용 중 적합하지 않은 것은?","c":["해상운임은 선적과 동시에 송화인에게 지급하는 운임을 선불운임(freight prepaid)라고 한다.","양륙지에서 매수인이 화물을 수령할 때 지급하는 운임을 후불운임(freight collect)라고 한다.","일반적으로 CIF계약이나 CFR계약에서는 통상운임이 후불로 지불 된다.","FOB와 같이 후불인 경우에는 양륙지에서 화물인도지시서(Delivery Order) 발급일, 즉 운임지급일의 환율을 적용한다."],"a":2},{"id":663,"t":[[1,"264"]],"q":"다음에서 항공운송을 선택하는 화물의 종류라고 할 수 있는 것은?","c":["고가화물(보석, 반도체 등)","장척화물","저가화물","산적화물"],"a":0},{"id":664,"t":[[1,"265"]],"q":"다음 중 화물의 수량이 많은 경우에 이용할 수 있는 운송수단은?","c":["자동차운송","항공운송","해상운송","복합운송"],"a":2},{"id":665,"t":[[1,"266"]],"q":"다음 중 복합운송 할 때 화물의 손상에 대해 책임을 지는 사람은?","c":["선주","화주","트럭운송버자","복합운송인"],"a":3},{"id":666,"t":[[1,"267"]],"q":"다음에서 운송 물류 활동을 구성하는 요소가 아닌 것은?","c":["운송모드(mode)","운송 네트워크(network)","운송 노드(node)","운송 링크(link)"],"a":1},{"id":667,"t":[[1,"268"],[4,"96"]],"q":"다음에서 정기선 항로에서 컨테이너 운송과 재래식 정기선에서 사용하는 계약은?","c":["개품운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":0},{"id":668,"t":[[1,"269"],[4,"96"]],"q":"부정기선 항로에서 항해용선계약을 체결 했을 시 운송의 책임자는 누구인가?","c":["선주","화주","해상운송인","중개인"],"a":2},{"id":669,"t":[[1,"270"],[4,"96"]],"q":"개품운송계약의 대표적인 것은 컨테이너 운송이고, 이는 국제해운에서 어떤 계약으로 발전하였는가?","c":["국제복합운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":0},{"id":670,"t":[[1,"271"]],"q":"해상운송인은 송하인에게 운항광고에 명시한 지정항과 운항표에 따라서 감항 능력이 있는 선박을 정시에 입항시켜야 할 의무는?","c":["하역준비완료통지의무","선박제공의 의무","감항능력주의의무","항해을 빨리 완성할 의무"],"a":1},{"id":671,"t":[[1,"272"]],"q":"다음에서 운송 모드(mode)에 해당되는 것이 아닌 것은?","c":["해상운송","복합운송","화물터미널","항공운송"],"a":2},{"id":672,"t":[[1,"273"]],"q":"다음에서 일반적으로 생산자의 공장에서 소비자의 문전까지 문전 서비스를 하는 형태의 운송 서비스는?","c":["해상운송","복합운송","철도운송","항공운송"],"a":1},{"id":673,"t":[[1,"274"]],"q":"다음에서 본선인도조건(free on board:FOB)에 대한 설명 중 적절하지 않은 것은?","c":["무역 상거래 조건의 하나로 FOB의 가격은 수입항 인도 가격이라고 한다.","매도인이 본선상에서 화물의 인도를 마칠 때까지의 일체의 비용과 위험을 부담한다.","FOB의 가격은 무역상품을 수출항에서 매수자에게 인도할 때의 가격을 말한다.","화물의 인도이후에는 매수인의 책임이 된다."],"a":0},{"id":674,"t":[[1,"275"]],"q":"화물을 도착항에서 인도를 받으려면 반드시 필요한 유가 증권은?","c":["환어음","선하증권","약속어음","지급위탁증권"],"a":1},{"id":675,"t":[[1,"276"]],"q":"본선이 목적항에 입항한 후 수화인은 선화증권을 선박회사에 주고 지급 받는 서류는?","c":["화물인도지시서","소요량증명서","원산지 증명서","구매확인서"],"a":0},{"id":676,"t":[[1,"277"]],"q":"다음에서 용선운송에서 B/L 보다 우선하는 것은?","c":["지급위탁증권","용선계약서","지연손해금","용선료"],"a":1},{"id":677,"t":[[1,"278"],[4,"92"]],"q":"다음 중 자본력이 약한 운항선사가 선복을 보충하면서 선대(fleet)를 늘리는 일종의 할부제도 내지 리스제도는?","c":["나용선계약","항해용선계약","정기용선계약","선복용선계약"],"a":0},{"id":678,"t":[[1,"279"]],"q":"다음에서 발틱국제해사위원회에 대한 설명으로 적절한 것은?","c":["1905년 발틱해와 백해지역의 교역에 주로 참여하던 선주들의 공동이익을 위하여 코펜하겐에서 창설된 순수 민간기구이다.","국적을 불문하고 선박을 검사하고 선급을 정하여 100톤 이상의 모든 항해선의 등급과 내용이 기록된 Lloyd's Register Book을 통하여 정보를 제공함에 있다.","국가별 대리점협회와 개별 대리점으로 구성된 기구로서 1926년 비엔나에서 국제적인 대리업의 확장에 따른 제반 문제점을 다루기 위해 설립되었다.","선원문제에 관한 선주의 권익보호와 자문을 위해 1909년 창설된 민간기구로 런던에 본부를 두고 있다."],"a":0},{"id":679,"t":[[1,"280"]],"q":"다음에서 운송인(carrier)인 선박회사가 다수의 송화인의 개개의 화물을 운송하는 것을 인수하는 계약은?","c":["나용선계약","개품용선계약","정기용선계약","선복용선계약"],"a":1},{"id":680,"t":[[1,"281"],[4,""]],"q":"다음은 개품운송계약의 설명으로 올바르지 않은 것은?","c":["개품운송계약에서 운송계약은 불요식 계약이므로 별도의 계약서 작성은 필요 없다.","무역계약상의 가격조건에 따라 선복을 확보하여야 할 책임이 수출업자에 있는지 또는 수입업자에 있는지가 결정된다.","개품운송계약은 송화인 또는 그 대리인인 운송인이 선박회사, 대리점, freight forwarder 등이 발행하는 배선표를 잘 검토하여 적당한 선박을 선정한 다음 운송을 신청하여 운송인이 이를 승낙함으로써 운송계약이 체결된다.","타인소유의 선박을 일정한 조건을 정하여 차용할 때의 계약을 말한다."],"a":3},{"id":681,"t":[[1,"282"]],"q":"다음에서 선주는 일체의 선박부속용구를 갖추고 선원을 승선시키는 등 선박의 운항상태를 갖추어 선박을 소정의 항구에서 용선자에게 인도하여야 하는 의무의 계약은?","c":["나용선계약","기간용선계약","정기용선계약","선복용선계약"],"a":1},{"id":682,"t":[[1,"283"]],"q":"다음에서 서로다른 운송수단이 2개이상 결합되어 있지만 운송구간에 대한 단일 책임을 지는 운송수단은?","c":["해상운송","항공운송","철도운송","복합운송"],"a":3},{"id":683,"t":[[1,"284"]],"q":"본선이 입항하면 CY 운영자는 집화된 컨테이너를 갠드리크레인을 사용하고 선적하고, 송화인에게 무엇을 발급해 주는가?","c":["환어음","지급위탁증권","약속어음","선하증권"],"a":3},{"id":684,"t":[[1,"285"]],"q":"다음에서 운송수단을 직접 보유하지 않고 선박회사, 항공회사, 철도회사 등의 실제운송인을 하청운송인으로 사용하여 운송사업을 하는 자는?","c":["철도운송인","해상운송인","항공운송인","복합운송인"],"a":3},{"id":685,"t":[[1,"286"]],"q":"다음의 국가들 중 Hague Rules에 가입을 하지 않은 나라는?","c":["Canada","France","Australia","Japan"],"a":1},{"id":686,"t":[[1,"287"],[4,""]],"q":"다음에서 선하증권의 이전(transfer)에 대한 설명으로 적절하지 않은 것은?","c":["선하증권 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 이전(transfer)이라 한다.","지시식 선하증권, 배서금지문언이 없는 기명식 선하증권, 무기명식 선하증권 및 선택무기명식 선하증권의 이전은 양도라고 한다.","양도배서금지문언이 있는 기명식 선하증권의 이전은 지명채권양도라고 한다.","선하증권에서 양도는 기명식 선하증권에 대하여 사용된다."],"a":3},{"id":687,"t":[[1,"288"],[4,""]],"q":"다음에서 기명식 선하증권과 이전(transfer)에 대한 설명으로 올바르지 않는 것은?","c":["기명식 선하증권은 양도는 가능하다.","기명식 선하증권의 양수인은 양도된 취지를 운송인에게 합법적으로 통지하여야 된다.","기명식 선하증권의 양도된 사실을 통지 하기 전에 이미 양도인에게 물건이 인도된 경우에 양도는 무효가 된다.","선하증권에서 양도는 기명식 선하증권에 대하여 사용된다."],"a":2},{"id":688,"t":[[1,"289"],[4,""]],"q":"다음에서 해상화물 운송장의 법적 특징으로 관계가 먼 것은?","c":["물품을 수취 또는 선적을 증명하는 서류라는 점에서는 B/L의 성격과 일치한다.","물품을 인수하기 위하여 수화인의 운송인에게 제시하여야 하는 B/L과는 달리 제시할 필요가 없다.","해상화물운송장은 물품을 대표하는 유가증권적 성격이 강하다.","해상화물운송장은 기명식으로된 유통불능성의 성격을 지니고 있다."],"a":2},{"id":689,"t":[[1,"290"],[4,""]],"q":"다음 중 선하증권의 이전과 관련된 용어의 부적절한 설명은?","c":["이전은 유통증권 또는 권리증권의 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 말한다.","유통은 양도의 개념으로 증권상의 권리를 유통이라는 방법으로 양수받은 자는 증권상의 정당한 권리자이지만, 정당한 소지인이 아니다.","배서는 유통증권의 소지인이 가지고 있는 증권상의 권리를 타인에게 이전하는 목적으로 통상 그 증권의 배면에 서명하고 피이전자에게 이것을 교부하는 것을 말한다.","양도는 화물의 양도와는 달르기 때문에 배서의 형식과 그 방법은 중요치 않다."],"a":3},{"id":690,"t":[[1,"291"],[4,""]],"q":"다음에서 Hague Rules에 대한 설명으로 적합하지 않은 것은?","c":["Hague Rules는 선하증권에 대한 약간의 통일에 관한 국제조약이다.","Hague Rules는 각국의 해상물건운송법에 대한 특별법의 지위만을 가지고 있을 뿐이다.","Hague Rules의 적용을 받는 해상물건운송계약은 선하증권 또는 이와 유사한 권리증권에 의해 증명된 운송계약에 한한다.","Hague Rules는 단순히 선하증권만을 규정하는 통일법으로 그 지위를 갖는다."],"a":3},{"id":691,"t":[[1,"292"],[4,""]],"q":"다음에서 유통불능선하증권(Non-negotiable B/L)에 대한 설명으로 올바르지 않는 것은?","c":["유통불능선하증권(Non-negotiable B/L)은 권리증권이라고 볼 수 없다.","유통불능선하증권은 물건을 수령해야 할 사람이 특정인으로 되어 있는 기명식 선하증권(Straight B/L)을 말한다.","유통불능선하증권은 물건의 인도청구권을 표창하고 물건을 상징하고 있기 때문에 권리증권이라고 할 수 있다.","유통불능선하증권의 경우, 선박회사는 물건을 목적지에서 수화인 난에 기재된 특정인에 인도하는 의무를 부담하고 있으므로 선하증권의 제시와는 관계가 없다."],"a":2},{"id":692,"t":[[1,"293"],[4,""]],"q":"다음에서 유통가능선하증권(Negotiable B/L)에 대한 설명으로 부적합한 것은?","c":["유통가능선하증권(Negotiable B/L)은 선하증권의 수화인 난에 To order of Mr. A, To bearer라고 기재되어 있는 경우이다.","유통가능선하증권은 배서 또는 인도에 의하여 유통되므로 운송인은 증권의 제시없이도 인도할 수 있다.","유통가능선하증권의 경우 운송인은 증권의 회수가 없으면 물건을 인도할 수 없으므로 증권의 소지인은 물건들을 완전하게 점유할 수 있다.","유통가능선하증권은 물건의 상징이고 완전한 권리증권이다."],"a":1},{"id":693,"t":[[1,"294"],[4,""]],"q":"다음 중 만약 본선이 도착하였음에도 불구하고 선하증권이 도착하지 아니한 경우의 해결책으로 가장 좋은 방법은?","c":["우선, 본선이 그 항에서 서류가 도착하는 것을 기다리는 방법이 있을 수 있다.","선박회사가 선박의 체선을 피하기 위하여 화물을 하역 또는 양륙하여 창고에 보관하는 방법이 있을 수 있다.","현재 실무적으로 광범위하게 사용되고 있는 것이 화물의 L/G(Letter of Guarantee; 수입화물선취보증서) 인도를 통해 문제를 해결 할 수 있다.","물품의 인도를 신속히 하고 서류의 분실에 따른 제반위험을 회피하고자 하는 목적으로 비유통성 해상화물운송장(Non-Negotiable Sea Waybill)을 사용할 수 있다."],"a":3},{"id":694,"t":[[1,"295"],[4,""]],"q":"다음 중 선하증권이 인도에 의해 유통되는 경우에 관한 설멍으로 바람직하지 않은 것은?","c":["선하증권은 지참인식으로 발행되어 지참인식의 배서를 한경우에는 인도만으로 유통한다.","선하증권이 특정인의 지시식으로 발행되어 그 자가 백지백서애 배서한 경우에는 인도만으로 유통한다.","선하증권은 지참인식으로 발행되기 때문에 언제든지 인도만으로 유통할 수 있다.","선하증권은 분실할 경우 위험이 있기 때문에 실제로 지참인식으로 발행되는 경우는 거의 없으므로 배서를 해야만 인도 유통이 가능하다."],"a":2},{"id":695,"t":[[1,"296"],[4,""]],"q":"다음에서 배서에 대한 설명으로 부적당한 것은?","c":["지시식의 어음, 수표 또는 지시금지가 없는 기명식의 어음, 수표 등 유가증권을 제3자에게 양도하는 방법을 말한다.","소지인식은 피배서인을 지정하지 아니하고 단순히 소지인에게 인도하라는 취지의 인도문언과 함께 배서인이 서명하는 방법이다.","양도방법이 배서에 의하도록 결정되어 있는 경우 배서 이외의 방법으로 양도할 수 있다.","신용장에서 요구되고 있는 환어음, 운송증권 등은 전형적인 증권적 채권이므로 배서에 의하여 제3자에게 자유로이 양도될 수 있다."],"a":2},{"id":696,"t":[[1,"297"],[4,""]],"q":"다음에서 연지급신용장과 같은 효과를 지닌 신용장은?","c":["매입신용장(negotiation credit)","인수신용장(acceptance credit)","지급신용장(payment credit)","확인신용장(confirmed credit)"],"a":1},{"id":697,"t":[[1,"298"],[4,""]],"q":"다음에서 Siberian Land Bridge(SLB)에 의한 국제복합운송경로의 운송구가별 적용법규가 알맞게 연결된 것은?","c":["해상운송기간: 사회주의 연락운수 규칙","소련 국경에서 유럽국경까지의 철도운송구간: 도로에 의한 국제물품운송에 관한 국제조약","유럽 및 소련 내륙 도로운송구간: 도로에 의한 물품 운송에 관한 국제조약","Vostochny에서 소련 국경까지의 철도운송구간: Hague Rules"],"a":2},{"id":698,"t":[[1,"299"],[4,""]],"q":"다음은 해상화물운송장의 단점을 설명한 것으로 적당하지 않은 것은?","c":["자유로이 수화인을 변결할 수 있으므로 화환어음을 매도하기 위해서는 은행을 수화인으로 해야 한다.","해상화물운송장의 제출 없이도 물품을 인도 받을 수 있기 때문에 L/G인도에 따른 문제로 화물인도를 신속히 할 수 있다.","해상화물운송장은 권리증권이 아니기 때문에 항해 중에 증권을 이전함으로써 물품을 전매하는 것이 불가능하다.","해상화물운송장은 담보력이 없다."],"a":1},{"id":699,"t":[[1,"300"],[4,""]],"q":"다음에서 선하증권에서 운송물의 동일성을 표시하는 사항을 기입할 필요에 대한 설명으로 적당한 것은?","c":["해상화물 운송에 있어서 화물의 적재를 손쉽게 할 수 있기위해서 이다.","선하증권은 원래 본선의 선장이 발행하는 해상운송물의 수취증과 같은 역할을 하기 때문이다.","화물의 대금을 정확하게 지불 받기위해서이다.","화물의 최종 목적지에서 확인은행의 대리인에게 대금의 지불수단으로 사용하기 위해서이다."],"a":1},{"id":700,"t":[[1,"301"],[4,""]],"q":"다음 선하증권의 송화인에 대한 설명으로 올바르지 않은 것은?","c":["선하증권에 기재될 모든 사항을 정확하게 운송인에게 신고하여야 하고 부정확한 사항으로 인한 손실 및 비용에 대하여 책임을 져야 한다.","운송인이 서명한 선하증권(bill of lading)을 취득할 권리를 가진 자이다.","선하증권 발행자인 운송인은 권리 양도증서가 없어도 선하증권상에 기재된 송화인이 아닌 자에게 선하증권을 교부할 수 있다.","위험물의 등급에 적합한 용기에 포장하고 위험물임을 표시하는 mark 및 label을 부착할 의무가 있다"],"a":2},{"id":701,"t":[[1,"302"],[4,""]],"q":"다음에서 복합운송증권에 대한 개념을 잘못 설명하고 있는 것은?","c":["복합운송에 대해 복합운송인이 발행한는 증권이다.","발행자인 운송인이 운송품의 수령을 증명하고, 운송계약의 증거가 되는 권리증권의 성격이다.","복합운송증권은 선하증궘과 똑같이 유통증권으로서의 기능을 갖고 있다.","복합운송증권은 선하증권과 달리 유가증권의 성격을 갖고 있지 않다."],"a":3},{"id":702,"t":[[1,"303"]],"q":"다음 중 매입신용장에서 추심은행의 역할은?","c":["매수인의 대리인","매도인(어음의 발행인)의 대리인","지급은행의 대리인","확인은행의 대리인"],"a":1},{"id":703,"t":[[1,"304"]],"q":"다음은 OCP(Overland Common Point)에 대한 설명으로 부적절한 것은?","c":["미국대륙에서 공동운임을 과징하는 지역을 말한다.","우리 나라 수출업자들이 OCP지역에 대하여 관심을 갖고 있는 것은 이 지역으로 가는 OCP화물이 OCP Rate라는 할인운임의 혜택을 받고 있기 때문이다","최근에는 선사들에 의한 MLB 및 IPI 일반수송이 발달함에 따라 OCP Service는 증가하고 있다.","OCP서비스를 이용하려는 경우 선하증권이면에 OCP목적지, 운송수단(철도, 트럭, 항공), OCP운송인을 명시하여야 한다"],"a":2},{"id":704,"t":[[1,"305"]],"q":"다음 중 복합운송서류가 자동수리 되기 위해서 갖추어야 할 요건과 관계가 없는 것은?","c":["상품의 발송, 수탁 또는 본선적재 내용을 명기하여야 한다.","용선계약 또는 범선에 선적하였다는 표시가 있어야 한다.","약식운송서류도 수리할 수 있다.","발급된 원본 모두가 제시되어야 한다."],"a":1},{"id":705,"t":[[1,"306"]],"q":"다음 한국, 대만, 홍콩, 호주지역은 NVOCC의 어느 국가가 총대리점으로 TRS 서비스를 맡고 있는가?","c":["러시아","영국","프랑스","독일"],"a":3},{"id":706,"t":[[1,"307"]],"q":"다음은 중국대륙의 국제복합운송경로에 대한 설명으로 적합하지 않은 것은?","c":["중국대륙을 횡단하여 유럽까지 화물을 운송할 수 있는 중국횡단철도(Trans Chinese Rail :TCR)가 1992년 12월 1일부터 개통되었다","TCR은 러시아의 Vostochny를 통하여 북유럽으로 가는 시베리아횡단 철도(TSR)보다 2,000㎞ 가량 거리가 짧아 졌다.","부산에서 로테르담까지 해상운송하는 거리가 10,370㎞인데 이 TCR을 이용하면 해상운송거리보다 9,420㎞정도로 짧아지고 운송기간도 1주일 정도 줄일 수 있다.","TCR을 이용하여 유럽행 화물을 운송하는 경우 운송비를 15∼20% 정도 절감시킬 수 있다."],"a":2},{"id":707,"t":[[1,"308"]],"q":"다음 중 신용장의 이용을 규율하고 있는 규칙으로 신용장통일규칙은 언제 탄생되었는가?","c":["1933년","1983년","1905년","1972년"],"a":0},{"id":708,"t":[[1,"309"]],"q":"다음 중 MLB의 운송경로에 대해 알맞게 설명한 것은?","c":["미국대륙이 극동과 유럽을 이어주는 운송시스템에서 다리역할을 한다는 개념에서 Mini Land Bridge라고 부른다.","LA-NY간의 북미 내륙운송비가 비싸기 때문에 SLB보다 경쟁력이 약하다.","MLB서비스선박회사 중에는 국내선사로서 한진해운, 현대해운 등이 있고, 외국선사는 APL, Sea-Land, BBS, Evergreen Line, Maersk 등이 있다.","한국에서 북미의 서해안항까지 해상운송되고 그 항구에서 철도에 환적된 다음 미국의 주요도시까지 철도운송된다."],"a":2},{"id":709,"t":[[1,"310"]],"q":"다음에서 Sea&Air 복합운송의 유용성에 대한 특성으로 알맞지 않은 것은?","c":["적정재고의 조절","적기선적의 운송수단","운송기회 및 시설부족지역의 운송수단","도난의 위험성이 많은 유럽 및 동남아시아지역으로의 해상운송의 대체운송수단"],"a":3},{"id":710,"t":[[1,"311"]],"q":"다음 중 해상운송을 통하여 화물을 보내는 것이 불안한 지역 또는 국가로 해당되지 않는 곳은?","c":["West Indies","Africa","North America","Latin America"],"a":2},{"id":711,"t":[[1,"312"]],"q":"다음에서 매입신용장의 지급인이 아닌 것은?","c":["신용장 발행 은행","신용장발행은행의 본 지점","환거래은행","수출지의 은행"],"a":3},{"id":712,"t":[[1,"313"]],"q":"다음 중 항만시설이 빈약하거나 Port Congestion이 심한 지역이 아닌 곳은?","c":["Venezuela","Iceland","Incheon","African Ports"],"a":2},{"id":713,"t":[[1,"314"]],"q":"다음에서 4면이 육지로 둘러 쌓여 있는 내륙국가로서 이웃나라의 항구를 이용하여 화물을 수입하는 국가가 아닌 국가는?","c":["Zambia","Iraq","Nigeria","Austria"],"a":1},{"id":714,"t":[[1,"315"]],"q":"물건의 국제운송은 2개의 체약국간에 이루어지는 것을 필요하지 않는데 다음의 해상운송에 적용되지 않는 경우는?","c":["해상운송계약 중에 정해진 선적항이 체약국에 있을 때","선하증권 또는 해상운송계약을 증명하는 기타의 증권이 체약국에서 발행될 때","해상운송계약 중에 정해진 양하항이 체약국에 있을 때","해상운송계약 중에 정해진 선택양하항이 가상의 양하항이고 또 체약국에 없을 때"],"a":3},{"id":715,"t":[[1,"316"]],"q":"Sea & Air 복합운송서비스에서 Carrier형에 대한 설명으로 알맞은 것은?","c":["확실한 화물의 취급, 정확한 운송소요일수, 운송정보 등을 화주에게 제공하고 있다.","선사와 항공사의 일정한 스페이스를 연간계약으로 확보하고 양쪽의 운임에 자기의 서비스비용을 가산하여 통운임을 정한다.","중계지점으로부터 최종목적지까지를 자기회사소속 항공기만 이용하는 서비스 형태이다.","직접 화주에 판매하지 않고 주로 포워더에게 도매를 하는 점이 특징이다,"],"a":2},{"id":716,"t":[[1,"317"],[4,""]],"q":"FIATA(International Federation of Freight Forwarder Association) 복합운송증권에 관한 설명으로 옳지 않은 것은?","c":["프레이트 포워더(Freight Forwarder)는 화주의 단독위험으로 화물을 보관할 수 있다.","FBL에 따르면, 화물의 손상, 멸실 등의 경우, 프레이트 포워더는 무과실을 입증하지 못하는 한 배상책임을 면할 수 없다.","해상운송이나 내수로운송이 포함되지 않은 국제복합운송의 경우, 프레이트 포워더의 책임은 멸실 또는 손상된 화물의 총중량 1kg당 8.33SDR(Special Drawing Rights)을 초과하지 않는 금액으로 제한된다.","프레이트 포워더의 총책임은 화물의 전손에 대한 책임한도를 초과한다."],"a":3},{"id":717,"t":[[1,"318"]],"q":"합화물터미널사업의 등록을 한 자가 그 등록한 사항을 변경하고자 하는 경우에는 변경등록을 하여야 한다. 다음 중 복합화물터미널사업의 변경등록을 하지 않아도 되는 경미한 사항만으로 올바르게 묶인 것은 무엇인가?","c":["화물터미널의 부지면적을 10% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것, 공사기간을 변경하는 것","화물터미널의 부지면적을 10% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것","화물터미널의 부지면적을 20% 범위 내에서 감소시키는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것, 공사기간을 변경하는 것","화물터미널의 부지면적을 5% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것"],"a":1},{"id":718,"t":[[1,"319"]],"q":"다음에서 선하증권의 전자화와 관련한 설명으로 거리가 먼 것은?","c":["전자선하증권은 전자네고 구현을 위한 핵심기반이다.","1990년 전자선하증권에 관한 CMI 통일규칙이 제정되었다.","Bolero는 전자선하증권의 유통을 위해 Rule Book을 활용한다.","TradeCard는 전자선하증권 서비스를 세계 최초로 제공하였다."],"a":3},{"id":719,"t":[[1,"320"]],"q":"다음 중 복합운송의 특징에 속하지 않는 것은?","c":["두가지 이상의 서로 다른 운송수단에 의해 물품이 운송되어야 한다.","복합운송인이 전 구간 운송에 대해 주체로서 책임을 진다.","선박, 선적항 또는 양륙항과 관련하여 \"예정된\" 이라는 표시가 있는 복합운송서류는 수리할 수 있다.","복합운송서류는 반드시 물품이 본선에 적재된 후에 발급된다."],"a":3},{"id":720,"t":[[1,"321"]],"q":"신용장에서 요구하는 B/L의 조건이 다음과 같을 경우 B/L의 Consignee란에 표시되는 내용 중 가장 정확한 것은?\n\"Full Set of Clean on Board Bills of Landing Made Out to Order of Korea XX Bank, Notify Applicant\"","c":["TO ORDER","APPLICANT","TO ORDER OF KOREA XX BANK","KOREA XX BANK"],"a":2},{"id":721,"t":[[1,"322"]],"q":"다음에서 Hague Rules에 관한 설명으로 옳지 않은 것은?","c":["운송인은 본선 선적개시 시부터 출항 시까지 선박의 내항성(Seaworthiness)에 대한 주의를 게을리 하지 말아야할 의무가 있다.","항해 또는 선박 자체의 취급에 대하여 선장이나 선원의 과실인 항해과실에 대하여는 운송인이 책임진다.","선박의 항해에 필요한 승조원을 배치하고 선박의 의장 및 필수품을 보급할 의무가 운송인에게 있다.","운송인은 물품의 선적, 적부, 운송, 보관 또는 양하가 적절하고 신중하게 행하여 지지 않아서 발생한 물품의 손해에 대하여 책임을 면할 수 없다."],"a":1},{"id":722,"t":[[1,"323"],[4,""]],"q":"이종책임체계(Network Liability System)는 화주에 대하여 복합운송인이 전 운송구간에 걸쳐 책임을 부담하지만 손해발생 구간이 확인 된 경우 해상운송구간에서는 무엇에 의해 책임체계가 결정되는가?","c":["Warsaw Convention","CIM 조약","CMR 조약","Hague Rules"],"a":3},{"id":723,"t":[[1,"324"]],"q":"다음에서 Hague Rule의 적용범위를 규정하고 있는 측면으로 해당되지 않는 것은?","c":["지리적 측면","인적 측면","내용적 측면","경제적 측면"],"a":3},{"id":724,"t":[[1,"325"]],"q":"1980년 UN 국제복합운송조약에서 채택하고 있는 복합운송인의 책임제도는?","c":["Unifor Liability System","Modified Uniform Liability System","Tie-up System","Flexible Liability System"],"a":1},{"id":725,"t":[[1,"326"]],"q":"다음 해상운송인의 책임을 규정한 선화증권에 대한 국제조약과 관련이 없는 것은?","c":["Hague Visby Rules","Harter Acts","Hamburg Rules","York Antwerp Reules"],"a":3},{"id":726,"t":[[1,"327"]],"q":"다음의 선하증권의 법정기재사항 중 중량 및 용적에 (weight or Measurement)에 관련된 내용과 관계가 적은 것은?","c":["개품운송계약의 운임산정기준은 중량톤 또는 용적톤 중 큰 쪽을 선택하도록 되어 있기 때문에 선하증권에 중량과 용적을 함께 기재하고 있다.","운송물의 중량과 용적은 포장물을 포함한 총중량과 총용적을 기재한다","선하증권에 기재된 중량은 수출입 실적의 기준이 된다","선하증권상의 중량은 송화인의 손해배상 책임의 기준이 된다."],"a":3},{"id":727,"t":[[1,"328"]],"q":"복합운송은 서로 다른 운송수단을 결합하여 운송하는 형태를 말하는데 다음 중 복합운송시스템으로 볼 수 없는 것은?","c":["피기백(Piggy-back)시스템","시앤에어(Sea-and-Air)운송시스템","랜드브리지(Land bridge)시스템","허브앤스포크(Hub-and-Spoke)운송시스템"],"a":3},{"id":728,"t":[[1,"329"]],"q":"다음에서 선하증권의 유통의 효과를 설명한 것으로 관계가 먼 것은?","c":["물건의 인도 청구권의 이전","물건의 소유권의 이전","물건의 담보권의 이전","물건의 이익의 이전"],"a":3},{"id":729,"t":[[1,"330"]],"q":"합운송주선업의 등록을 하고자 하는 자는 1억원 이상의 보증보험에 가입하여야 한다. 다음 중 보증보험 가입의 의무가 면제되는 경우로 가장 올바르게 묶인 것은?","c":["자본금이나 자산평가액이 10억원 이상인 경우, 금융기관에서 2억원 이상의 지급 보증을 받은 경우","자본금이나 자산평가액이 20억원 이상인 경우, 금융기관에서 1억원 이상의 지급 보증을 받은 경우","금융기관에서 15억원 이상의 지급 보증을 받은 경우, 3억원 이상의 화물배상책임보험에 가입한 경우","금융기관에서 1억원 이상의 지급 보증을 받은 경우, 자본금이나 자산평가액이 10억원 이상인 경우, 1억원 이상의 화물배상책임보험에 가입한 경우, 컨테이너 장치장을 소유하고 있는 경우"],"a":3},{"id":730,"t":[[1,"331"],[4,""]],"q":"다음 중 복합운송(Multimodal Transport)방식에 적합한 정형무역 거래조건(Trade Terms)만으로 나열된 것은?","c":["CIP, DAF, FAS","CFR, CIP, FOB","CPT, FCA, CIP","FCA, CIF, CIP"],"a":2},{"id":731,"t":[[1,"332"]],"q":"다음 중 Hague Rules의 선하증권의 기재사항으로 관계가 없는 것은?","c":["주요한 화인(leading mark)","수화인의 신용정도","화물의 외관상 상태","각 경우에 따라 송화인이 서면으로 제출한 포장화물의 개수, 수량 또는 중량"],"a":1},{"id":732,"t":[[1,"333"]],"q":"다음 중 해상운송에서 선주가 선박의 편의치적(Flag ofConvenience)을 선호하는이유와 관계가 없는 것은?","c":["금융기관이 선박에 대한 권리행사가 용이하기 때문에 국제금융시장에서 자금조달이 용이하다.","선박의 운항 및 안전기준 등의 이행회피에 따르는 비용절감이 가능하다.","편의치적선으로 등록된 선박은 세계 각국의 항만에서의 입출항이 용이하다.","선박운항에 따른 재무상태, 거래내역을 정부에 보고하지 않는 등 선박운항에 따른 정부의 지도 감독회피가 가능하다."],"a":2},{"id":733,"t":[[1,"334"]],"q":"신용장결제방식에 의한 국제화물운송의 경우에, 환적(Transhipment)에 대한 설명으로 옳지 않은 것은?","c":["환적은 화물의 훼손 및 멸실의 가능성이 있으므로 매수인의 경우 환적을 허용하기를 꺼 리게 된다.","복합운송이나 컨테이너 화물인 경우 환적에 대한 언급이 없는 경우 환적이 허용되는 것 으로 본다.","환적은 일반적으로 선적항에서 목적항까지의 운송과정에서 본선으로부터 양하 및 타선으 로의 재적재의 이적(移積)과정을 거치는 것을 말한다.","환적 금지조항이 있으면 해상운송 뿐만 아니라 복합운송 및 항공운송의 경우에도 환적은 당연히 금지된다."],"a":3},{"id":734,"t":[[1,"335"]],"q":"다음 포워딩(Forwarding) 업무 중 LCL화물을 집화하여 FCL화물로 만드는 업무는?","c":["Projection","Combination","Consolidation","Packaging"],"a":2},{"id":735,"t":[[1,"336"]],"q":"다음 중 Hague Rules의 지리적 범위에 대한 설명으로 올바르지 않은 것은?","c":["제10조에 의거하면 Hague Rules는 체약국 내에서 발행되는 모든 선하증권에 적용된다.","비체약국간의 3국간 항로에도 선하증권이 발행되는 경우에는 Hague Rules가 적용된다.","Hague Rules는 입하 및 출하의 양쪽 적하품에만 적용된다.","선하증권은 통상의 경우 출발항에서 발생되므로 현실로는 체약국에서 떠나는 적하품 전부에 대하여 Hague Rules가 적용된다."],"a":2},{"id":736,"t":[[1,"337"]],"q":"다음 중 Freight Forwarder의 주요 업무에 해당하지 않는 것은?","c":["통관대행","운송관련 서류의 작성","운송의 수배","선박의 운항스케줄에 따른 배선"],"a":3},{"id":737,"t":[[1,"338"]],"q":"다음 중 선하증권의 배서와 환어음의 배서의 차이점을 설명한 것으로 거리가 먼 것은?","c":["환어음은 일단 정당한 소지인에게 양도되면 권리나 양도인에 대한 개인적 항변에 침해받지 않기 때문에 피배서인의 권리가 배서인의 권리보다는 크다.","선하증권을 훔친 자나 정당한 권리를 갖지 못한 자로부터 양도받은 선의의 양수인이라 하더라도, 그 화물의 진정한 소유자에게 대항할 수 없기 때문에 피배서인이 배서인보다 더 큰 권리를 가질 수 없다.","선하증권은 정당한 권리자에 의해 양도되어야 한다.","환어음의 이면(裏面)이나 보전(補箋)에 기재하지 아니해도 효격이 있을 수 있다."],"a":3},{"id":738,"t":[[1,"339"]],"q":"극동아시아를 출항하여 파나마 운하를 경유해서 미국 동안(東岸) 또는 걸프만 지역의 항까지 해상운송한 후 그 곳에서 미국의 내륙지역(중계지 경유 포함)까지 철도나 트럭으로 복합운송하는 방식은?","c":["MLB(Mini-Land Bridge)","RIPI(Reversed Interior Point Intermodal)","MBS(Micro Bridge Service)","ALB(American Land Bridge)"],"a":1},{"id":739,"t":[[1,"340"]],"q":"다음에서 TSCS(Trans Suberian Container Service)에 대한 설명으로 부적절한 것은?","c":["NVOCC가 소련구간에 대한 전소화물통과공단(SOTRA)과 TSCS 운송계약을 체결한다.","NVOCC는 각 운송구간별 운송주체자와 계약을 체결한 SOTRA와 총대리점계약을 체결하여 TSR서비스를 제공하고 있다","TSCS서비스는 철도대신 항공기로 Siberia를 횡단하는 Sea & Air 복합운송방식만을 채택하고 있다.","TRS의 운임체계는 독일의 PCT가 품목별무차별운임제도를 도입함으로써 단순화되었다"],"a":2},{"id":740,"t":[[1,"341"]],"q":"다음에서 컨테이너 안의 화물 수량이 선하증권 상에 기재 된 내용과 달라 클레임이 제기될 경우를 대비하여 운송인이 이와 관련한 면책을 주장하기 위해 선하증권 상에 기재하는 문구는?","c":["Importer's Load & Count","Shipper's Load & Count","Consignee's Load & Count","Error and Omissions Excepted"],"a":1},{"id":741,"t":[[1,"342"]],"q":"다음 중 수입상이 대금을 지급하기 전에 운송서류를 인도받으면서 그 운송서류를 제공한 은행에게 약정된 기일에 수입화물에 관한 대금결제를 서약한 보증서 성격의 서류는?","c":["Bill of Exchange","Letter of Indemnity","Commercial Invoice","Trust Receipt"],"a":3},{"id":742,"t":[[1,"343"]],"q":"다음에서 선하증권에서 물건의 담보권 이전에 대한 설명으로 바람직한 것은?","c":["선하증권의 유통에 의하여 물건의 점유가 상징적으로 양수인에게 이전되고 물건이 인도되는 것을 말한다.","권리증권이 채권을 담보하려는 의사로서 채권자에게 배서, 인도된 경우에는 물건에 대한 담보권이 이전한다.","당사자의 의사에 따라 이전하는 것이므로 물건의 인도나 대금지급과 소유권의 이전과는 일단 관계가 없다","물건에 대한 이전의 의사를 어떻게 표시하느냐, 즉 권리증권의 배서, 인도행위 그 자체가 상관습상 소유권의 이전의사를 표시하는 것을 말한다."],"a":1},{"id":743,"t":[[1,"344"]],"q":"다음 중 복합운송주선업협회에 관한 설명으로 옳지 않은 것은?","c":["복합운송주선업자ㆍ화물터미널사업자는 사업자협회를 전국 또는 특별시ㆍ광역시ㆍ도 단위로 설립할 수 있다.","복합운송주선업협회에 관하여 이 법에 규정한 것 외에는 민법 중 사단법인에 관한 규정을 준용한다.","협회를 설립하고자 하는 경우에는 당해 협회의 회원이 될 자격이 있는 자 5분의 1이상의 발기인이 정관을 작성하여 당해 협회의 회원이 될 자격이 있는 자의 과반수가 출석한 창립총회의 의결을 거쳐야 한다.","창립총회의 의결을 거친 후 건설교통부장관의 설립인가를 받아야 한다."],"a":2},{"id":744,"t":[[1,"345"]],"q":"다음에서 Sea & Air 복합운송 중 Carrier형의 단점으로 알맞게 설명한 것은?","c":["Carrier형 서비스를 제공하는 항공회사는 자기회사의 항공운임에 해상운임을 가산한 전구간 일관운송운임을 정한다.","Carrier형 항공회사는 항공운송구간만을 커버하는 항공화물운송장을 발행한다.","복합운송서비스지역이 자기회사노선이 있는 지역으로 한정된다.","해상운송에 대해서는 Air Waybill면에 \"Conjunction Clause\"을 삽입함으로서 해상운송과 항공운송을 일관하여 인수하였음을 증명하고 계약한다,"],"a":2},{"id":745,"t":[[1,"346"]],"q":"다음에서 선적서류에 대한 설명 중 옳지 않은 것은?","c":["포장명세서에는 물품 명세, 단위별 중량, 화인, 일련번호 등이 기재된다.","항공화물운송장은 유가증권이다","상업송장은 대금청구서의 역할을 하고 있다.","적하목록은 선사(대리점)가 작성하는 적재화물의 명세표이다."],"a":1},{"id":746,"t":[[1,"347"]],"q":"다음 중 선하증권을 다른사람에게 양도하기 위해 배서할 때 피배서인의 표시방법으로 해당되지 않는 것은?","c":["기명식","지시식","백지식","무기명식"],"a":3},{"id":747,"t":[[1,"348"]],"q":"다음에서 극동아시아에서 유럽까지 시베리아 횡단 철도를 이용하는 복합운송 경로는?","c":["SLB","ALB","CLB","MLB"],"a":0},{"id":748,"t":[[1,"349"]],"q":"다음에서 선화증권 상 수화인에 대한 설명으로 올바르지 않는 것은?","c":["수화인에게는 운임 및 기타 요금의 지급의무 등이 있다.","목적지에서 선하증권을 제시하고 운송인에게 증권상에 기재된 화물의 인도를 청구할 수 있는 채권자이다.","수화인은 선하증권을 취득함으로써 증권상의 운송급부와 청구권을 취득한다","우리 나라 상법 및 Hamburg Rules도 선하증권의 임의 기재사항으로 규정하고 있다."],"a":3},{"id":749,"t":[[1,"350"]],"q":"다음 중 복합운송주선업에 대한 설명으로 적당하지 않은 것은?","c":["복합운송주선업은 2가지 이상의 운송수단을 이용하여 화물의 운송을 주선하는 사업이다.","복합운송주선업은 타인 소유의 자동차나 선박을 이용하여 화물을 운송하는 사업이다.","복합운송주선업은 자기의 명의와 타인의 계산으로 화물의 운송을 주선하는 사업이다.","복합운송주선업은 타인의 수요에 응하여 화물의 운송을 주선하는 사업이다."],"a":2},{"id":750,"t":[[1,"351"]],"q":"다음 중 선하증권에 대한 설명으로 맞지 않은 것은?","c":["증권에 명시된 화물수취증이다.","운송의 법적 계약서이다.","운암계산서이다.","화물에 대한 권리를 입증한다."],"a":2},{"id":751,"t":[[1,"352"]],"q":"Hague Rules의 인적적용범위에 대한 설명으로 적합하지 않은 것은?","c":["Hague Rules는 한편에 있어서 해상물건운송계약에 의거하여 운송채무를 부담하는 선박소유인 또는 용선자에 대하여 적용된다.","Hague Rule는 송화인 및 선하증권 또는 이와 유사한 증권의 소지인에 대해서도 적용된다.","Hague Rules에서 운송인은 운송계약에 있어서 송화인의 상대방이 되는 선박소유자 및 용선자이다.","Hague Rules에서 운송인과 같은 이해관계인의 국적은 특정국가에만 적용된다."],"a":3},{"id":752,"t":[[1,"353"]],"q":"다음에서 Freight Forwarder의 기능 및 업무에 관한 설명으로 옳지 않은 것은?","c":["자체 운송 수단을 보유하지 않지만 집화, 분배, 혼재 등의 업무를 수행하는 운송의 주체 자로서의 기능을 수행한다","화주의 대리인으로서 적절한 운송수단을 선택하여 운송에 따르는 제반 업무를 처리해 주는 전통적인 운송주선 기능을 담당한다.","화주를 대신하여 적하보험 수배와 관련된 업무를 수행할 수 없다.","프레이트 포워더는 운송과 관련된 법적 책임 주체이다."],"a":2},{"id":753,"t":[[1,"354"]],"q":"극동의 주요 항만에서 북미 서안의 주요 항만까지 해상운송하며, 북미 서안에서 철도를 이용하여 미 대륙을 횡단하고, 북미 동부 또는 남부항에서 다시 대서양을 해상 운송으로 횡단하여 유럽지역 항만 또는 유럽 내륙까지 일관수송하는 복합운송경로는?","c":["MLB(Mini-Land Bridge)","RIPI(Reversed Interior Point Intermodal)","MBS(Micro Bridge Service)","ALB(American Land Bridge)"],"a":3},{"id":754,"t":[[1,"355"]],"q":"다음 선하증권에 기재되는 중량 및 용적은 다음 어느 서류의 기재내용과 일치해야 하나?","c":["운항준비서","용적·중량증명서","인도지시서","하도지시서"],"a":1},{"id":755,"t":[[1,"356"]],"q":"다음 중 수입화물이 선하증권보다 먼저 목적항에 도착하여 통관이 지연되어 화물의 변질, 보관료 증가, 판매기회의 상실 등의 부담이 발생할 우려가 있을 때 이러한 불편을 해소하기 위하여 수화인이 사용할 수 있는 서류는?","c":["D/O(Delivery Order)","T/S(Tally Sheet)","L/G(Letter of Guarantee)","T/R(Trust Receipt)"],"a":2},{"id":756,"t":[[1,"357"]],"q":"다음 중 Container B/L의 경우 운송물 수취지로 기재되는 장소가 될 수 없는 곳은?","c":["CY(Con- tainer Yard)","CFS(Container Freight Station)","RFS(Rail Freight Station","Port of Loading"],"a":3},{"id":757,"t":[[1,"358"]],"q":"다음 중 해상운송에서 사용되는 C/P(Charter Party)라는 용어와 밀접한 관련이 있는 것은?","c":["Shipping conference","Liner vessel","Tramper","Tariff rate"],"a":2},{"id":758,"t":[[1,"359"]],"q":"다음 중 화주가 프레이트 포워더에게 화물의 멸실ㆍ훼손에 관한 클레임을 청구할 때 제출하는 서류가 아닌 것은?","c":["Claim Letter","B/L Copy","Survey Report","Cargo Insurance Policy"],"a":3},{"id":759,"t":[[1,"360"]],"q":"다음에서 무신용장거래의 경우 매수인에 대한 설명으로 올바른 것은?","c":["매수인은 매도인 앞으로 일람출급의 환어음을 발행한다.","매수인은 환어음과 선하증권에 백지배서한다.","매수인은 백지배서된 지시식 선하증권을 가지고 있으므로 선하증권의 소지인이 된다.","매수인이 운송인에게 물건을 인도하고 운송인은 매수인의 지시식으로 선하증권을 발행한다."],"a":2},{"id":760,"t":[[1,"361"]],"q":"다음 중 화물자동차와 철도가 결합되어 운송되는 복합운송방식은?","c":["피기백 방식(Piggy back system)","피쉬백 방식(Fishy back system)","버디백 방식(Birdy back system)","랜드 브리지 방식(Land bridge system)"],"a":0},{"id":761,"t":[[1,"362"]],"q":"다음에서 선하증권의 기재사항 중 우리나라 상법 상 임의 기재사항은?","c":["선장명, 선박톤수","본선항해번호, 환율","운송물의 종류, 중량 또는 용적","선적항, 양륙항"],"a":1},{"id":762,"t":[[1,"363"]],"q":"다음 중 선하증권 법정기재사항에서 포장의 종류및 개수에 대한 설명으로 관계가 없는 것은?","c":["송화인의 운송물이 손상·멸실되거나 과부족 등이 발생할 때에 운송인에게 손해배상을 청구하는데 선하증권에 기재된 운송물의 개수가 산정기준이 된다.","Hague Rules는 송화인이 당해 화물의 가격을 신고하고, 선하증권에 기재한 경우에는 그 화물이 손상 또는 멸실하였을 때 그 신고가격이 운송인의 손해배상 한도액이다.","선하증권에 container내에 적입된 물건의 포장단위가 기재되지 않고 container단위만 기재되어 있는 경우 각 container가 포장(package)의 단위로 간주된다.","선하증권에 container에 적입된 포장의 개수가 기재되어 있는 경우 container내에 적입된 포장의 개수는 일괄적으로 전체를 하나의 포장의 수로 취급된다."],"a":3},{"id":763,"t":[[1,"364"]],"q":"다음에서 Sea & Air 복합운송에 대한 설명으로 올바른 것은?","c":["출발지로부터 중계지까지는 항공운송되고 거기에서 최종목적지까지는 해상으로 운송되는 복합운송형태이다.","최초에는 한국, 일본을 비롯한 극동지역으로부터 OCP화물이 영국 및 유럽항구에 도착한 후 북미내륙 OCP Area로 항공운송되는 형태이었다.","해상운송의 저렴성과 항공운송의 신속성이라는 장점을 결합한 방식이다.","주로 Micro Bridge Service(MBS)의 경로에 주로 채택된 운송수단방식이다."],"a":2},{"id":764,"t":[[1,"365"]],"q":"복합운송주선업의 승계 중 상속 신고시에 첨부해야 하는 서류로 올바르지 못한 것은 어느 것인가?","c":["신고인인 상속인과 피상속인의 관계를 증명하는 서류","신고인과 동 순위의 다른 상속인이 있는 경우 그의 동의서","피상속인의 사망 증명 서류.","상속인의 거주지를 관할하는 시장ㆍ군수 또는 구청장의 동의서"],"a":3},{"id":765,"t":[[1,"366"]],"q":"장금복합운송은 부산항에서 미국의 네브라스카, 사우드타코타, 시카고 등 록키산맥 동부 내륙까지의 복합운송에 전문화 된 기업이다. 이 기업이 주로 이용하는 국제복합운송경로는?","c":["CLB","IPI","ALB","SLB"],"a":1},{"id":766,"t":[[1,"367"]],"q":"다음의 예는 선화증권의 배서방식 중 어는 것을 말하는가?\nDeliver to . . . Co., Ltd\nTigers Trading Co., Ltd.\n(signed)\n----------\nManger","c":["기명식","지시식","백지식","선택무기명식"],"a":0},{"id":767,"t":[[1,"368"]],"q":"다음은 복합운송서비스와 관련된 설명으로 옳지 않은 것은?","c":["선사가 발행하는 것을 Master B/L, 복합운송업자가 발행하는 것을 House B/L이라 한다.","복합운송의 대표적인 형태가 Sea & Air 방식이며, 각종 Land Bridge 방식도 이의 일종이다.","국제복합운송은 이른 바 “Door to Door Service”를 지향하는 것으로 복합운송업자는 하주에 대해 전운송구간에 대한 일괄책임을 진다.","복합운송서류는 전복합운송구간의 단일책임을 강화하기 위하여 원칙적으로 선박을 보유한 복합운송업자만이 발행할 수 있다."],"a":3},{"id":768,"t":[[1,"369"]],"q":"다음 중 미국서안에서 철도 등의 내륙운송을 거쳐 미국 동안 또는 걸프지역 항만까지 수송하는 해륙복합운송의 형태는?","c":["Interior Point Intermodal","Mini Land Bridge","Micro Land Bridge","America Land Bridge"],"a":1},{"id":769,"t":[[1,"370"]],"q":"다음에서 외관상 운송품의 상태에 대한 선하증권상의 기재에 대한 설명으로 옳지 않은 것은?","c":["선적선하증권(On Board B/L)의 경우에는 선적에서 양륙항까지 운송인이 책임을 진다.","운송인이 선적 또는 수취할 때 외관상으로 점검하여 이상이 없으면 그 책임을 지지 않는다.","수치선하증권(Received B/L)의 경우에는 수취에서 인도 이전까지의 화물의 사고 발생에 대해 운송인이 책임을 진다.","본선수취증(mate's receipt)에 고장적요가 있는 경우에는 운송인에게 책임이 없다는 취지를 표시하기 위해 선하증권에도 고장적요가 기재된다."],"a":2},{"id":770,"t":[[1,"371"]],"q":"다음에서 복합운송방식을 성립시키는 기본요건에 해당되지 않는 것은?","c":["단일운임 적용","단일증권 발행","단일책임 체계","도로운송과 철도운송 간의 연계운송"],"a":3},{"id":771,"t":[[1,"372"]],"q":"다음 중 운송화물이 선박에 적재되었음을 증명하며, 적재된 화물을 목적지에서 수화인에게 인도할 것을 약정하여 선박회사가 발행하는 유가증권으로 옳은 것은?","c":["해상화물운송장(Sea Waybill)","수입화물선취보증장(Letter of Guarantee)","신용장 (Letter of Credit)","선하증권(Bill of Lading)"],"a":3},{"id":772,"t":[[1,"373"]],"q":"다음 Hague Rules에서의 인적적용범위에서 이해관계인에 대한 설명으로 적절한 것은?","c":["운송인은 해상운송계약의 전부를 이행하는 자로 계약운송인으로부터 위탁받아 현실로 운송행위를 하는 자를 말한다.","수화인은 계약운송인과 해상운송계약을 체결하는 자를 말한다.","계약운송인은 송화인과 해상운송계약을 체결한 자를 말한다.","운송취급인은 물건을 인도를 받을 권리를 가진 자를 말한다."],"a":2},{"id":773,"t":[[1,"374"]],"q":"다음은 운송과 관련된 국제조약으로 조약과 관련된 운송수단으로 바르게 연결된 것은?\n가. Hamburg Rules 1978\n나. UNCTAD/ICC Rules 1992\n다. Motreal Convention 1999\n(보기 순서: 가 / 나 / 다)","c":["항공운송 - 해상운송 - 복합운송","도로운송 - 항공운송 - 해상운송","해상운송 - 복합운송 - 도로운송","해상운송 - 복합운송 - 항공운송"],"a":3},{"id":774,"t":[[1,"375"]],"q":"다음에서 수취선하증권(Received B/L) 상의 선박의 명칭에 관련 된 설명으로 올바르지 않은 것은?","c":["수취선하증권상의 선박명란에 선적 예정인 선박명을 기재한다.","선박명란에 선박명과 함께 \"or subsequent vessel\"이라고 기재하여 발행한다.","선박의 명칭을 \"intended vessel name\"으로 기재해도 수리한다고 규정하고 있다.","운송인이 운송물을 실제로 선박에 선적한 후 발행되므로 선하증권에 선박명칭이 기재된다."],"a":3},{"id":775,"t":[[1,"376"]],"q":"다음에서 운송물의 멸실, 훼손, 지연 손해가 복합운송의 어느 구간에서 발생하였는가를 묻지않고 복합운송인은 동일한 기준에 따라 책임을 지는 체계는?","c":["분할책임체계","변형단일책임체계","단일책임체계","절충형책임체계"],"a":2},{"id":776,"t":[[1,"377"]],"q":"다음 중 무신용장 거래와 신용장 거래의 경우의 차이점으로 적당한 것은?","c":["원칙적으로 무신용장거래와 신용장거래는 별 차이가 없다.","매도인은 환어음과 선하증권에 백지배서한다.","환어음 및 선적서류를 제시받는 수출지의 은행이 지급·인수·매입 또는 연지급을 한다.","매도인이 운송인에게 물건을 인도하고 운송인은 매도인의 지시식으로 선하증권을 발행한다."],"a":2},{"id":777,"t":[[1,"378"]],"q":"다음에서 항공화물 혼재업자(consoliator)의 역할에 관한 설명 중 틀린 것은?","c":["Unifor Liability System","Network Liability System","Tie-up System","Flexible Liability System"],"a":3},{"id":778,"t":[[1,"379"]],"q":"해상운송에서 선박회사가 선적된 화물을 확인한 후 화물에 이상이 있는 경우 사고부 선하증권(Dirty B/L)울 발행하는데 이를 은행이 매입하지 않으므로 수출상은 선박회사에 무엇을 제출하면 Clean B/L을 발행 받을 수 있는가?","c":["L/I(Letter of Indemnity)","T/R(Trust Receipt)","L/G(Letter of Guarantee)","Shipped B/L"],"a":0},{"id":779,"t":[[1,"380"]],"q":"실제적으로 선하증권의 송화인(shipper)란에는 운송곙약자가 제시한 서류에 의거하요 기입되는 내용이 아닌 것은?","c":["운송계약의 당사자가 아닌 제3자의 성명","신용장상의 수익자","수입업자의 대리인","지급은행의 대리인"],"a":3},{"id":780,"t":[[1,"381"],[4,""],[4,""]],"q":"다음에서 해상화물운송장(Sea Waybill)에 대한 설명으로 부적합한 것은?","c":["권리증권이므로 항해 중에 증권을 이전함으로써, 물품의 전매나 담보가 가능하다.","해상화물운송장에 관한 규칙은 CMI uniform rules for Sea Waybill 1990 이다.","계약상품의 인도 또는 적재를 입증하는 비유가 증권 서류이다.","송화인에게 발행하는 서류이지만, 선하증권과 달리 운송품 인도청구권을 상징하지 않기 때문에 양도성이 없다."],"a":0},{"id":781,"t":[[1,"382"],[4,""]],"q":"다음 중 UNCTAD/ICC 복합운송증권규칙에 대한 내용으로 옳지 않은 것은?","c":["단일운송 또는 복합운송의 여부와 무관하게 운송계약에 적용할 수 있다.","운송인의 반증책임을 전제로 한 과실책임원칙과 함께 변형통합책임체계를 채택하였다.","화물 인도 후 9개월 내에 소송이 제기되지 않으면 운송인은 모든 책임을 면한다.","운송인은 사용인의 항해과실 및 본선 관리상의 과실, 고의 또는 과실에 의한 화재가 아닌 경우 면책이지만 감항성 결여는 예외없이 귀책사유이다."],"a":3},{"id":782,"t":[[1,"383"],[4,""]],"q":"Hague Rules에서 적용대상에서 생동물을 제외시킨 이유로 올바르지 않은 것은?","c":["운송인이 운송을 인수하는 것을 기피한다.","생동물의 운송은 항해상 각종의 위험을 수반할 수 있다.","특약을 엄중하게 제한 하면 운임이 크게 오른다.","송화인에게 너무 편중된 이익을 초래한다."],"a":3},{"id":783,"t":[[1,"384"]],"q":"국내 상법상 선하증권의 기재사항 중 법정기재사항이 아닌 것은?","c":["선박의 명칭","송하인의 성명","면책종항","운임"],"a":2},{"id":784,"t":[[1,"385"],[4,""],[4,""]],"q":"다음 이종책임체계에서 복합운송인이 항공운송구간에서는 무엇에 의해서 책임체계가 결정되는가?","c":["CIM 조약","Hague Rules","Warsaw Convention","CMR 조약"],"a":2},{"id":785,"t":[[1,"386"]],"q":"다음 신용장의 종류에서 수출지의 은행이 지급인 및 인수인이 되는 것이 통례인 것은?","c":["매입신용장(negotiation credit)","연지급신용장(deferred payment credit)","지급신용장(payment credit)","확인신용장(confirmed credit)"],"a":1},{"id":786,"t":[[1,"387"],[4,""]],"q":"다음 중 운송서류의 정당한 수화인에 관한 설명으로 옳지 않은 것은?","c":["지시식 선하증권 중 \"to order\"로 발행된 경우 신용장 매입은행이 배서한 선하증권 원본 소지인","기명식 선하증권으로 발행된 경우 consignee란에 기재되어 있는 자","지시식 선하증권 중 \"to order of shipper\"로 발행된 경우 shipper가 배서한 선하증권 원본 소지인","지시식 선하증권 중 \"to the order of D bank\"로 발행된 경우 D은행이 지시한 자"],"a":0},{"id":787,"t":[[1,"388"],[4,""]],"q":"다음에서 복합운송증권과 통선하증권과의 차이를 설명한 것 중 올바른 것은?","c":["복합운송증권은 복합운송계약의 하청형태이고 통선하증권은 형태를 불문한다.","복합운송증권은 각 운송인 분할책임이고 통선하증권은 전구간 단일책임이다.","복합운송증권은 B/L 형식이나 통선하증권은 B/L 이외의 형식도 존재한다.","복합운송증권은 증권의 발행인으로 선박회사와 그 대리인이나 통선하증권은 운송주업자도 가능하다."],"a":0},{"id":788,"t":[[1,"389"]],"q":"화환어음의 결제 방식중 무신용장거래의 경우 누가 환어음과 선하증권에 백지배서하는가?","c":["매수인","매도인","운송인","수입인"],"a":1},{"id":789,"t":[[1,"390"]],"q":"다음 중 국제운송에서 Freight Forwarder가 취급할 수 있는 사업영역에 해당되지 않는 것은?","c":["국제운송물류에 대한 전반적인 컨설팅","화물의 집화, 분배, 혼재 서비스","보험의 수배 및 담보조건 등에 관한 제안","운송사고 하자물품에 대한 검정보고서의 발급"],"a":3},{"id":790,"t":[[1,"391"]],"q":"복합운송주선업자가 등록한 사항을 변경하고자 하는 경우에는 변경사유가 발생한 날부터 몇 일 이내에 변경등록을 하여야 하는가?","c":["10일 이내","15일 이내","30일 이내","60일 이내"],"a":2},{"id":791,"t":[[1,"392"]],"q":"신용장에서 환어음 만기가 선적일 후 일정기간으로 명시된 경우 하나의 환어음에 대하여 세 세트의 다음과 같은 선하증권이 제시되었다면 어느 일자를 선적일로 간주하는가?\n구분 선하증권1 선하증권2 선하증권3\nonboard notation date 11/19 11/22 11/24\n발행일 11/20 11/19 11/23","c":["11월 19일","11월 20일","11월 22일","11월 24일"],"a":3},{"id":792,"t":[[1,"393"]],"q":"다음 중 무신용장거래의 경우 매수인의 권리에 대한 설명으로 맞는 것은?","c":["선하증권을 발행하는 자","운송인이 물건을 인도하여야 할 증권상 권리를 가진 자","선하증권에 백지배서하는 자","환어음을 발행하는 자"],"a":1},{"id":793,"t":[[1,"394"]],"q":"다음 중 신용장통일규칙에 대한 설명 중 적합하지 않은 것은?","c":["일류 검사기관이 발행한 검사증명서를 요구하였다면 수익자 이외의 자라면 어떤자가 발행하였더라도 검사증명서는 수리할 수 있다.","신용장에서 서류사본을 개설의뢰인에게 선적 후 즉시 송부한 것을 증명하는 \"beneficiary's certificate를 요구하였다면 이 경우 이 증명서에는 수익자가 선적 후 3일 이내에 서류 사본을 송부하였다는 것이 기재되어야 한다.","신용장은 취소불능이라는 표시가 없더라도 취소가 불가능하다.","서로 다른 국가에 있는 은행의 지점은 separate bank로 간주되다."],"a":1},{"id":794,"t":[[1,"395"]],"q":"다음 중 갑판적의 물건에 대한 Hague Rules의 적용을 제외한 이유와 관련된 사항을 설명한 것으로 적합하지 않은 것은?","c":["갑판적 물건이 현실로 갑판에 적재되어 운송되어지는 것을 조건으로 적용되어야 한다.","선하증권에 갑판적이라고 기재하는 것만으로도 갑판적 물건이라고 적용되어야 한다.","갑판적 물건이 최초부터 선창에 적재된 경우 또는 운송 중에 선창에 적재된 경우에는 Hague Rules가 적용되어야 한다.","물건의 일부가 선창에 적재된 경우에는 그 물건이 가분물이면 전부에 대하여 Hague Rules가 적용되어야 한다."],"a":1},{"id":795,"t":[[1,"396"]],"q":"다음 중 신용장거래에서 용선계약부 선하증권의 서명권자가 아닌 것은?","c":["Carrier","Owner","Master","Charterer"],"a":0},{"id":796,"t":[[1,"397"]],"q":"다음 중 피배서인의 이름이 명기되지 않고 송화인 또는 신용장 발행은행 지시를 받아, 화물을 인도하라는 문언과 함께 배서인이 서명하는 배서 방식은?","c":["기명식","지시식","백지식","선택무기명식"],"a":1},{"id":797,"t":[[1,"398"]],"q":"신용장거래엣 선하증권 요구시 별도의 허용문언이 없는 경우 하자로 취급받게 되는 선하증권의 내용은?","c":["packing may not be sufficient for the sea journey","goods shipped on deck","shipper's load and count","the carrier reserves the right to tranship"],"a":1},{"id":798,"t":[[1,"399"]],"q":" const NUM="①②③④";
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
// 된소리는 예사소리와 같이 취급(ㄱ으로 ㄲ도 찾기)
const PLAIN={"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};
// 폰 자판에서 ㄱ,ㅅ을 연달아 치면 ㄳ 한 글자로 합쳐지는 경우가 있어 다시 나눔
const SPLIT={"ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ"};
const ALNUM=/[0-9A-Za-z]/;
const isSyl=c=>c>=0xAC00&&c<=0xD7A3;
const plain=j=>PLAIN[j]||j;

// 한글·영문·숫자만 남긴 검색용 배열. at[k] = 원문에서의 위치(하이라이트용)
function prep(s){
  const ch=[],cho=[],at=[];
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    if(isSyl(c)){ch.push(c);cho.push(plain(CHO[Math.floor((c-0xAC00)/588)]));at.push(i);}
    else if(ALNUM.test(s[i])){const l=s[i].toLowerCase();ch.push(l.charCodeAt(0));cho.push(l);at.push(i);}
  }
  return {ch,cho,at};
}

function parseTerm(t){
  const toks=[];
  for(const x of t){
    const c=x.charCodeAt(0);
    if(isSyl(c)) toks.push({k:"s",c});
    else if(SPLIT[x]) for(const y of SPLIT[x]) toks.push({k:"j",v:y});
    else if(CHO.includes(x)) toks.push({k:"j",v:plain(x)});
    else if(ALNUM.test(x)) toks.push({k:"a",v:x.toLowerCase().charCodeAt(0)});
  }
  if(toks.length&&toks[toks.length-1].k==="s") toks[toks.length-1].last=true;
  return toks;
}

// p 위치부터 맞으면 끝 위치, 아니면 -1
function matchAt(P,toks,p){
  let i=p;
  for(const k of toks){
    if(i>=P.ch.length) return -1;
    if(k.k==="j"){ if(P.cho[i]!==k.v) return -1; i++; continue; }
    if(k.k==="a"){ if(P.ch[i]!==k.v) return -1; i++; continue; }
    const tc=P.ch[i];
    if(tc===k.c){ i++; continue; }
    // 마지막 글자는 아직 입력 중일 수 있음: "기"로 "긴"도, "깅"으로 "기용"도 찾기
    if(!k.last||!isSyl(tc)) return -1;
    const qb=k.c-0xAC00,tb=tc-0xAC00;
    if(Math.floor(qb/28)!==Math.floor(tb/28)) return -1;
    const qj=qb%28;
    if(qj===0){ i++; continue; }
    let keep=0,carry=JONG[qj];
    if(SPLIT[carry]){ keep=JONG.indexOf(SPLIT[carry][0]); carry=SPLIT[carry][1]; }
    if(tb%28!==keep||i+1>=P.ch.length||P.cho[i+1]!==plain(carry)) return -1;
    i+=2;
  }
  return i;
}
// 0: 단어 첫머리에서 한 단어 안에 맞음, 1: 첫머리지만 띄어쓰기를 걸침, 2: 단어 중간
function quality(s,P,[a,b]){
  const i=P.at[a],prev=i>0?s[i-1]:" ";
  if(isSyl(prev.charCodeAt(0))||ALNUM.test(prev)) return 2;
  return /\s/.test(s.slice(i,P.at[b-1]+1))?1:0;
}
function find(P,toks){
  for(let p=0;p<P.ch.length;p++){ const e=matchAt(P,toks,p); if(e>=0) return [p,e]; }
  return null;
}

DATA.forEach(it=>{ it.P={q:prep(it.q),c:it.c.map(prep)}; });

const KEY="haeun-chosung-v1";
const opt={sheet:-1,expand:false,hide:false,all:false,recent:[]};
try{ Object.assign(opt,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
if(!Array.isArray(opt.recent)) opt.recent=[];
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(opt)); }catch(e){} }

const $=id=>document.getElementById(id);
const input=$("q"),list=$("list"),status=$("status"),more=$("more"),hint=$("hint"),clear=$("clear");
const pad=$("pad"),padShow=$("padShow"),chips=$("chips");
const PAGE=40;
let matched=[],view=[],shown=0,byId=new Map();
const revealed=new Set(),opened=new Set();

function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s,P,ranges){
  if(!ranges||!ranges.length) return esc(s);
  const m=new Uint8Array(s.length);
  for(const [a,b] of ranges) for(let k=P.at[a];k<=P.at[b-1];k++) m[k]=1;
  let out="",on=false;
  for(let i=0;i<s.length;i++){
    if(m[i]&&!on){ out+="<mark>"; on=true; } else if(!m[i]&&on){ out+="</mark>"; on=false; }
    out+=esc(s[i]);
  }
  return on?out+"</mark>":out;
}

function search(){
  const raw=input.value.trim();
  const terms=raw?raw.split(/\s+/).map(parseTerm).filter(t=>t.length):[];
  matched=[];
  for(const it of DATA){
    if(!terms.length){ matched.push({it,h:null,s:0,p:0}); continue; }
    // 점수가 낮을수록 위: 맞은 모양(단어 첫머리·한 단어 안 > 띄어쓰기 걸침 > 단어 중간)이 먼저, 그다음 정답 > 문제 > 다른 보기
    const h={q:[],c:[[],[],[],[]]};
    let ok=true,score=0,pos=1e9;
    for(const toks of terms){
      let best=99;
      const rq=find(it.P.q,toks);
      if(rq){ h.q.push(rq); best=quality(it.q,it.P.q,rq)*3+1; if(pos===1e9) pos=rq[0]; }
      for(let j=0;j<4;j++){
        if(j!==it.a&&!opt.all) continue;
        const rc=find(it.P.c[j],toks);
        if(rc){ h.c[j].push(rc); best=Math.min(best,quality(it.c[j],it.P.c[j],rc)*3+(j===it.a?0:2)); }
      }
      if(best===99){ ok=false; break; }
      score+=best;
    }
    if(ok) matched.push({it,h,s:score,p:pos});
  }
  matched.sort((x,y)=>x.s-y.s||x.p-y.p);
  applySheet();
}

function applySheet(){
  view=opt.sheet<0?matched:matched.filter(r=>r.it.t.some(t=>t[0]===opt.sheet));
  byId=new Map(view.map(r=>[r.it.id,r]));
  shown=0; list.innerHTML="";
  renderChips();
  const raw=input.value.trim();
  clear.hidden=!input.value;
  hint.hidden=!!raw;
  if(!raw) renderHint();
  status.textContent=raw?`“${raw}” ${view.length}개`:`${opt.sheet<0?"전체":SHEETS[opt.sheet]} ${view.length}문제`;
  if(!view.length) list.innerHTML=`<div class="empty">찾는 문제가 없어요.<br>초성을 하나 지우거나 다른 시트를 골라 보세요.</div>`;
  page();
}

function page(){
  const next=view.slice(shown,shown+PAGE);
  list.insertAdjacentHTML("beforeend",next.map(card).join(""));
  shown+=next.length;
  more.hidden=shown>=view.length;
  if(!more.hidden) more.textContent=`더 보기 (${view.length-shown}개 남음)`;
}

function card(r){
  const it=r.it,h=r.h||{q:null,c:[]};
  const tags=it.t.map(([s,n])=>`<span class="tag">${SHEETS[s]}${n?" "+n:""}</span>`).join("");
  const show=!opt.hide||revealed.has(it.id);
  const ans=show
    ?`<div class="ans"><span class="no">${NUM[it.a]}</span><span>${hl(it.c[it.a],it.P.c[it.a],h.c[it.a])}</span></div>`
    :`<button class="ans veil" data-reveal="${it.id}">정답 보기</button>`;
  const note=it.n&&show?`<div class="note"><b>정답표 확인 필요</b> · ${esc(it.n)}</div>`:"";
  const open=opt.expand||opened.has(it.id);
  const opts=open?`<ol class="opts">${it.c.map((c,j)=>
    `<li class="${j===it.a&&show?"ok":""}"><span>${NUM[j]}</span><span>${hl(c,it.P.c[j],h.c[j])}</span></li>`).join("")}</ol>`:"";
  const foot=opt.expand?"":(open?"보기 접기 ▴":"보기 전체 ▾");
  return `<article class="card" data-id="${it.id}"><div class="tags">${tags}</div>`+
    `<p class="q">${hl(it.q,it.P.q,h.q)}</p>${ans}${note}${opts}<div class="foot">${foot}</div></article>`;
}
function rerender(id){
  const el=list.querySelector(`.card[data-id="${id}"]`), r=byId.get(id);
  if(el&&r) el.outerHTML=card(r);
}

function renderChips(){
  const cnt=[0,0,0,0,0];
  for(const r of matched) for(const s of new Set(r.it.t.map(t=>t[0]))) cnt[s]++;
  const sheets=[[-1,"전체",matched.length]].concat(SHEETS.map((n,i)=>[i,n,cnt[i]]));
  chips.innerHTML=sheets.map(([i,n,c])=>
    `<button class="chip${opt.sheet===i?" on":""}" data-sheet="${i}">${n}<span class="n">${c}</span></button>`).join("")+
    `<span class="sep"></span>`+
    OPTS.map(([k,n])=>`<button class="chip opt${opt[k]?" on":""}" data-opt="${k}" aria-pressed="${!!opt[k]}">${n}</button>`).join("");
}

function renderHint(){
  const rec=opt.recent.length
    ?`<div class="sec-t"><span>최근 검색</span><button class="link" data-clear-recent>지우기</button></div>`+
     `<div class="ex">${opt.recent.map(q=>`<button data-q="${esc(q)}"><b>${esc(q)}</b></button>`).join("")}</div>`:"";
  hint.innerHTML=rec+
    `<div class="sec-t"><span>이렇게 찾아요</span></div>`+
    `<div class="ex">${EXAMPLES.map(([q,w])=>`<button data-q="${q}"><b>${q}</b>${w}</button>`).join("")}</div>`+
    `<div class="tip">⌫ 길게 누르면 전부 지워요 · 영어는 ABC · 띄어 쓰면 두 단어 모두 들어간 문제만</div>`;
}

// 최근 검색: 결과를 본 검색어만 남김
let remTimer=0;
function remember(v){
  v=(v||"").trim(); if(!v) return;
  opt.recent=[v,...opt.recent.filter(x=>x!==v)].slice(0,8); save();
}
function setQuery(v){
  input.value=v;
  search();
  window.scrollTo(0,0); anchorY=0;
  clearTimeout(remTimer);
  remTimer=setTimeout(()=>{ if(view.length) remember(input.value); },1500);
}

// 초성 키패드
let padOn=true,padAuto=false,anchorY=0;
function setPad(on,auto){
  padOn=on; padAuto=!on&&!!auto;
  pad.classList.toggle("off",!on);
  document.body.classList.toggle("padoff",!on);
  padShow.hidden=on;
  if(on) anchorY=window.scrollY;
}
function measurePad(){ document.body.style.setProperty("--padh",pad.offsetHeight+"px"); }
$("keys").innerHTML=[...KEYS].map(k=>`<button class="k" data-k="${k}">${k}</button>`).join("")+
  `<button class="k fn" data-act="hide" aria-label="키패드 숨기기">▾</button>`+
  `<button class="k fn" data-act="abc">ABC</button>`+
  `<button class="k fn space" data-act="space">띄어쓰기</button>`+
  `<button class="k fn back" data-act="back" aria-label="지우기">⌫</button>`;
const buzz=()=>{ try{ if(navigator.vibrate) navigator.vibrate(5); }catch(e){} };
let longFired=false,longTimer=0;
pad.addEventListener("mousedown",e=>e.preventDefault());
pad.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.k){ buzz(); setQuery(input.value+b.dataset.k); return; }
  const a=b.dataset.act;
  if(a==="back"){
    if(longFired){ longFired=false; return; }
    if(input.value){ buzz(); setQuery([...input.value].slice(0,-1).join("")); }
  } else if(a==="space"){
    if(input.value&&!/\s$/.test(input.value)){ buzz(); setQuery(input.value+" "); }
  } else if(a==="abc"){
    setPad(false); input.setAttribute("inputmode","search"); input.focus();
  } else if(a==="hide"){
    setPad(false);
  }
});
const back=pad.querySelector('[data-act="back"]');
back.addEventListener("pointerdown",()=>{
  longFired=false; clearTimeout(longTimer);
  longTimer=setTimeout(()=>{ longFired=true; buzz(); setQuery(""); },500);
});
["pointerup","pointerleave","pointercancel"].forEach(t=>back.addEventListener(t,()=>clearTimeout(longTimer)));
padShow.addEventListener("click",()=>setPad(true));
input.addEventListener("focus",()=>{ if(input.getAttribute("inputmode")==="none") setPad(true); });
input.addEventListener("blur",()=>{
  if(input.getAttribute("inputmode")!=="none"){ input.setAttribute("inputmode","none"); setPad(true); }
});
// 결과를 내려 읽으면 키패드를 접고, 맨 위로 오면 다시 펼침
window.addEventListener("scroll",()=>{
  const y=window.scrollY;
  if(padOn&&y>anchorY+80) setPad(false,true);
  else if(!padOn&&padAuto&&y<20) setPad(true);
},{passive:true});
if("ResizeObserver" in window) new ResizeObserver(measurePad).observe(pad);
measurePad();

let timer=0;
input.addEventListener("input",()=>{ clearTimeout(timer); timer=setTimeout(()=>setQuery(input.value),60); });
input.addEventListener("keydown",e=>{ if(e.key==="Escape") setQuery(""); if(e.key==="Enter") input.blur(); });
clear.addEventListener("click",()=>setQuery(""));
chips.addEventListener("click",e=>{
  const s=e.target.closest("[data-sheet]");
  if(s){ opt.sheet=+s.dataset.sheet; save(); applySheet(); window.scrollTo(0,0); return; }
  const o=e.target.closest("[data-opt]"); if(!o) return;
  const k=o.dataset.opt; opt[k]=!opt[k]; save();
  if(k==="hide") revealed.clear();
  if(k==="all") search(); else applySheet();
});
hint.addEventListener("click",e=>{
  if(e.target.closest("[data-clear-recent]")){ opt.recent=[]; save(); renderHint(); return; }
  const b=e.target.closest("[data-q]"); if(!b) return;
  setQuery(b.dataset.q); remember(b.dataset.q);
});
list.addEventListener("click",e=>{
  const rv=e.target.closest("[data-reveal]");
  if(rv){ const id=+rv.dataset.reveal; revealed.add(id); rerender(id); remember(input.value); return; }
  const c=e.target.closest(".card"); if(!c||opt.expand) return;
  if(String(window.getSelection?window.getSelection():"").length) return;
  const id=+c.dataset.id; opened.has(id)?opened.delete(id):opened.add(id); rerender(id); remember(input.value);
});
more.addEventListener("click",page);
if("IntersectionObserver" in window){
  new IntersectionObserver(es=>{ if(es[0].isIntersecting&&!more.hidden) page(); },{rootMargin:"400px"}).observe(more);
}

const m=location.hash.match(/q=([^&]*)/);
if(m){ try{ input.value=decodeURIComponent(m[1]); }catch(e){} }
search();
})();
</script>
</body>
</html>
